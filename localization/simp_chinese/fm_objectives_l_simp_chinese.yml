l_simp_chinese:
 objective_rising: "新兴强权"
 objective_rising_desc: "全球被划分为众多主权国家，每个国家都注定要攀升至拥有强大实力和影响力的境界。"
 objective_crumbling: "东方崛起"
 objective_crumbling_desc: "历史给了东方国家一个机会，一个将其影响力传播到世界各地的机会，但它们能够抓住这个机会吗？"
 objectives_ruler_med: "地中海的统治者"
 objectives_ruler_med_desc: "地中海，被许多人称为“文明的摇篮”，并且曾是众多伟大帝国的所在地，如今它正寻觅一位新的主宰者；\n许多国家都在角逐这一地位。"
 objective_new_world: "新世界"
 objective_new_world_desc: "新世界是一片充满无限可能的土地，而能否利用好这些可能性就取决于那些新建立的国家了。"
 objective_colonial: "殖民列强"
 objective_colonial_desc: "在过去的几个世纪里，那些国家建立起了庞大的殖民帝国，但它们是否能够维持住这个帝国呢？"
 objective_rising_idle_header: "请不要太计较这个模组的设定"
 objective_rising_idle_hint: "很遗憾，我不具备为每个国家撰写在历史上准确且合理的日志条目的知识，所以我的大部分工作都是从平衡性的角度来考虑的。\n如果你有任何建议，或者发现了任何不一致的地方或语法错误，烦请你通过在Steam创意工坊上发表评论的方式来反馈，谢谢。\n祝你玩得开心：）"
 objective_crumbling_idle_header: "请不要太计较这个模组的设定"
 objective_crumbling_idle_hint: "很遗憾，我不具备为每个国家撰写在历史上准确且合理的日志条目的知识，所以我的大部分工作都是从平衡性的角度来考虑的。\n如果你有任何建议，或者发现了任何不一致的地方或语法错误，烦请你通过在Steam创意工坊上发表评论的方式来反馈，谢谢。\n祝你玩得开心：）"
 objectives_ruler_med_idle_header: "请不要太计较这个模组的设定"
 objectives_ruler_med_idle_hint: "很遗憾，我不具备为每个国家撰写在历史上准确且合理的日志条目的知识，所以我的大部分工作都是从平衡性的角度来考虑的。\n如果你有任何建议，或者发现了任何不一致的地方或语法错误，烦请你通过在Steam创意工坊上发表评论的方式来反馈，谢谢。\n祝你玩得开心：）"
 objective_new_world_idle_header: "请不要太计较这个模组的设定"
 objective_new_world_idle_hint: "很遗憾，我没有足够的知识储备来为每个国家撰写在历史方面准确且合乎情理的日志条目，所以我的大部分工作都是出于平衡方面的考量来完成的。如果你有任何建议，或者发现了任何不合理之处或语法错误，恳请你通过在Steam创意工坊上发表评论的方式来反馈。\n\nMia帮忙进一步充实了关于北美原住民视角的内容，而H40p则贡献了几面旗帜，其中包括$YMN$以及$CAH$的不同版本旗帜。\n\n祝你玩得愉快：）\n"
 objective_colonial_idle_header: "请不要太计较这个模组的设定"
 objective_colonial_idle_hint: "很遗憾，我不具备为每个国家撰写在历史上准确且合理的日志条目的知识，所以我的大部分工作都是从平衡性的角度来考虑的。\n如果你有任何建议，或者发现了任何不一致的地方或语法错误，烦请你通过在Steam创意工坊上发表评论的方式来反馈，谢谢。\n祝你玩得开心：）"
 objective_rising_name_ENG: "英格兰王国"
 objective_rising_desc_ENG: "英格兰是一个落后的国家。起初，强大的贵族阶层阻碍了国王集权，后来，强大的中产阶级也同样如此。\n权力的高度分散使得这个国家成为了首个拥有宪法的国家，因为国王是被中产阶级逼迫才签署了宪法。但在过去的几个世纪里，这也造成了严重的国内不稳定局面，这正是英格兰始终未能实现英伦三岛统一的原因所在。"
 objective_rising_name_PUM: "波美拉尼亚公国"
 objective_rising_desc_PUM: "波美拉尼亚公国由瓦尔季斯拉夫一世于公元1120年建立，在格里芬家族的统治下已超过七个世纪。\n在过去的几个世纪里，这个公国的领土面积几经大幅扩张和收缩，但最终还是存续至今。"
 objective_rising_name_FRU: "巴黎宫廷"
 objective_rising_name_HEN: "汉诺威"
 objective_rising_name_SOK: "索科托"
 objective_rising_name_LOT: "东法兰克"
 objective_rising_name_CAS: "卡斯蒂利亚王国"
 objective_rising_name_KAR: "喀山罗斯"
 objective_rising_name_SWU: "瑞典王国"
 objective_rising_name_BAY: "巴伐利亚王国"
 objective_rising_name_SHW: "绍阿"
 objective_rising_name_FUN: "芬兰王国"
 objective_rising_name_BOH: "波希米亚王国"
 objective_rising_name_LLO: "伦巴第联盟"
 objective_rising_name_FLA: "佛兰德斯大公国"
 objectives_ruler_med_name_PUP: "教宗国"
 objectives_ruler_med_name_MUR: "马林苏丹国"
 objectives_ruler_med_name_HAK: "哈夫斯王国"
 objectives_ruler_med_name_BIZ: "东罗马帝国"
 objectives_ruler_med_name_TOR: "罗姆苏丹国"
 objectives_ruler_med_name_CTH: "迦太基"
 objectives_ruler_med_name_KAA: "阿拉贡王国"
 objective_rising_name_WRS: "华沙"
 objective_rising_name_IRE: "爱尔兰王国"
 objective_rising_name_LIT: "立陶宛"
 objective_rising_name_COH: "哥萨克盖特曼国"
 objective_rising_name_SER: "塞尔维亚"
 objective_rising_name_TOU: "图卢兹公国"
 objective_rising_name_DCQ: "阿基坦公国"
 objective_rising_name_SAE: "萨珊帝国"
 objective_rising_name_BUD: "勃艮第大公国"
 objective_rising_name_ARM: "亚美尼亚"
 objective_rising_name_BUL: "保加利亚"
 objective_rising_name_ZUR: "苏黎世"
 objective_rising_desc_ZUR: "在奥地利大公国覆灭以及随后苏黎世实现独立之后，苏黎世成功树立起了作为流亡政治家和鼓动者避风港的声誉。\n得益于这一点，苏黎世已成为世界上最为先进且自由的国家之一。"
 objective_rising_desc_BUL: "保加利亚与塞尔维亚、阿尔巴尼亚、克里特岛以及伊庇鲁斯一道，趁着东罗马帝国局势极度动荡之机，成功脱离了该帝国。\n如今已是第三次获得独立的保加利亚，必须为在世界上谋得一席之地而奋力拼搏。"
 objective_rising_desc_ARM: "得益于其开明君主亚历山大·梅利基扬的努力，亚美尼亚已成为中东地区最自由且最先进的国家。\n如今亚美尼亚已经独立，其未来看起来一片光明。"
 objective_rising_desc_BUD: "勃艮第大公国作为法国王国的封臣已有数百年之久，但如今勃艮第的实力已远超法国国王，大公已没有理由再臣服于法国王室。\n勃艮第的未来会怎样呢？"
 objective_rising_desc_FLA: "多亏了前任佛兰德公爵们的外交才能，佛兰德大公国才得以存续至今，但这在未来或许并不够。\n法兰西王国正开启权力集中化的进程，倘若佛兰德公爵不采取行动，该国的安全将永远受到威胁。"
 objectives_ruler_med_desc_HAK: "哈夫斯王朝的统治者有着柏柏尔人的血统，不过，为了让自身统治更具合法性，他们宣称自己是正统哈里发时代的第二任哈里发奥马尔的阿拉伯后裔。\n几个世纪以来，他们的王国在北非大幅扩张，征服了宰扬尼德王朝以及迦太基的土地。\n这个国家的未来会怎样呢？"
 objective_rising_desc_SAE: "在萨珊帝国覆灭之后，该王朝的残余势力发现自己在塞尔柱人的统治下治理着一小块领土，但随着塞尔柱人的衰落，他们最终在波斯重新获得了相当稳固的立足点。\n尽管萨珊王朝得以复兴，但伊斯兰教的广泛影响以及萨珊皇帝近期的改宗带来了重大挑战，引发了一场深刻的危机，因为这个帝国努力想要调和其琐罗亚斯德教的传统与新信仰的迅速传播以及由此带来的社会变革之间的矛盾。"
 objective_rising_desc_TOU: "西方教会大分裂为图卢兹公国提供了接近阿维尼翁教宗的机会。\n此时的教会急需资金，只要价格合适，教宗或许会接受承认图卢兹公爵对奥克西塔尼亚的宣称权。而一旦如此，图卢兹就能够成为奥克西塔尼亚王国。"
 objective_rising_desc_DCQ: "西方教会大分裂为图卢兹公国提供了接近阿维尼翁教宗的机会。\n此时的教会急需资金，只要价格合适，教宗或许会接受承认图卢兹公爵对奥克西塔尼亚的宣称权。而一旦如此，图卢兹就能够成为奥克西塔尼亚王国。"
 objective_rising_desc_SER: "塞尔维亚最近成功地从东罗马帝国中脱离出来。\n如今已然独立，这个国家的未来掌握在它自己的手中。"
 objective_rising_desc_LIT: "在波兰立陶宛联邦解体之后，立陶宛迅速与白俄罗斯以及哥萨克酋长国结成了联盟，以保障自身在面对波兰王国和芬兰王国时的安全。然而，如今波兰王国已然覆灭，芬兰又在近期与瑞典的战争中落败，这个联盟或许很快就会解散。"
 objective_rising_desc_COH: "哥萨克酋长国是由扎波罗热哥萨克的盖特曼（军事首领）博格丹·赫梅利尼茨基在1648年至1657年赫梅利尼茨基起义期间，于波兰立陶宛联邦东部领土上建立的。\n在波兰立陶宛联邦解体之后，哥萨克酋长国加入了由立陶宛和白俄罗斯组成的联盟以保障自身安全，然而新的形势或许很快就会导致这个联盟走向终结。"
 objective_rising_desc_SWU: "在过去的几十年里，瑞典王国可谓顺风顺水：从荷兰手中夺取了新荷兰地区，最近又在与芬兰王国的战争中取得了胜利，国家正在实现工业化，而且其海军实力堪称世界最强。\n瑞典的未来看起来一片光明。"
 objective_rising_desc_IRE: "爱尔兰最近刚刚统一成为一个王国。\n随着工业革命在不列颠群岛蔓延开来，这个新建立的王国面前有着无限的可能性。"
 objective_rising_desc_WRS: "华沙是组成现已覆灭的波兰王国的诸公国中最大的一个。\n波兰王国会复兴吗？还是说波兰立陶宛联邦将只是历史书上的一个章节？"
 objective_rising_desc_FUN: "芬兰王国仍然与有着数百年历史的封建制度紧密相连。\n芬兰能够摆脱封建主义并最终拥抱工业革命吗？"
 objective_rising_desc_HEN: "汉诺威是莱茵同盟的主导国家。\n这个同盟是莱茵邦联建立的直接结果。莱茵邦联是法国国王试图在其王国东部建立一个友好缓冲国的尝试，但邦联并没有维持多久。\n最终留下的是一些微型国家，它们迅速重组成为一个名为莱茵同盟的防御联盟。\n然而世界变化迅速，汉诺威的统治阶层深知目前这种局面不可能永远持续下去。"
 objectives_ruler_med_desc_KAA: "阿拉贡王国在其鼎盛时期统治着伊比利亚半岛东部和法国南部。得益于多次具有战略性的政治联姻，以及对其领土资源的明智利用，阿基坦家族几乎成功统一了整个伊比利亚半岛和法国。\n然而，时光荏苒，如今的阿拉贡王国已沦为一个区区地区性势力了。"
 objectives_ruler_med_desc_CTH: "在西罗马帝国覆灭之后，迦太基成功保留了自身的特性，并在早期逊尼派哈里发国家的扩张浪潮中幸存了下来。\n但时间对迦太基并不友好，因为这个国家正处于崩溃的边缘。如今，迦太基的领土已缩减至西西里岛、撒丁岛和科西嘉岛，而其首都迦太基城则是迦太基在北非的最后堡垒。"
 objectives_ruler_med_desc_TOR: "在19世纪初，罗姆苏丹国就已深陷多场战争之中。尽管已尝试进行了一些改革，但要阻止这个帝国走向衰落，还需要更多的改革举措。"
 objective_crumbling_name_JAP: "日本"
 objective_crumbling_name_SHN: "山西"
 objective_crumbling_name_TAC: "太平天国"
 objective_crumbling_name_ODU: "织田氏"
 objective_crumbling_name_SAU: "萨摩藩"
 objective_crumbling_name_YAG: "尤格拉帝国"
 objective_new_world_name_YUA: "元培避风港"
 objective_new_world_name_DKT: "$DKT$"
 objective_new_world_name_NSP: "新伊斯帕尼亚"
 objective_new_world_name_FOU: "四殖民领"
 objective_new_world_name_RPQ: "印加库斯库国"
 objective_new_world_name_AGA: "美利坚共和国联盟"
 objective_new_world_name_VNA: "西印度公司"
 objective_new_world_name_AMC: "新荷兰"
 objective_new_world_name_CAH: "$CAH$"
 objective_new_world_name_IQS: "$IQS$"
 objective_new_world_name_VSL: "$VSL$"
 objective_new_world_desc_FOU: "十多年前从英国独立出来的这四个殖民地，因其东部肥沃的土地和繁荣的贸易网络而享有显著的繁荣。\n尽管自解放以来一直保持低调，但民族主义情绪正在兴起，这可能会在民众中培养出一种共同的身份认同感。"
 objective_new_world_desc_RPQ: "塔万廷苏尤历经岁月沧桑，然而如今却陷入了极其严峻的危机之中。在失去了钦查伊苏尤和库拉苏尤的部分地区后，印加萨帕的影响力已大幅减弱。随着欧洲殖民地向南北方向不断扩张，这个帝国面临着令人畏惧的前景，唯有奇迹才能确保它的未来。"
 objective_new_world_desc_AMC: "在过去的一个世纪里，小小的新荷兰殖民地已发展成为一个繁荣的国家。但不幸的是，尽管随着时间的推移，其经济和人口都有所发展和变化，可它作为附属地的地位却从未改变。\n先是荷兰国王，而后是瑞典国王，这些君主始终仅仅将新荷兰视为一个遥远的殖民地，然而情况正在发生变化。\n一个新的独立派势力正在崛起并日益受到民众支持。如果他们能够成功掌权并推翻亲政府派（效忠派）的统治，那么他们就将有能力为国家的独立而战。"
 objective_new_world_desc_AGA: "美洲联合共和国是由阿根廷共和国、巴西共和国和乌拉圭共和国组成的一个联盟，这些国家在争取独立的斗争中结成了同盟。\n在获得自由之后，这些国家如今面临着因各自截然不同且多样的人口共同相处而产生的潜在挑战，这对这个新建立的联盟的稳定性构成了威胁。"
 objective_new_world_desc_FLU: "1820年，得益于法兰西王国的帮助，佛罗里达从威尼斯手中赢得了独立。\n这个仍处于法国保护之下的国家，正凭借其领土上的资源蓬勃发展。"
 objective_new_world_desc_VNA: "西印度公司于1766年通过整合威尼斯在加勒比地区的殖民地而成立。值得注意的是，它一直存续至今，并凭借对这些殖民地货物开采与贸易的垄断蓬勃发展。\n它的历史根源与当时的政治动态交织在一起，这使其能够不断适应并繁荣起来，从而成为全球商业领域中的一个重要参与者，也证明了威尼斯在新大陆的影响力经久不衰。"
 objective_new_world_desc_NSP: "新西班牙在经历了与卡斯蒂利亚的一场长期战争后，最近刚刚从卡斯蒂利亚手中赢得了独立。\n这个国家仍在从战争创伤中恢复，但至少它现在已经独立了。\n新西班牙的人民未来将会怎样呢？"
 objective_new_world_desc_DKT: "大平原上的达科他人$DKT_ADJ$部落最近刚刚在一位酋长的领导下实现了统一，但他们很快意识到，仅靠这一点并不足以确保这个新兴国家的生存。\n他们必须开启漫长的现代化进程，这样才能够抵御入侵势力，否则就不可避免地会走向灭亡。"
 objective_new_world_desc_BRZ: "在皇帝佩德罗一世退位后，巴西正处于动荡时期，国家由摄政者们治理。巴西能够成功克服这些障碍并崛起成为一个大国吗？"
 objective_new_world_desc_YUA: "元培庇护所是由郝宇·元培在1712年建立的，旨在为所有因各种原因不得不逃离中国的中国知识界人士提供一个安全的栖身之所。\n在历经一百多年后，这个小镇如今已发展成为一座繁荣的城市，但它也正面临着其整个历史中最大的危机。"
 objective_new_world_desc_CAH: "$CAH$是一个民族国家，拥有深厚的基于宗教价值观和传统铜器制作工艺的历史底蕴。仅仅在几百年前它走向了衰败，然而近年来随着所在大陆发生了巨大的变化，它又重新振作起来并得以巩固发展，许多人纷纷涌向这里，寻求它所承诺的安全庇护。"
 objective_new_world_desc_IQS: "随着$IQS$建立起来，它发现有残暴的入侵者登陆上岸，迫使阿尔冈昆人进入其境内。这些入侵者带来了可以融入$IQS_ADJ$根基的新思想。\n虽然$IQS$拥有土地优势来抵御入侵者，但反击必须迅速且精准，否则入侵者就会征服并屠杀他们的人民。"
 objective_new_world_desc_VSL: "韦斯特兰最初是为逃避故土严苛审判、渴望重新开始的北欧罪犯建立的避难所。几个世纪以来，它已发展为一个充满活力、繁荣昌盛的国家。"
 objective_crumbling_desc_ODU: "1588年，在织田信长的努力下，日本在后阳成天皇治下完成统一。\n尽管信长本人拒绝任何封号，但其子信忠——一位野心勃勃的将领——接受了“大君”称号，并成功使其成为世袭头衔。\n随着日本国势日盛，织田家族权势亦与日俱增，终成日本最具影响力的氏族。"
 objective_crumbling_desc_YAG: "尤格拉部落从绵金的一个小型沿海社群发展成为这片大陆上的主导势力，这凸显了与萨摩藩建立的贸易往来和战略联盟所产生的重大影响。\n这种关系不仅促进了经济增长，还推动了文化交流，并促使更为复杂精密的社会结构得以发展，让尤格拉人得以确立自己在该地区最为显赫的势力地位。然而，局势已然改变，随着尤格拉帝国的统治阶层愈发被贪婪所吞噬，他们不惜一切代价统一大陆的野心，正威胁着曾让他们得以繁荣发展的微妙权力平衡和各种关系。"
 objective_crumbling_desc_SAU: "岛津氏乐于接纳西方的技术与思想，这与日本其他氏族更为孤立主义的做法形成了鲜明的对比，这使得他们得以成为现代化进程中的先驱者。\n这种进步的立场让岛津藩在经济和军事方面蓬勃发展，使其成为了日本在技术上最为先进的大名。"
 objective_crumbling_desc_SHN: "18世纪末大饥荒之后，中国碎裂成诸多军阀政权，每个军阀都希望统一中国。"
 objective_crumbling_desc_TAC: "18世纪末大饥荒之后，中国碎裂成诸多军阀政权，每个军阀都希望统一中国。"
 objective_crumbling_desc_JAP: "德川幕府的统治力正在衰退，饥荒与叛乱在全国蔓延。日本的江户时期持续了超过200年，还能再持续另一个200年吗？"
 objective_colonial_name_DKE: "丹麦王国"
 objective_colonial_name_PUR: "葡萄牙帝国"
 objective_colonial_name_NED: "尼德兰"
 objective_colonial_desc_NED: "荷兰成功维持其大国地位已逾四个多世纪，但为此付出的代价极为巨大。\n在过去几十年间，这个国家多次面临破产风险。甚至将新荷兰（地区）出售给瑞典王国，也不足以解决那些致使该国不断陷入巨额债务的系统性问题。"
 objective_colonial_desc_PUR: "葡萄牙的殖民帝国已经扩张到了如此程度，以至于年复一年，对其进行管理变得越来越困难。\n腐败的总督们以及殖民地民众日益增长的不安情绪，正使得葡萄牙的权威不断受到挑战。\n葡萄牙能够克服这场危机吗？"
 objective_colonial_desc_DKE: "在过去的一个世纪里，丹麦王国成功地成为了一个颇具影响力的殖民国家，其殖民地遍布全球各地。\n这个国家的未来将会怎样呢？"
 objective_colonial_name_VEN: "最尊贵的威尼斯共和国"
 objective_colonial_desc_VEN: "威尼斯共和国曾以海上贸易带来的繁荣著称，如今却已蜕变为主要服务于企业实体与富裕阶层的城邦。\n这种转变引发诸多疑问：\n此举会否加速其衰落？抑或威尼斯终将成为人类史上最卓越的贸易力量？"
 objectives_ruler_med_desc_PUP: "罗马国内的不满情绪与日俱增。在历经数个世纪的教宗统治之后，民众变得躁动不安。\n一些政治家大胆直言，呼吁终结这种神圣的专制统治，并由罗马人民建立一个新的共和国。\n天主教教廷则要求加强治安管控，以镇压那些“暴民”，同时向欧洲的天主教势力寻求援助。"
 objectives_ruler_med_desc_MUR: "马林苏丹国成功阻止了收复失地运动的推进，稳固了其在伊比利亚半岛的领土。随着哈夫斯王国的瓦解与迦太基的溃败，王朝在区域动荡时期崛起为北非强有力的霸权争夺者。"
 objectives_ruler_med_desc_BIZ: "罗马帝国尽管已经失去了大部分领土，但仍然存续至今。\n这个帝国分为两个社会阶层：一个是集中在首都君士坦丁堡的精英阶层，他们依旧坚守着罗马的传统遗产；而其余的民众，在文化上大多属于希腊文化圈，实际上被当作二等公民对待，在许多领域受到歧视，并且无法在政府中担任高级职位。"
 objectives_ruler_med_name_TUR: "罗姆苏丹国"
 objectives_ruler_med_desc_TUR: "罗姆苏丹国在19世纪初卷入了多场战争。尽管已经尝试进行了一些改革，但要阻止这个帝国的衰落，还需要进行更多的改革举措。"
 objective_crumbling_name_KOR: "朝鲜"
 objective_crumbling_desc_KOR: "朝鲜是东方科技最先进的国家，但目前正经历着巨大的政治不稳定。\n上一任国王的继承人拒绝设立摄政，国家目前陷入政治僵局。"
 objective_rising_desc_POM: "波美拉尼亚公国由瓦尔季斯拉夫一世于公元1120年建立，在格里芬家族的统治下已超过七个世纪。\n在过去的几个世纪里，这个公国的领土面积几经大幅扩张和收缩，但最终还是存续至今。"
 objective_rising_desc_FRU: "法兰西王国不过是名义上的王国罢了；法国依旧处于封建状态，诸公爵的权力远甚于国王。\n若要让法国成为一个名副其实的国家，就必须进行重大变革，否则这个王国可能很快便会分崩离析。"
 objective_rising_desc_LOT: "东法兰克是欧洲最古老的王国之一。\n它曾是组成查理曼帝国的三个王国之一，并且是唯一一个延续至今的王国。\n东法兰克王国的长久存续，使得一些神职人员和统治阶层成员开始认为，东法兰克的人民是上帝的选民，命中注定要生活在一个永远不会覆灭的王国之中。"
 objective_rising_desc_CAS: "在过去的几十年里，卡斯蒂利亚王国的日子并不好过。\n这个王国失去了其在美洲的大部分殖民地，而曾经作为卡斯蒂利亚一部分的格拉纳达王国，趁着局势动荡之际，在阿拉贡的帮助下宣布独立了。"
 objective_rising_desc_KAR: "俄罗斯的土地被分割成了一个个小公国和无足轻重的领地。\n数十年的分裂局面以及无能的领主统治，已使俄罗斯沦为一片落后之地，仿佛只等着被征服。然而，喀山的民众已厌倦了这种状况，他们正迫切要求改变。"
 objective_rising_desc_BAY: "冯·拜恩王朝于82年前成为巴伐利亚统治王朝，当时路德维希·冯·拜恩推翻了老国王米哈尔·阿尔伯特·弗拉季斯拉夫·兹·米特罗维奇。\n近百年后的今天，这个王国正经历着动荡不安的时期。"
 objective_rising_desc_BOH: "1712年，在国王彼得二世·弗拉季斯拉夫·兹·米特罗维奇去世后，多瑙河王国被他的两个儿子瓜分：长子彼得三世继承了王国的大部分领土，次子米哈尔则继承了巴伐利亚王国。\n历经124年沧桑与无数场战争，多瑙王国疆域大幅缩减，最终仅存现今的波希米亚王国。\n大量投入到军事和科研领域的资金最终让我们的国家得以存续。如今国家局势稳定，贵族们开始敦促国王收复失去的领土。"
 objective_rising_desc_SHW: "埃塞俄比亚正处于诸侯时代。贡德尔的皇帝没有实际权力，地方统治者们瓜分了这个国家。这个帝国还能再次统一吗？"
 objective_rising_desc_SOK: "索科托哈里发国在富拉尼吉哈德的战旗下快速扩张。索科托能统一西非并抵御西方列强吗？"
 objective_rising_desc_LLO: "1809年1月，北意大利遭到奥地利大公国的入侵，奥地利的目标是征服南蒂罗尔、伊斯特拉、威尼托和伦巴第地区。\n几个月后，北意大利的各个城市组建了一个防御联盟——伦巴第联盟，以便促进军事合作，抵御侵略者。\n战争爆发后不久，威尼斯便退出了伦巴第联盟。\n米兰、都灵和热那亚则留在了联盟内，其中米兰趁着奥地利国力削弱的时机，于1820年重新夺回了南蒂罗尔。\n个人利益纠葛以及普遍存在的腐败现象极大地削弱了这个联盟，它几乎已到了分崩离析的边缘。\n必须做出改变了，否则这个联盟将难以为继。"
 objective_crumbling_name_SIA: "暹罗"
 objective_crumbling_name_BUR: "缅甸"
 objective_new_world_name_NOS: "$company_NOS$"
 objective_new_world_desc_NOS: "达连计划对苏格兰来说是一个巨大的成功。\n在经历了几个世纪的殖民统治之后，也许是时候让达连公司找到自己的道路了？"
 objective_crumbling_desc_BUR: "曾是强大的缅甸第二帝国的所在地，如今缅甸已面目全非。\n被威尼斯和暹罗分割开来的缅甸人民能否强大和独立？"
 objective_crumbling_desc_SIA: "暹罗在拉达那科信王朝治下确立自身为东南亚地区主导势力的地位。\n但暹罗能成功改革其经济社会以适应现代吗？"
 objective_crumbling_name_SHA: "山东"
 objective_crumbling_desc_SHA: "18世纪末大饥荒之后，中国碎裂成诸多军阀政权，每个军阀都希望统一中国。"
 objective_colonial_name_OMA: "阿曼王国"
 objective_colonial_name_MUR: "马林苏丹国"
 objective_colonial_desc_OMA: "统治着阿曼、桑给巴尔及印度部分地区的阿曼王国正在建立洲际帝国。\n阿曼能否维持统一？"
 objective_colonial_desc_MUR: "马林苏丹国成功阻止了收复失地运动的推进，稳固了其在伊比利亚半岛的领土。随着哈夫斯王国的瓦解与迦太基的溃败，王朝在区域动荡时期崛起为北非强有力的霸权争夺者。"
 objectives_ruler_med_name_M01: "马穆鲁克苏丹国"
 objectives_ruler_med_desc_M01: "马穆鲁克苏丹国作为地中海伊斯兰世界的代表已数百年，但与许多帝国在崩溃前的征兆相似，这个苏丹国已日渐衰微，辉煌不复往昔；\n马穆鲁克特权阶层日益腐败与自满，导致不断壮大的埃及民众普遍不满。\n若不能推行重大改革，马穆鲁克的统治恐将走向终结。"