 ve_piety_tt: "#tooltippable_concept 每月虔诚：\n#Y 基本点数：+4\n如果神权制法律生效：+2\n如果国教法律生效：+2\n如果信仰自由法律生效：+1\n如果拥有与国教相关的特定圣地：+2"
