 ve_holy_site_piety_tt: "#positive_value 每月+2 虔诚"
 ve_missionary_power_txt: "传教力量"
 ve_missionary_power_tt: "#tooltippable_concept 传教士权威：\n#Y 基础：5%\n如果国教法律生效：0.7%\n如果信仰自由法律生效：0.3%\n如果神权制法律生效：0.7%\n如果民族理念V已完成：0.7%\n如果教会学校法律生效：0.7%\n本模组的每一个传教修正都将作用于传教力量。"
