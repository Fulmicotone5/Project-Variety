l_simp_chinese:
 ideology_nationalist: "种族优越"
 ideology_nationalist_desc: "这个集团认为自己的民族文化优于其他民族文化，因此会抵制任何平等对待不同民族的尝试。"
 ideology_indian: "和谐生活"
 ideology_indian_desc: "这个集团认为我们祖先的生活和我们的生活都建立在与大自然完全和谐的基础上，将抵制任何破坏这种和谐的企图。"
 ideology_anarcho_capitalism: "无政府资本主义者"
 ideology_anarcho_capitalism_desc: "这个领袖反对国家，并寻求将政府目前提供的任何有用服务私有化，如教育、基础设施或执法。他认为资本主义和“自由市场”是自由繁荣社会的基础。"
 ideology_anarcho_capitalism_ig: "无政府资本主义"
 ideology_anarcho_capitalism_ig_desc: "这个集团反对国家，并寻求将政府目前提供的任何有用服务私有化，如教育、基础设施或执法。它认为资本主义和“自由市场”是自由繁荣社会的基础。"
 ideology_middle_class: "英格兰中产阶级"
 ideology_middle_class_desc: "这个集团几个世纪以来一直在反对任何形式的政治权力集中，现在也不会停止。"
 ig_middle_class: "英格兰资产阶级"
 ideology_inca_paternalistic: "克丘亚"
 ideology_inca_paternalistic_desc: "这个集团认为萨帕·印卡最适合领导国家。"
 ideology_inca_gender: "性别互补"
 ideology_inca_gender_desc: "这个集团认为两性是一个整体的互补部分，因此反对家庭领域的等级结构观点。"
 ideology_avestan: "阿维斯陀父权主义者"
 ideology_avestan_desc: "琐罗亚斯德教承认男女在精神和道德上的平等，但实际上神职和政治领导层仍以男性为主。"
 law_state_capitalism: "国家资本主义"
 law_state_capitalism_desc: "一种经济体制，在这种体制下，国家从事商业和贸易方面的经济活动，并且生产资料被国有化，成为国有企业。"
 ideology_corpofm: "企业国家"
 ideology_corpofm_desc: "这个集团认为，国家应采取一种受商业公司或公司利益控制或影响的经济、政治和司法体系。"
 law_corporatocracy: "企业国家"
 law_corporatocracy_desc: "企业国家是一种受商业公司或公司利益控制或影响的经济、政治及司法体系。"
 law_cultural_exclusion: "正式禁止歧视"
 law_cultural_exclusion_desc: "法律明令禁止基于特定特征的歧视性做法，然而这些规定的遵守情况往往参差不齐。"