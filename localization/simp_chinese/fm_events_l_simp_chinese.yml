 fm_yag.1.t: "[ROOT.GetCountry.GetName]"
 fm_yag.1.d: "[GetCulture('jagera').GetName]部落从曼津的一个小型沿海社区演变为大陆上的主导力量，展示了与萨摩藩的贸易和战略联盟的重大影响。"
 fm_yag.1.f: "这种关系不仅促进了经济增长，还推动了文化交流和更复杂社会结构的发展，使[GetCulture('jagera').GetName]部落得以建立为一个在该地区具有广泛影响力的文明帝国。\n但风向已变，随着[ROOT.GetCountry.GetName]统治阶级日益被贪婪吞噬，他们不惜一切代价统一大陆的野心威胁到了使其繁荣的权力和关系的微妙平衡。\n这种优先级的转变标志着偏离了曾经 характеризующее他们互动的合作精神，引发了对其他部落，尤其是萨摩藩可能发生冲突和抵抗的担忧。"
 fm_yag.1.a: "[ROOT.GetCountry.GetName]万岁"
 fm_yag.2.t: "参议院的终结"
 fm_yag.2.d: "参议院，[ROOT.GetCountry.GetName]内一个古老而强大的机构，已陷入广泛的腐败，削弱了其权威和合法性。"
 fm_yag.2.f: "废除参议院标志着国家政治格局的重大转变，表明与数世纪传统的彻底背离。\n这一决定由广泛的腐败和公众信任的丧失驱动，反映了对改革和建立更负责任治理结构的渴望。"
 fm_yag.2.a: "[ROOT.GetCountry.GetName]万岁"
 fm_yag.3.t: "整合[GetCulture('gunaikurnai').GetName]人民"
 fm_yag.3.d: "[GetCulture('gunaikurnai').GetName]人民，东南马卡尔-因迪地区的传统土地守护者，已完全融入[ROOT.GetCountry.GetName]。"
 fm_yag.3.f: "通过向[GetCulture('gunaikurnai').GetName]人民授予[concept_yagg]，我们的国家承认他们的历史存在和文化重要性，为社区间更大的合作和相互尊重铺平道路。\n这一发展可以带来更好的代表性、文化遗产的保护，以及在[ROOT.GetCountry.GetName]更大框架内为[GetCulture('gunaikurnai').GetName]人民提供改善的社会和经济机会。"
 fm_yag.3.a: "欢迎，兄弟们"
 fm_yag.4.t: "整合[GetCulture('nauo').GetName] 和 [GetCulture('kaurna').GetName] 人民"
 fm_yag.4.d: "[GetCulture('nauo').GetName] 和 [GetCulture('kaurna').GetName] 人民是 Makarr-Yindi 南部土地的传统守护者，现已完全融入 [ROOT.GetCountry.GetName]"
 fm_yag.4.f: "通过向[GetCulture('nauo').GetName]和[GetCulture('kaurna').GetName]人民授予[concept_yagg]，我们的国家承认他们的历史存在和文化重要性，为社区间更大的合作和相互尊重铺平道路。\n这一发展可以带来更好的代表性、文化遗产的保护，以及在[ROOT.GetCountry.GetName]更大框架内为[GetCulture('nauo').GetName]和[GetCulture('kaurna').GetName]人民提供改善的社会和经济机会。"
 fm_yag.4.a: "欢迎，兄弟们"
 fm_yag.5.t: "整合[GetCulture('wati').GetName]、[GetCulture('ngandatha').GetName]、[GetCulture('nyungar').GetName]和[GetCulture('wadjari').GetName] 人民"
 fm_yag.5.d: "[GetCulture('wati').GetName]、[GetCulture('ngandatha').GetName]、[GetCulture('nyungar').GetName]和[GetCulture('wadjari').GetName]人民，作为西马卡尔-因迪地区的传统土地守护者，已完全融入[ROOT.GetCountry.GetName]。"
 fm_yag.5.f: "通过向[GetCulture('wati').GetName]、[GetCulture('ngandatha').GetName]、[GetCulture('nyungar').GetName]和[GetCulture('wadjari').GetName]人民授予[concept_yagg]，我们的国家承认他们的历史存在和文化重要性，为社区间更大的合作和相互尊重铺平道路。\n这一发展可以带来更好的代表性、文化遗产的保护，以及在[ROOT.GetCountry.GetName]更大框架内为[GetCulture('wati').GetName]、[GetCulture('ngandatha').GetName]、[GetCulture('nyungar').GetName]和[GetCulture('wadjari').GetName]人民提供改善的社会和经济机会。"
 fm_yag.5.a: "欢迎，兄弟们"
 fm_yag.6.t: "整合[GetCulture('gija').GetName]和[GetCulture('wunambal').GetName]人民"
 fm_yag.6.d: "[GetCulture('gija').GetName]和[GetCulture('wunambal').GetName]人民，东南马卡尔-因迪地区的传统土地守护者，已完全融入[ROOT.GetCountry.GetName]。"
 fm_yag.6.f: "通过向[GetCulture('gija').GetName]和[GetCulture('wunambal').GetName]人民授予[concept_yagg]，我们的国家承认他们的历史存在和文化重要性，为社区间更大的合作和相互尊重铺平道路。\n这一发展可以带来更好的代表性、文化遗产的保护，以及在[ROOT.GetCountry.GetName]更大框架内为[GetCulture('gija').GetName]和[GetCulture('wunambal').GetName]人民提供改善的社会和经济机会。"
 fm_yag.6.a: "欢迎，兄弟们"
 fm_yag.7.t: "参议院要求对萨摩采取行动"
 fm_yag.7.d: "萨摩藩，曾经是[ROOT.GetCountry.GetName]的伟大盟友和文明与技术的来源，如今被视为我们大陆的非法侵略者，因为参议院内的极端派别加剧了对行动的呼吁。"
 fm_yag.7.f: "这种戏剧性的转变可能源于日益增长的民族主义、经济压力或文化变化，这些因素激起了对过去联盟的怨恨。\n天皇[ROOT.GetCountry.GetRuler.GetFullName]现在面临一个危险的决定：安抚强大的参议院，还是试图将注意力转向其他事务，以防止可能导致帝国崩溃的潜在冲突。"
 fm_yag.7.a: "吾辈共赴此夜黄泉设宴"
 fm_yag.7.b: "“我们应该先征服其他部落”"
 fm_yag.8.t: "[GetCulture('gunaikurnai').GetName] 人民要求改变"
 fm_yag.8.d: "[GetCulture('gunaikurnai').GetName] 人是 维拉度里的一个少数民族，他们正在倡导更宽松的法律，以打击持续存在的歧视"
 fm_yag.8.f: "参议院强烈反对任何变革，因为[ROOT.GetCountry.GetName]建立在拥有[concept_yagg]的人与没有的人之间的差异之上。\n参议院的反对凸显了复杂的政治格局以及少数群体在追求正义和公平待遇时面临的挑战。"
 fm_yag.8.a: "我们将听取他们的意见"
 fm_yag.8.b: "如果你想要权利，你必须赢得[concept_yagg]"
 fm_yag.9.t: "联系复原"
 fm_yag.9.d: "与帝国最大建筑公司的最后一份合同刚刚到期，现在是续签的时候了。"
 fm_yag.9.f: "参议院的一些成员已接近皇帝，请求他任命他们为监督者，暗示这一决定可能在未来对他有利。"
 fm_yag.9.a: "我希望他们不会忘记它"
 fm_yag.9.b: "帝国不容任何偏袒"
 fm_yag.10.t: "奴隶制问题"
 fm_yag.10.d: "[ROOT.GetCountry.GetName] 建立在奴隶的劳动之上，但萨摩藩成功的无奴隶模式展示了建立一个更进步、更人道的制度的潜力"
 fm_yag.10.f: "[SCOPE.sCharacter('int_leader').GetFullName]呼吁改革，并获得了大多数民众的支持，但参议院强烈反对任何改革。\n过时的做法与日益增长的道德治理需求之间的冲突不可避免，结束这场冲突是皇帝的责任。"
 fm_yag.10.a: "“帝国因奴隶而繁荣”"
 fm_yag.10.b: "改革势在必行，然不可过改现状"
 fm_yag.10.c: "朕当倾听帝国子民之声，故废奴制，势在必行！"
 fm_yag.11.t: "庄稼歉收"
 fm_yag.11.d: "帝国境内爆发严重粮荒"
 fm_yag.11.f: "一场严重的农业失败影响了帝国，促使[GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant]向皇帝[ROOT.GetCountry.GetRuler.GetFullName]请愿，要求强制参议员贡献一部分财富，帮助农民度过这场危机，而不仅仅是赔偿他们的损失。"
 fm_yag.11.a: "帝国子民，社稷之本"
 fm_yag.11.b: "我现在不能激怒参议院"
 fm_yag.12.t: "工厂事故"
 fm_yag.12.d: "曼津一家工厂发生的可怕事故导致20名[GetCulture('jagera').GetName]工人死亡。"
 fm_yag.12.f: "20名[GetCulture('jagera').GetName]工人的悲惨丧生在参议院中引发了激烈争论，特别是保守派成员利用这一事故批评快速的工业化步伐。"
 fm_yag.12.a: "或许我们该暂缓工程建设"
 fm_yag.12.b: "工业化大势不可逆"
 concept_yagg: "雅哥兰民权"
 concept_yagg_desc: "在#D 雅哥兰帝国#!中，公民身份是赋予自由个体的特权政治和法律地位，涉及法律、财产和治理。\n完全公民享有的特权范围广泛：\n他们可以在议会和选举中投票；拥有财产；合法结婚；让子女继承财产；参与竞选并担任公职；参与祭司职务；以及加入军团。"
 spooky_halloween_events.1.t: "夜间序曲"
 spooky_halloween_events.1.d: "十二点整，一名高大、苍白的男人乘马车抵达了[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]，自称是[SCOPE.sCharacter('dracula_scope').GetLastName]伯爵，愿意为[SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle]服务，并宣称是匈王阿提拉和古代强大督军的后代。"
 spooky_halloween_events.1.f: "The man's handshake was cold and vice-like. Repressing a wince, the [concept_government] representative raised his eyes to meet the Count's. \"We have prepared a room and a meal for you, sir, while you await the [SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle]. You must be tired from the long journey.\"\n\n\"That will not be necessary\" the Count said with a thin smile. \"I just enjoyed a late supper. In any case, it has been too long since I last set foot in [SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName]. And I am so much interested in seeing all that has changed.\""
 spooky_halloween_events.1.a: "很难拒绝这样一位显赫的绅士的服务。"
 spooky_halloween_events.1.b: "当然，伯爵，马上安排私人觐见。"
 spooky_halloween_events.1.c: "婉拒这位伯爵，并将他带到城门。"
 dracula_coup_tt: "就好像入了魔一样，[SCOPE.GetRootScope.GetCountry.GetRuler.GetPrimaryRoleTitle][SCOPE.GetRootScope.GetCountry.GetRuler.GetFirstName]将权力交给了伯爵。"
 umbral_coup_modifier: "阴影政变"
 dracula_leaves_tt: "伯爵一言不发上了马车。"
 spooky_halloween_events.2.t: "午夜访客"
 spooky_halloween_events.2.d: "[SCOPE.sCharacter('dracula_scope').GetFullName]悄悄来到[SCOPE.sCharacter('fair_maiden_scope').GetFullName]的住所，穿过懒散的守卫，进入一条通向她书房的黑暗长廊，在那里，一盏孤灯仍照亮着成堆的信件。"
 spooky_halloween_events.2.f: "[SCOPE.sCharacter('fair_maiden_scope').GetFullNameNoFormatting]没有认出站在她房门口的那个男人，也没听懂他嘴里说出的话，即使这些话显然是用她的语言说出的。正式晚宴的场景在她脑海中短暂闪过，然后她的思想和眼神就陷入了这个陌生人眼中。\n\n它们闪烁着如此可怕的光，她难以承受，却无法转过头。陌生人走向前一步，慢慢露出獠牙，她最后一次努力避开这目光，试着让话语，任何话语，从她口中逃出。"
 spooky_halloween_events.2.a: "之后，[SCOPE.sCharacter('fair_maiden_scope').GetFirstName]的意志被一股迷雾吞没。"
 spooky_halloween_events.2.b: "什么……等等。你是谁，你来这里干什么？卫兵！"
 spooky_halloween_events.2_tt: "小睡一会儿也没什么坏处。"
 feeling_drained_1: "生命枯竭"
 feeling_drained_2: "生命枯竭"
 feeling_invigorated: "精神焕发"
 fair_maiden_fail: "伯爵的愤怒和力量压倒了[SCOPE.sCharacter('fair_maiden_scope').GetFirstName]。"
 fair_maiden_success: "伯爵遁入阴影，迅速撤退。"
 spooky_halloween_events.3.t: "掌控新与旧"
 spooky_halloween_events.3.d: "[SCOPE.sCharacter('dracula_scope').GetFullName]思考着周围不断改变的世界，心想他是否也必须随之一起改变。"
 spooky_halloween_events.3.f: "[SCOPE.sCharacter('dracula_scope').GetFullNameNoFormatting]翻看着[SCOPE.GetRootScope.GetCountry.GetCapital.GetCityHubName][SCOPE.GetRootScope.GetCountry.GetCustom('generic_newspaper_type')]，像海绵吸血一样汲取着信息。战争、暴行和谋杀一如既往地占据了头版头条。他感到有些慰藉，世界上有些事情还是像以前一样有简单的解决方法。\n\n然而，这只在部分领域成立。在熟悉的混乱中，可以看出这是一个不同的世界——一个骚动的世界，由活塞、电灯和政治动荡驱动的世界。虽然年纪大了，但[SCOPE.sCharacter('dracula_scope').GetLastNameNoFormatting]并没有多愁善感。让弱小者为旧世界哭泣吧，他想。因为我将塑造一个新世界。"
 spooky_halloween_events.3.a: "资本带来权力。"
 spooky_halloween_events.3.b: "人只不过是孩子，而孩子只会尊重棍子。"
 spooky_halloween_events.3.c: "为什么要放弃真正的、经过检验的方法，而选择未曾尝试的新道路。"
 spooky_halloween_events.3.e: "旧事物必须为新事物让路。"
 fm_dke.1.t: "皇室婚礼"
 fm_dke.1.d: "今晨在哥本哈根举行了[ROOT.GetCountry.GetRuler.GetFullName] 与挪威公主继承人的婚礼。"
 fm_dke.1.f: "随着皇家婚礼成功联合丹麦与挪威的王冠，国王内心的动荡已转变为深刻的宁静感。\n他接受了新的角色和新联盟的力量，展望充满希望的未来。曾经困扰他的祖先回响已被深刻的目标感取代，使他能以清晰和全新的决心领导，为两个王国开启一个充满希望的时代。"
 fm_dke.1.a: "国王万岁"
 fm_dke.2.t: "丹法区重建！"
 fm_dke.2.d: "随着丹法区的恢复稳固，国王现已站在实现其宏伟目标的边缘，即恢复北海至高王国，将丹麦、挪威及其周边领土统一在一个共同旗帜之下。"
 fm_dke.2.f: "随着国王应对重新建立北海统治的复杂性，他还必须应对对手和异议者，同时激发臣民的忠诚。\n如果成功，这项事业不仅能巩固他的遗产，还可能为他统治下的国家开启一个繁荣与权力的新时代。"
 fm_dke.2.a: "去挪威！"
 fm_dke.3.t: "疯王的终结"
 fm_dke.3.d: "国王试图恢复丹法区的努力迅速陷入混乱，与贵族的紧张关系加剧，最终导致他被废黜。"
 fm_dke.3.f: "不满在那些感到被统治者试图重塑逝去遗产的野心威胁的人群中酝酿，导致政治操纵瓦解了他的权威。\n被剥夺王冠并面对嘲笑，这位曾经充满希望的领袖现在面对背叛和损失的严酷现实，挣扎于他失败志向的深远影响。"
 fm_dke.3.a: "这不过是[ROOT.GetCountry.GetName]史册中一段不幸的篇章"
 fm_dke.4.t: "北海至高王国的重建！"
 fm_dke.4.d: "随着[ROOT.GetCountry.GetName]的成功恢复，国王取得了非凡的成就，重新点燃了曾经将各国团结在一起的团结与力量精神。"
 fm_dke.4.f: "随着多样民族和文化融入他的领土，国王现在面临维护和谐与繁荣的挑战，确保他的遗产在变化的世界中作为力量与团结的灯塔永存。"
 fm_dke.4.a: "[ROOT.GetCountry.GetRuler.GetFullName]万岁！"
 fm_dke.5.t: ""
 fm_dke.5.d: ""
 fm_dke.5.f: ""
 fm_dke.5.a: ""
 fm_dke.6.t: ""
 fm_dke.6.d: ""
 fm_dke.6.f: ""
 fm_dke.6.a: ""
 fm_vin.1.t: "宣称格陵兰！"
 fm_vin.1.d: "随着格陵兰现由[GetCulture('vinlander').GetName]控制，国家已准备好复兴#D 北海高地王国#!的雄心，可能会在我们的旗帜下统一北欧领土。"
 fm_vin.1.f: "这一收复不仅意味着地理上的复兴，也代表着文化的复兴，因为我们寻求利用新获得的力量在北海地区扩大影响力。\n恢复#D 北海至高王国#!可能预示着该地区人民在协作、贸易和共享遗产方面的新时代，他们将为共同的身份和目标而努力。"
 fm_vin.1.a: "一路向东！"
 fm_vin.2.t: "文兰至高王国"
 fm_vin.2.d: "文兰王国，一个在探索和雄心推动下建立的新王国，拥有融合了土著传统和北欧遗产的充满活力的文化。"
 fm_vin.2.f: "文兰王国坐落在郁郁葱葱的景观和丰富的资源之中，旨在促进其多元居民的团结与繁荣。在一位有远见的君主领导下，文兰寻求建立联盟、促进贸易，并培育艺术与知识的丰富织锦，将自己定位为快速变化世界中的创新与和谐灯塔。"
 fm_vin.2.a: "[ROOT.GetCountry.GetName]万岁！"
 fm_vin.3.t: "北海至高王国"
 fm_vin.3.d: "随着北海至高王国的恢复，我们实现了重振北欧遗产的重大里程碑，为繁荣与团结的新时代奠定了基础。"
 fm_vin.3.f: "这一成就不仅使我们成为地区政治的核心参与者，还重振了北欧人民之间的文化和社会联系。\n王国的复兴成为骄傲的灯塔，激励集体努力加强联盟、促进贸易，并拥抱植根于历史的共同身份，同时应对现代世界的复杂性。"
 fm_vin.3.a: "[ROOT.GetCountry.GetName]万岁！"
 fm_nata.541.t: "任何大获成功"
 fm_nata.541.d: "间谍行动大功告成"
 fm_nata.541.f: "我们的精锐特工渗透进关键设施，获取了重要技术情报，这将显著提升我们的能力。"
 fm_nata.541.a: "干得漂亮！"
 fm_nata.542.t: "任务失败"
 fm_nata.542.d: "间谍被发现了"
 fm_nata.542.f: "我们的特工试图获取技术情报，但不幸任务失败并被俘。\n这一事件的消息在各地区引起了强烈反响，来自西海岸和东海岸殖民地的大使均表达了深深的失望。"
 fm_nata.542.a: "他们的牺牲不会白费。"
 fm_fou.1.t: "变革之风"
 fm_fou.1.d: "民族主义的浪潮导致议会分裂为两个派系。"
 fm_fou.1.f: "一派坚持拥护对[GetCulture('british').GetName]祖地的历史主张，主张法律承认其历史联系；另一派则倡导发展新的文化身份。这一后一派旨在培养泛民族主义情绪，主张将东海岸殖民地统一为一个独特的民族，庆祝其独特遗产和共同愿望，最终追求更大的繁荣和自决。"
 fm_fou.1.a: "“我们是真正的[GetCulture('british').GetName]人”"
 fm_fou.1.b: "殖民地唯有联合为邦，方能共臻富强！"
 fm_fou.2.t: "新国家"
 fm_fou.2.d: "征服英格兰及随后宣布成立[ROOT.GetCountry.GetName]标志着历史的重大转折点，因为四个殖民地已拥抱全新的身份。"
 fm_fou.2.f: "这一大胆举措激发了民众的热情，将各派系团结在庆祝其独特遗产和愿望的独特国家旗帜下。\n随着[ROOT.GetCountry.GetName]开辟自己的道路，重点将转向建立治理结构、发展文化机构以及促进其多元社区的团结。"
 fm_fou.2.a: "[ROOT.GetCountry.GetName]万岁！"
 fm_fou.3.t: "新联盟"
 fm_fou.3.d: "[ROOT.GetCountry.GetName]已成为泛民族主义运动抱负的有力证明，将东海岸殖民地团结在一个共同的旗帜和愿景之下。"
 fm_fou.3.f: "这个新联邦象征着一个集体身份，尊重其成员国的多样文化遗产，同时培养强烈的团结感和目标感。\n通过在治理和经济发展方面的合作，[ROOT.GetCountry.GetName]旨在提升其公民的繁荣，并在全球舞台上彰显其独立性和影响力。"
 fm_fou.3.a: "[ROOT.GetCountry.GetName]万岁！"
 bewareai: "#bold 警告！#!\n如果新荷兰（美洲邦联）是玩家，此日志将自动失败。"
 modifier_nat: "顾问酬金"
 modifier_nat_two: "外国顾问"
 fm_max.1.t: "墨西哥的诞生"
 fm_max.1.d: "随着[ROOT.GetCountry.GetName]正式确立为一个国家，全国各地的[GetCulture('mexican').GetName]公民爆发出了欢乐的庆祝，团结一致表达对未来的骄傲和希望。"
 fm_max.1.f: "#V 色彩缤纷的庆典、音乐和充满活力的游行充斥街头，社区聚集在一起，再次纪念他们来之不易的自由以及定义其新身份的多样文化织锦。\n这一刻不仅标志着一个国家的诞生，也是一个充满希望的旅程的开始，因为人民拥抱他们的主权，期待建立一个基于团结和韧性的繁荣未来。#!"
 fm_max.1.a: "[ROOT.GetCountry.GetName]万岁！"
 concept_tawantinsuyu: "塔万廷苏尤"
 concept_tawantinsuyu_desc: "在克丘亚语中，塔万廷苏尤的意思是“四方之地”，它是哥伦布之前美洲最大的帝国。\n印加文明于13世纪初从秘鲁高原兴起。1532年，西班牙开始征服印加帝国，到1572年，最后一个印加地区被完全征服。"
 concept_sapainca: "卡帕克·印加"
 concept_sapainca_desc: "卡帕克·印加或萨帕·印加（卡帕克意为“国王”，萨帕意为“皇帝”）是塔万廷苏尤的君主，他被视为神，因此也是国教的实际首领。"
 fm_atz.1.t: "[concept_tawantinsuyu]重建！"
 fm_atz.1.d: "一场非凡的变革已经发生，在我们伟大的[concept_sapainca]的卓越领导下，[ROOT.GetCountry.GetName]得以恢复。"
 fm_atz.1.f: "这一复兴预示着[GetCulture('quechua').GetName]人民繁荣新时代的到来。\n凭借新的力量和团结，帝国已准备好蓬勃发展，为其公民在这个复兴的历史篇章中重燃希望和机会。"
 fm_atz.1.a: "[concept_tawantinsuyu]万岁！"
 fm_aga.1.t: "脆弱的联盟"
 fm_aga.1.d: "[ROOT.GetCountry.GetName]是由阿根廷、巴西和乌拉圭共和国组成的联盟，它们为争取独立而结盟。"
 fm_aga.1.f: "虽然这些国家已成功获得自由，但它们现在面临着因文化差异人口复杂共存而带来的重大挑战，这对这一新生联盟的稳定构成威胁。\n必须进行紧急改革以应对这些复杂问题；否则，崩溃的可能性将日益不可避免。"
 fm_aga.1.a: "我们完成工作吧"
 fm_aga.2.t: "分离！"
 fm_aga.2.d: "[ROOT.GetCountry.GetName]的稳定性已恶化至危急低点，导致分裂，标志着联盟的解体。"
 fm_aga.2.f: "这一分裂标志着最初团结与独立梦想的终结，留下其余国家面临治理、社会凝聚力以及进一步分裂威胁的艰巨挑战。"
 fm_aga.2.a: "如果胡萝卜不起作用，大棒将会教会他们！"
 fm_aga.2.b: "如果胡萝卜不起作用，大棒将会教会他们！"
 fm_aga.2.c: "如果胡萝卜不起作用，大棒将会教会他们！"
 fm_aga.2.e: "梦想已结束，愿[GetCulture('argentino').GetName]人民繁荣昌盛！"
 fm_aga.2.g: "梦想已结束，愿[GetCulture('brazilian').GetName]人民繁荣昌盛！"
 fm_aga.2.h: "梦想已结束，愿[GetCulture('platinean').GetName]人民繁荣昌盛！"
 fm_aga.2.z: "如果胡萝卜不起作用，大棒将会教会他们！"
 fm_aga.3.t: "避免危机"
 fm_aga.3.d: "The [concept_government] has effectively addressed the grievances of the populace, and as a result of the latest reforms, the looming crisis has been averted"
 fm_aga.3.f: "这一积极的转变预示着 [GetCulture('argentino').GetName]、[GetCulture('brazilian').GetName] 和 [GetCulture('platinean').GetName] 人民将迎来一个繁荣的新时代，这将为 [ROOT.GetCountry.GetName] 带来希望和稳定，并促进不同民族之间的团结。"
 fm_aga.3.a: "[ROOT.GetCountry.GetName]万岁！"
 fm_aga.4.t: "[ROOT.GetCountry.GetCapital.GetCityHubName]的军事政变!"
 fm_aga.4.d: "为了回应对当前社会政治状况的普遍不满，[GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant]发动了政变"
 fm_aga.4.f: "此次政府的突然更迭意味着现有民主进程的严重偏离，并引发了人们对[ROOT.GetCountry.GetName]内部稳定与秩序的严重担忧。\n此举对公民自由和国家团结的影响尚未得到充分评估，目前唯一已知的事实是，该国有了一位新领导人，而他……"
 fm_aga.4.a: "...独立战争英雄埃尔曼诺·罗西"
 fm_aga.4.b: "...弗朗西斯科·泽维尔·洛佩斯大元帅"
 fm_aga.4.c: "...受欢迎的煽动者萨尔瓦多·罗德里格斯·德·弗朗西亚"
 fm_aga.5.t: "新时代"
 fm_aga.5.d: "该政权已成功采取威权措施稳定国家局势并结束持续的危机"
 fm_aga.5.f: "由于这些果断行动，一个新的繁荣时代正在浮现。\n这一转变标志着国家历史上的关键时刻，带来了潜在的增长和发展，同时确保了秩序和安全的维护。"
 fm_aga.5.a: "[ROOT.GetCountry.GetRuler.GetFullName]万岁！"
 fm_tah.1.t: "外国人来了"
 fm_tah.1.d: "今晨，在[ROOT.GetCountry.GetCapital.GetCityHubName]熙熙攘攘的街道上，一位外国人走入视野，带着一丝神秘的气息自我介绍——达奇·范德林德。"
 fm_tah.1.f: "“嘿，我听说海地是个安全的地方，或者是塔希提？无所谓了，现在我在这里，为您服务；如果您需要什么，就叫我。\n我现在得走了，我想在这儿建一个乌托邦，我会尽一切努力实现这个目标。”"
 fm_tah.1.a: "“再见”"
 fm_tah.2.t: "白银！"
 fm_tah.2.d: ""
 fm_tah.2.f: "“#V  嘿，朋友，我本来在找黄金，结果找到了白银。\n我想一个巨大的矿藏还真藏不住，所以这现在归你了。\n下次见。#!”"
 fm_tah.2.a: "“再见”"
 convert_to_isl: "正式将伊斯兰教定为国教"
 convert_to_isl_desc: "在格拉纳达王国，[GetReligion('catholic').GetName]精英与占多数的[GetReligion('sunni').GetName]穆斯林之间出现了紧张关系。为促进和谐，您可以提议将[GetReligion('sunni').GetName]伊斯兰教定为国教，以承认和确认占主导地位的民众的信仰。"
 fm_scu.1.t: "约克郡是我们的"
 fm_scu.1.d: "随着[GetCulture('scottish').GetName]军队成功占领该地区，一个关键时刻已经到来"
 fm_scu.1.f: "我们现在必须权衡继续推动统一#D 阿尔比恩#!的风险与收益，这可能会引发[GetCulture('british').GetName]人口的强烈反弹；与确保现有成果并建立战略据点的优势相比，以避免进一步冲突和潜在长期不稳定的危险。"
 fm_scu.1.a: "去#D 阿尔比昂 #!"
 fm_scu.1.b: "我们可以不管 [GetCulture('british').GetName]"
