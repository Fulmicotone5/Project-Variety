 fm_fla.2.t: "[ROOT.GetCountry.GetName]"
 fm_fla.2.d: "今天，[ROOT.GetCountry.GetName]成立了"
 fm_fla.2.f: "在一个历史性的日子，[ROOT.GetCountry.GetName]正式成立，标志着一个充满繁荣与增长的时代的开始。\n这一新篇章将塑造国家的未来，带来深远的机会与进步。"
 fm_fla.2.a: "[ROOT.GetCountry.GetName]万岁！"
 research_decision: "建立一个研究中心"
 research_decision_desc: "建立研究中心对于推动创新、增强竞争力以及确保国家在贸易和生产领域的领导地位至关重要。"
 tltwareco: "经济将逐步转变为战时经济，带来逐渐增加的产出加成和减益。\n#N 自行承担选择此政策的风险，因为在4年内无法切换回其他政策。"
 bresearch.1.t: "一个新研究中心"
 bresearch.1.d: "新成立的研究中心已正式启用，标志着我们在推动科学研究和创新方面的重要里程碑。"
 bresearch.1.f: "该中心旨在促进突破性研究，为经济增长做出贡献，并提升我们在各行业的竞争优势。"
 bresearch.1.a: "让我们开始工作吧！"
 concept_control: "Control"
 concept_control_desc: "Control reflects the extent of a [concept_country]'s authority over its regions and citizens. As the number of regions increases, maintaining cohesive governance becomes progressively more challenging. A more liberal [concept_government] will also have less control over its citizens.\n[concept_control] Modifiers:\n#P +10 Base [concept_control]\n#N -25#!/#P +20 from [Concept('concept_incorporated_state', '$concept_incorporated_states$')]\n#N -5/-15 from [Concept('concept_unincorporated_state', '$concept_unincorporated_states$')]\n#N -15#!/#P +15 from [GetLawGroup('lawgroup_distribution_of_power').GetName] lawgroup\n#P +5/+15 from [GetLawGroup('lawgroup_economic_system').GetName] lawgroup\n#P +5#!/#P +10 from [GetLawGroup('lawgroup_free_speech').GetName] lawgroup\n#P +10#!/#P +20 from [GetLawGroup('lawgroup_migration').GetName] lawgroup\n#N -20#!/#P +5 from [GetLawGroup('lawgroup_citizenship').GetName] lawgroup\n#P +5#!/#P +10 from [GetLawGroup('lawgroup_governance_principles').GetName]\n#P +25 from [GetLawType('law_isolationism').GetName]\n#P +3/+25 from [GetInstitutionType('institution_police').GetName]\n#P +3/+20 from [GetInstitutionType('institution_home_affairs').GetName]\n#N -100 from [concept_default]\n#N -20 from empty [concept_gold_reserves]\n#N -50/-80 from [Concept('concept_credit','$concept_credit_debt$')] being higher than 30%/60% of the [Concept('concept_credit','$concept_credit_limit$')]\n#N -10 from $legitimacy_level_illegitimate$ or $legitimacy_level_unacceptable$\n#N -5 from $legitimacy_level_contested$\n#P +5 from $legitimacy_level_righteous$\n#N -5 from growing [concept_secession]\n#N -35 from ongoing [concept_secession]\n#N -15 from growing [concept_revolution]\n#N -50 from ongoing [concept_revolution]\n#N -15 from ongoing [concept_famine]\n#N -10 from widespread (3 or more states) [concept_shortage]\n#N -10 from having recently lost a [concept_war]\n#P +5 from Turmoil Suppression Policy\n#P +10 from Crisis Management Policy\n#P +5 per level from $principle_group_police_coordination$\n#P +5#!/#P +15 from [Concept('concept_loyalist', '$concept_loyalists$')]\n#N -3 from [concept_devastation] (>10%) per [concept_state]\n#N -4 from [concept_turmoil] (>25%) per [concept_incorporated_state]\n#N -2 from [concept_turmoil] (>25%) per [concept_unincorporated_state]\n#N -10/20/50 from [concept_infamy]\n#N -10 per [concept_subject] after the first one ([Concept('concept_protectorate', '$concept_protectorates$')], [Concept('concept_dominion', '$concept_dominions$')], [Concept('concept_vassal', '$concept_vassals$')] and [Concept('concept_tributary', '$concept_tributaries$')] do not count towards the limit)"
 fm_corpogen.1.t: "A List of Demands"
 fm_corpogen.1.d: "[SCOPE.sCharacter('corpoman').GetFullName], acting as a representative of the most influential [Concept('concept_company', '$concept_companies$')], has submitted to us a comprehensive list of various demands"
 fm_corpogen.1.d2: "[SCOPE.sCharacter('corpoman').GetFullName], leader of the [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant], has submitted to us a comprehensive list of various demands"
 fm_corpogen.1.f: "Such list embodies the agenda and interests of the leading industrialists of our nation; therefore we cannot simply ignore their demands, or else."
 fm_corpogen.1.a: "[GetLawType('law_consumption_based_taxation').GetName] shall be enacted, as they request"
 fm_corpogen.1.a2: "[GetLawType('law_no_womens_rights').GetName] shall be enacted, as they request"
 fm_corpogen.1.a3: "A more strict [GetLawGroup('lawgroup_free_speech').GetName] law will be enacted, as they demand"
 fm_corpogen.1.a4: "[GetLawType('law_debt_slavery').GetName] shall be enacted, as they request"
 fm_corpogen.1.a5: "[GetLawType('law_poor_laws').GetName] shall be enacted, as they request"
 fm_corpogen.1.a6: "[GetLawType('law_private_health_insurance').GetName] shall be enacted, as they request"
 fm_corpogen.1.a7: "[GetLawType('law_private_schools').GetName] shall be enacted, as they request"
 fm_corpogen.1.a8: "[GetLawType('law_no_migration_controls').GetName] shall be enacted, as they request"
 fm_corpogen.1.a9: "[GetLawType('law_free_trade').GetName] shall be enacted, as they request"
 fm_corpogen.1.a10: "[GetLawType('law_child_labor_allowed').GetName] shall be enacted, as they request"
 fm_corpogen.1.a11: "[GetLawType('law_no_workers_rights').GetName] shall be enacted, as they request"
 fm_corpogen.1.a12: "We will not yield to their demands!"
 fm_corpogen.2.t: "Tax Cuts"
 fm_corpogen.2.d: "The major [Concept('concept_company', '$concept_companies$')] have advocated for a reduction in taxes"
 fm_corpogen.2.f: "The proposed legislation would significantly decrease income taxes for [Concept('concept_company', '$concept_companies$')] and the upper socioeconomic classes, while disproportionately adversely affecting lower-income populations, potentially resulting in increased hardship and starvation among vulnerable groups."
 fm_corpogen.2.a: "We cannot oppose corporate interests"
 fm_corpogen.3.t: "Strikes in [ROOT.GetCountry.GetCapital.GetCityHubName]!"
 fm_corpogen.3.d: "Masses of laborers are striking in [ROOT.GetCountry.GetCapital.GetCityHubName]"
 fm_corpogen.3.f: "A significant number of [SCOPE.sBuilding('corpobuildinf').GetName] laborers have initiated a strike, occupying factories to advocate for improved working conditions and equitable wages.\nThe corporations involved are urging the [concept_government] to intervene promptly to cease these actions."
 fm_corpogen.3.a: "派出军队！"
 fm_corpogen.4.t: "A Lucrative Opportunity"
 fm_corpogen.4.d: "The [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant] are asking the [concept_government] to increase the [SCOPE.sGoods('corposteel').GetName] price"
 fm_corpogen.4.f: "Due to the significant increase in steel prices, numerous [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant] are viewing this as an advantageous opportunity for substantial profit generation.\nConsequently, they are demanding for governmental measures such as the imposition of tariffs on all [SCOPE.sGoods('corposteel').GetName] imports and the provision of subsidies for [SCOPE.sGoods('corposteel').GetName] exports."
 fm_corpogen.4.a: "Let's make some money!"
 fm_corpogen.5.t: "Laborers are Unionizing"
 fm_corpogen.5.d: "As socialism continues to disseminate, there is a notable increase in the development of class consciousness among laborers"
 fm_corpogen.5.f: "This leads to frequent clandestine meetings and a growing membership in secret unions, all aimed at exerting pressure on [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant] to improve working conditions.\n[SCOPE.sCharacter('corpoman2').GetFullName], representing the principal [Concept('concept_company', '$concept_companies$')] and [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant] of our nation, is calling for decisive measures to suppress unionization efforts and restore order within the industrial sector."
 fm_corpogen.5.a: "Unions must be suppressed immediately!"
 fm_corpogen.2.a2: "We cannot oppose corporate interests"
 fm_corpogen.2.a3: "We cannot oppose corporate interests"
 fm_corpogen.2.a4: "We cannot oppose corporate interests"
 fm_corpogen.2.b: "This bill is pure madness!"
 fm_corpogen.3.b: "We cannot risk to escalate the situation"
 fm_corpogen.4.b: "This is an impossible demand, the nation will go bankrupt!"
 fm_corpogen.5.b: "We cannot radicalize the labor force even more"
 fm_corpogen.6.t: "A New Trend"
 fm_corpogen.6.d: "[SCOPE.sGoods('corpoart').GetName] has emerged as a prominent trend among the upper echelons of society"
 fm_corpogen.6.f: "The value of paintings and sculptures are rising significantly alongside increasing demand.\nConsequently, leading [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant] are demanding for governmental initiatives to accommodate this burgeoning market."
 fm_corpogen.6.a: "Their demand shall be furfilled"
 fm_corpogen.6.b: "[ROOT.GetCountry.GetName] does not have time for such bosh"
 fm_corpogen.7.t: "A Small Request"
 fm_corpogen.7.d: "The [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant] have a small request for the [concept_government]"
 fm_corpogen.7.f: "\"You see\", says [SCOPE.sCharacter('corpoman3').GetFullName], leader of the [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant], \"revolts are typically initiated by peasants, and by definition, they are destined to fail.\nHowever, as history demonstrates, successful revolutions are led by educated individuals.\nAs you can imagine, we are keen to ensure that the number of educated individuals remains minimal; therefore, it may be wise to consider downsizing the large university complex that was constructed in [SCOPE.sState('building_remove_unifm').GetName].\""
 fm_corpogen.7.a: "Your wish is my command"
 fm_corpogen.7.b: "It cannot be done"
 fm_corpogen.8.t: "Workers Protest in [ROOT.GetCountry.GetCapital.GetCityHubName]!"
 fm_corpogen.8.d: "Workers are demanding fairer wages"
 fm_corpogen.8.f: "Workers are demonstrating in the streets of [ROOT.GetCountry.GetCapital.GetCityHubName], advocating for equitable wages from their employers.\nAs anticipated, the [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant] expect the [concept_government] to suppress those protests."
 fm_corpogen.8.a: "Crash down the protests"
 fm_corpogen.8.b: "It cannot be done"
 fm_corpogen.9.t: "Bread Riots"
 fm_corpogen.9.d: "The elevated cost of grain, compounded by speculative activities, has resulted in a significant increase in bread prices, rendering it unaffordable for the lower-income populations"
 fm_corpogen.9.f: "Consequently, widespread bread riots have erupted throughout [ROOT.GetCountry.GetName], characterized by civil unrest, looting, and violence, as affected individuals protest against the scarcity and the perceived causes of their hardship.\[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetNameWithCountryVariant] and corporate entities are urging the [concept_government] to take measures to suppress these disturbances and restore order."
 fm_corpogen.9.a: "派出军队"
 fm_corpogen.9.b: "我们对此无能为力"
 war_support_very_bad.1.t: "士兵反抗将军[SCOPE.sCharacter('hated_general').GetFullName]"
 war_support_very_bad.1.desc: "Weeks of stalled offensives and rising casualties have shattered confidence in General [SCOPE.sCharacter('hated_general').GetFullName]. The enlisted men now demand the commander be relieved, vowing they will not fight under a leader they deem incompetent. Senior officers caution that dismissing one of their own will sow resentment throughout the corps."
 war_support_very_bad.1.f: "\"He risks our lives but never his own!\" a furious sergeant mutters in the mess tent."
 war_support_very_bad.1.a: "Remove the general - placate the ranks."
 war_support_very_bad.1.b: "Stand by the general - keep the officers loyal."
 war_support_very_bad.2.t: "Casualty Lists Reach Home"
 war_support_very_bad.2.desc: "The newest rolls of the fallen now fill whole broadsheets. Crowds gather at notice boards, each name read sparking fresh grief and rising anger toward the war."
 war_support_very_bad.2.f: "\"My son's name was the third today,\" a shopkeeper murmurs. \"Tomorrow it may be yours.\""
 war_support_very_bad.2.a: "Restrict circulation of the lists"
 war_support_very_bad.2.b: "Permit public mourning gatherings"
 war_support_very_bad.3.t: "Conscription Evasion Spreads"
 war_support_very_bad.3.desc: "Growing war-weariness has led many citizens to evade conscription, hiding in remote villages or seeking refuge abroad. Local offices report empty barracks and ignored call-up papers, urging immediate action."
 war_support_very_bad.3.f: "\"They would rather disappear than fight a war they don't understand,\" notes a recruitment officer bitterly."
 war_support_very_bad.3.a: "Send military police to enforce conscription"
 war_support_very_bad.3.b: "Promise amnesty to those returning voluntarily"
 war_support_very_bad.4.t: "Powder Magazine Explodes"
 war_support_very_bad.4.desc: "A midnight blast levels an ammunition depot, killing scores and scattering rumours of sabotage. Panic ripples through nearby units."
 war_support_very_bad.4.f: "\"If our own powder kills us, what hope against the enemy?\" a shaken sentry whispers."
 war_support_very_bad.4.a: "Blame negligence and sack the armourers"
 war_support_very_bad.4.b: "Call it an accident and move on"
 war_support_very_bad.5.t: "Fever Ravages the Camp"
 war_support_very_bad.5.desc: "A virulent fever sweeps the rear bivouacs. Field hospitals overflow, and healthy soldiers dread the infirmaries more than the enemy."
 war_support_very_bad.5.f: "\"The cough echoes louder than cannon,\" notes a despairing surgeon."
 war_support_very_bad.5.a: "Quarantine the sick with strict cordons"
 war_support_very_bad.5.b: "Let the men recover in place"
 war_support_very_bad.6.t: "Draft Riot Turns Deadly"
 war_support_very_bad.6.desc: "Conscription officers are attacked in the capital.\nClashes leave streets littered with stones and blood, shaking public faith in the war."
 war_support_very_bad.6.f: "\"They would sooner fight us than the foe\" a constable mutters over broken glass."
 war_support_very_bad.6.a: "Deploy troops to crush the riot"
 war_support_very_bad.6.b: "Withdraw recruiters and concede the district"
 war_support_bad.1.t: "Weary Bayonets Demand Leave"
 war_support_bad.1.desc: "Months of unbroken fighting have drained the ranks. The soldiers petition for a rotation - one company in ten sent home for a short rest - warning they will \"take their own leave when the line breaks\" if ignored."
 war_support_bad.1.f: "\"We are not cowards, only men. Let us see our children once before the guns call us back.\""
 war_support_bad.1.a: "Grant the rotation — the front can wait."
 war_support_bad.1.b: "No leave until victory!"
 war_support_bad.2.t: "Loot for Low Spirits"
 war_support_bad.2.desc: "Morale across the camps has sunk to new lows. Word spreads that nothing would lift the soldiers' spirits like a fair share of valuables from the occupied towns. Officers warn that, if refused, the men may plunder on their own."
 war_support_bad.2.f: "\"If glory no longer stirs us,\" an unnamed lieutenant writes, \"perhaps a little silver will.\""
 war_support_bad.2.a: "Allow controlled foraging - pay in plunder."
 war_support_bad.2.b: "Stand firm - no looting permitted."
 war_support_bad.3.t: "Wounded Homeward Bound"
 war_support_bad.3.desc: "Train stations fill with maimed veterans, their crutches and empty sleeves a stark reminder of the fighting. Citizens plead for proper pensions and hospitals, warning that neglect will breed anger on the streets."
 war_support_bad.3.f: "\"These men gave arms and legs for us,\" a factory foreman tells a crowd, \"the least we can spare is coin and care.\""
 war_support_bad.3.a: "Honour their sacrifice."
 war_support_bad.3.b: "The cities must bear the sight."
 war_support_bad.4.t: "Battalions Question the War"
 war_support_bad.4.desc: "With war support at its lowest ebb, entire regiments declare they will not advance until a clear end is in sight. Senior staff insist some degree of mutiny cannot be avoided - only how long it lasts remains in our hands."
 war_support_bad.4.f: "\"Tell us why we bleed or we will bleed no longer!\" a sergeant writes on a bullet-pocked banner."
 war_support_bad.4.a: "Offer peace talks now"
 war_support_bad.4.b: "Ignore them and punish ringleaders"
 war_support_bad.4.c: "Ignore them completely"
 war_support_bad.5.t: "Pay Ledgers Run Dry"
 war_support_bad.5.desc: "Months of withheld wages have emptied the soldiers' pockets. Petty mutinies break out in pay lines, officers warning worse will follow if arrears are not met."
 war_support_bad.5.f: "\"We can march on empty stomachs but not on empty purses,\" a corporal scrawls across a pay docket."
 war_support_bad.5.a: "紧急发放军饷"
 war_support_bad.5.b: "紧急发放军饷并额外补贴"
 war_support_bad.5.c: "延缓支付，等待审计"
 war_support_bad.6.t: "秘密和谈的谣言"
 war_support_bad.6.desc: "有传言声称政府已经在私下讨论和谈。军队觉得自己被利用了，抱怨他们在战斗，而政客们却关起门谈判。"
 war_support_bad.6.f: "“他们是在用我们的鲜血换取他们的职位吗？”一名哨兵与夜间巡逻队交谈。"
 war_support_bad.6.a: "发表一份明确的战争目标声明"
 war_support_bad.6.b: "没收谣言报纸，逮捕造谣者"
 war_support_bad.7.t: "遥遥无期"
 war_support_bad.7.desc: "Command issues yet another extension of conscription terms. Veterans count the extra months, muttering that promises mean nothing."
 war_support_bad.7.f: "\"Home is a rumour that fades with every new order,\" an exhausted rifleman confides."
 war_support_bad.7.a: "Set a fixed demobilisation date"
 war_support_bad.7.b: "Enforce the extension with strict penalties"
 war_support_good.1.t: "Proud Send-Off for the Troops"
 war_support_good.1.desc: "Patriotic enthusiasm fills city squares as citizens proudly send soldiers off to the front. Flags wave high, music echoes through streets, and morale soars."
 war_support_good.1.f: "\"We marched through cheers and flowers,\" recalls a young recruit, \"ready to do our duty.\""
 war_support_good.1.a: "Let the celebrations lift spirits"
 war_support_good.1.b: "Finance even grander ceremonies"
 war_support_good.2.t: "Nationwide War Support Rally"
 war_support_good.2.desc: "Thousands gather in major cities to reaffirm their commitment to the war effort. Speeches praising unity and sacrifice inspire renewed dedication among the public."
 war_support_good.2.f: "\"Today, we proved we stand as one!\" declares a community leader to roaring applause."
 war_support_good.2.a: "Applaud their resolve"
 war_support_good.2.b: "Print speeches in every gazette"
 war_support_good.3.t: "Surge in Volunteer Recruitment"
 war_support_good.3.desc: "Enlistment offices are crowded with eager volunteers determined to defend their homeland. The wave of patriotism energizes both civilians and soldiers alike."
 war_support_good.3.f: "\"I couldn't watch from home,\" a volunteer tells, \"my place is with my comrades.\""
 war_support_good.3.a: "Encourage voluntary enlistment"
 war_support_good.3.b: "Fund recruitment drives everywhere"
 war_support_good.4.t: "Patriotic Donations Pour In"
 war_support_good.4.desc: "Citizens from every walk of life enthusiastically donate valuables and savings to support the war effort, confident that victory is near."
 war_support_good.4.f: "\"If my silver can help bring our soldiers home,\" an elderly woman says, \"then it has no better use.\""
 war_support_good.4.a: "Express gratitude for their generosity"
 war_support_good.4.b: "Launch national donation campaign"
 war_support_good.5.t: "Charity Fair for the Wounded"
 war_support_good.5.desc: "Local guilds host a fair to raise alms for injured veterans. The gesture lifts spirits, but funds are scarce without state support."
 war_support_good.5.f: "Stalls of pastries and patchwork banners mingle with tin donation cups."
 war_support_good.5.a: "Let goodwill run its modest course"
 war_support_good.5.b: "Match every coin from the treasury"
 war_support_good.6.t: "Scholarship Fund for Orphans"
 war_support_good.6.desc: "Philanthropists propose scholarships for children of fallen soldiers. The plan would inspire confidence - if the government endows it."
 war_support_good.6.f: "\"Their fathers served; let knowledge serve them,\" a benefactor declares."
 war_support_good.6.a: "Offer moral endorsement only"
 war_support_good.6.b: "Endow the fund with public money"
 war_support_good.7.t: "National Poetry Contest"
 war_support_good.7.desc: "A literary society announces a contest for verses honouring duty and sacrifice. Glory is certain, yet prizes meagre without official backing."
 war_support_good.7.f: "Quills scratch late into the night, seeking words to steady wavering hearts."
 war_support_good.7.a: "Applaud the initiative from afar"
 war_support_good.7.b: "Sponsor rich prizes and print the winning poems"
 fm_war_good.1.t: "Flood of Letters from Home"
 fm_fm_war_goodwar.1.desc: "Postal wagons arrive at every camp bulging with letters from friends and family. The sudden flood of kind words and sketches brightens even the gloomiest dugouts, hinting that faith in the cause is not yet lost."
 fm_war_good.1.f: "\"I held the paper to the lamp,\" a private writes, \"and for a moment the mud smelled like home.\""
 fm_war_good.1.a: "Hand out the mail and move on"
 fm_war_good.1.b: "Launch a free-post campaign countrywide"
 fm_war.2.t: "Schoolchildren's Copper Drive"
 fm_war.2.desc: "Gimnazists and grammar-school pupils fan out across market squares, collecting copper coins for wounded soldiers. Pamphlets hail the youngsters' zeal, kindling fresh pride among their elders."
 fm_war.2.f: "\"A farthing from each child is a sovereign for the army,\" proclaims a headmaster, rattling a brimming tin."
 fm_war.2.a: "Praise their penny patriotism"
 fm_war.2.b: "Match their takings with the public purse"
 fm_war.3.t: "Artists Rally for the Cause"
 fm_war.3.desc: "Celebrated painters mount patriotic salons while playwrights stage brisk one-act dramas for charity. Tickets vanish within hours, the public eager for stirring scenes of duty and honour."
 fm_war.3.f: "Brushes, scripts, and song combine where muskets cannot reach."
 fm_war.3.a: "Thank the masters for their tribute"
 fm_war.3.b: "Send a travelling troupe to every garrison"
 fm_war.4.t: "Town Kitchen Gardens"
 fm_war.4.desc: "Empty yards behind churches and workshops are being tilled into neat kitchen plots. Citizens insist that every basket of vegetables grown at home spares a basket of grain for the men at the front."
 fm_war.4.f: "\"Every carrot we coax from the soil is a bayonet spared from hunger,\" says a beaming gardener, wiping earth from her apron."
 fm_war.4.a: "Praise the gardeners' thrift"
 fm_war.4.b: "Send seeds and tools to double the plots"
 fm_war.5.t: "Day of National Prayer"
 fm_war.5.desc: "From cathedral nave to humble chapel, bells summon the faithful to a united act of supplication for victory and safe return. Even sceptics admit the solemn hush steadies many hearts."
 fm_war.5.f: "Choristers and muezzins alike raise petitions beneath the same grey sky."
 fm_war.5.a: "Offer official thanks to the clergy"
