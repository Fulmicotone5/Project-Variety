 fm_luoi_amc.1.t: "新阿姆斯特丹代表团"
 fm_luoi_amc.1.d: "今天早上，来自新阿姆斯特丹的一个代表团抵达"
 fm_luoi_amc.1.f: "美国外交官带来了一个有趣的提议，他们提出以总计130万法郎购买路易斯安那的土地，我们将通过每周5000法郎的分期付款在五年内收到款项。\n路易斯安那目前对我们来说是一片几乎毫无价值的空旷领土，因此这笔交易并不坏。"
 fm_luoi_amc.1.a: "我对路易斯安那有其他计划。"
 fm_luoi_amc.1.b: "这确实是一笔好交易，告诉他们国王接受这笔交易。"
 fm_luoi_mex.1.t: "新伊斯帕尼亚代表团"
 fm_luoi_mex.1.d: "今天早上，新伊斯帕尼亚代表团到达"
 fm_luoi_mex.1.f: "美国外交官带来了一个有趣的提议，他们提出以总计130万法郎购买路易斯安那的土地，我们将通过每周5000法郎的分期付款在五年内收到款项。\n路易斯安那目前对我们来说是一片几乎毫无价值的空旷领土，因此这笔交易并不坏。"
 fm_luoi_mex.1.a: "我对路易斯安那有其他计划。"
 fm_luoi_mex.1.b: "这确实是一笔好交易，告诉他们国王接受这笔交易。"
 fm_luoi_flu.3.t: "佛罗里达代表团"
 fm_luoi_flu.3.d: "今天早上，来自新佛罗里达的一个代表团抵达"
 fm_luoi_flu.3.f: "佛罗里达外交官带来了一个有趣的提议，他们提出以总计130万法郎购买路易斯安那的土地，我们将通过每周5000法郎的分期付款在五年内收到款项。\n路易斯安那目前对我们来说是一片几乎毫无价值的空旷领土，因此这笔交易并不坏。"
 fm_luoi_flu.3.a: "我对路易斯安那有其他计划。"
 fm_luoi_flu.3.b: "这确实是一笔好交易，告诉他们国王接受这笔交易。"
 fm_flu.1.t: "民族主义的兴起"
 fm_flu.1.d: "在法国的帮助下，我们于 1820 年脱离威尼斯而独立，但从那时起，我们的人民就分散居住在中美洲各地"
 fm_flu.1.f: "The [GetCulture('americano').GetName] people of [ROOT.GetCountry.GetName] are vehemently asking the [concept_government] to unify, once and for all, all the lands inhabited by their people.\nIt will not be an easy task, and war might be necessary, but our people cannot wait any longer."
 fm_flu.1.a: "奔向大威尼齐亚！"
 fm_flu.2.t: "巴黎回复"
 fm_flu.2.d: "法国国王拒绝出售路易斯安那州"
 fm_flu.2.f: "法国统治者通知我们，他目前对那些土地有其他计划，因此不会出售。\n不幸的是，我们的尝试并未无人察觉，一些大国的外交官已经开始嘲笑我们的国家。"
 fm_flu.2.a: "该死的法国人，他们毁了法国！"
 fm_flu.3.t: "巴黎回复"
 fm_flu.3.d: "法国国王接受了这笔交易"
 fm_flu.3.f: "路易斯安那的土地现已归我们管辖。\n这些荒野目前没有价值，但如果我们投入足够资金，它们很快就会变得繁荣。"
 fm_flu.3.a: "迈向更光明的未来"
 fm_flu.4.t: "大威尼齐亚的诞生"
 fm_flu.4.d: "一个由 [GetCulture('americano').GetName] 人民建立并服务于他们的新国家\n今天诞生了。"
 fm_flu.4.f: "今晨在[ROOT.GetCountry.GetCapital.GetCityHubName]，[ROOT.GetCountry.GetRuler.GetFullName]正式宣布[ROOT.GetCountry.GetName]的诞生。\n这标志着我们人民繁荣新时代的开始。"
 fm_flu.4.a: "[ROOT.GetCountry.GetName]万岁！"
 fm_dakota.1.t: "命运的摆布"
 fm_dakota.1.d: "我们的生活方式需要改变，否则我们就会灭亡"
 fm_dakota.1.f: "我们的伟大酋长[ROOT.GetCountry.GetRuler.GetFirstName]已成功统一了大平原上几乎所有的达科他部落，但我们意识到这一成就不足以保证我们部落的生存。\n外国列强一直在剥夺我们的土地，使用我们从未见过的技术杀害我们的人民；试图用我们的武器对抗他们毫无意义，因此拯救我们国家的唯一方法是拥抱现代化，变得足够强大以抵御侵略者。"
 fm_dakota.1.a: "我们面前的道路充满艰辛。"
 fm_dakota.2.t: "巴黎回复"
 fm_dakota.2.d: "法国国王拒绝出售路易斯安那州"
 fm_dakota.2.f: "国王还极大地侮辱了我们的国家，称他不相信我们能负担这样的交易，因为我们是一个未开化的贫穷国家。\n这些言辞不可接受，一个反法政治游说团体已经形成。"
 fm_dakota.2.a: "法国人将会吸取教训！"
 fm_dakota.3.t: "巴黎回复"
 fm_dakota.3.d: "法国国王接受了这笔交易"
 fm_dakota.3.f: "路易斯安那的土地现已归我们管辖。\n我们已解放了那里的印第安人，但这只是一个起点；如果我们想驱逐抢夺我们土地的外国列强，我们必须比这更努力。"
 fm_dakota.3.a: "迈向更光明的未来"
 fm_dakota.4.t: "无政府资本主义的崛起"
 fm_dakota.4.d: "印第安社会极度保守的特质，与迫在眉睫的剧烈现代化需求相结合，在[GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetNameWithCountryVariant]中催生了一种新的思想潮流。"
 fm_dakota.4.f: "一种名为[GetIdeology('ideology_anarcho_capitalism_ig').GetName]的新意识形态最近开始在达科他传播。\n[GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetNameWithCountryVariant]的领导人已开始大力支持这一新思想流派，称这是我们国家不仅能对抗外国列强，还能在经济上具有竞争力的唯一途径。"
 fm_dakota.4.a: "也许这就是我们一直在寻找的变革。"
 fm_dakota.4.b: "这些思想过于极端和危险，我们绝不能允许它们进一步扩散！"
 fm_dakota.5.t: "拉科塔部落拒绝合并"
 fm_dakota.5.d: "拉科塔人仍然对我们怀恨在心"
 fm_dakota.5.f: "当我们伟大的酋长[ROOT.GetCountry.GetRuler.GetFirstName]统一所有达科他部落时，许多达科他人为了避免在战败后被俘而逃往西方。\n他们似乎并没有忘记那些战斗，因此，即使我们送来许多礼物来化解矛盾，他们仍然拒绝向我们的酋长屈服。"
 fm_dakota.5.a: "如果他们想要战争，那就战争吧！"
 fm_dakota.6.t: "来自三火联盟议会的消息"
 fm_dakota.6.d: "议会决定将他们的部落与我们的部落合并"
 fm_dakota.6.f: "我们慷慨的礼物已说服几乎所有阿尔冈昆部落成员，相信在我们的统治下会比等待外国侵略者完全占领他们的土地有更好的结果。\n阿尔冈昆人民现已受到我们的保护。"
 fm_dakota.6.a: "欢迎，兄弟们"
 fm_dakota.7.t: "来自克里部落的消息"
 fm_dakota.7.d: "克里族部落决定\n接受我们的保护"
 fm_dakota.7.f: "许多克里族酋长对我们的慷慨和部落的繁荣印象深刻，因此他们决定臣服于我们，以获得更好的保护，抵御外来威胁。\n克里族现在处于我们的保护之下。"
 fm_dakota.7.a: "欢迎，兄弟们"
 fm_dakota.8.t: "来自苏族的消息"
 fm_dakota.8.d: "苏族部落的酋长们决定向我们投降"
 fm_dakota.8.f: "看到我们巨大的财富，许多苏族酋长认为臣服于我们是一个明智的选择。\n苏族人民现在处于我们的保护之下。"
 fm_dakota.8.a: "欢迎，兄弟们"
 fm_vna.1.t: "民族主义的兴起"
 fm_vna.1.d: "在美洲近期独立运动的背景下，一股民族主义浪潮引发了脱离$VEN$的强烈独立呼声。"
 fm_vna.1.f: "民族主义的兴起以及地方对自治的渴望推动了这一势头，导致政治紧张局势加剧，并围绕主权和治理展开讨论。\n随着这些情绪获得更多支持，局势可能显著重塑公司的政治格局，或将推动更广泛的民主改革和新治理结构的谈判。"
 fm_vna.1.a: "迈向独立！"
 fm_vna.2.t: "$GRV$的诞生"
 fm_vna.2.d: "随着成功宣布脱离威尼斯独立，新主权国家[ROOT.GetCountry.GetName]诞生，标志着我们追求自决的重要里程碑。"
 fm_vna.2.f: "这一向国家地位的转变为我们提供了建立自己的治理、文化身份和国际关系的机会，反映了我们公民的愿望和梦想。\n当我们踏上世界舞台时，我们面临着国家建设、统一多元利益以及在现有地缘政治动态中定义自身位置的挑战。\n前方的旅程将对塑造我们的身份和未来至关重要。"
 fm_vna.2.a: "[ROOT.GetCountry.GetName]万岁！"
 fm_kur.1.t: "库尔德起义"
 fm_kur.1.d: "迪亚巴克尔和埃尔祖鲁姆的库尔德人已经起义"
 fm_kur.1.f: "今天，这些地区爆发了大规模叛乱，所有卫戍部队已被压倒，在马拉蒂亚已宣布成立一个库尔德国家。"
 fm_kur.1.a: "不能接受，必须血债血偿！"
 fm_kur.1.b: "库尔德斯坦或死亡！"
 fm_kur.2.t: "一个属于库尔德人民的国家"
 fm_kur.2.d: "几个世纪以来，我们一直生活在外国帝国的压迫之下，但今天一切都将改变！"
 fm_kur.2.f: "这只是我们人民解放的垫脚石！\n许多库尔德人仍生活在外国势力的统治下，我们有责任解放他们并收复我们的土地；但首先，我们必须保卫我们的土地，我们必须保卫库尔德斯坦！"
 fm_kur.2.a: "库尔德斯坦或死亡！"
 fm_ind.1.t: "印第安人迁移法"
 fm_ind.1.d: "The presence of the Indians in North America will inevitably cause many land disputes in the years to come, and passing this act would grant the [concept_government] the power to solve any territorial problem before it even appears."
 fm_ind.1.f: "Politicians such as [SCOPE.sCharacter('intelligentsia_leader').GetFullName] strongly condemn this bill, describing it as inhumane since it would grant the [concept_government] the power to commit a genocide.\nOthers are trying to push for a much softer approach, but almost everyone knows that coexisting with the Indians while actively occupying their soil is impossible."
 fm_ind.1.a: "我们必须把国家利益放在第一位"
 fm_ind.2.t: "法案已经被批准"
 fm_ind.2.d: "今天早上，《印第安人迁移法案》已正式获得批准，并将于下个月生效。"
 fm_ind.2.f: "The Parliament has been in a state of chaos ever since the law was passed, with [SCOPE.sCharacter('intelligentsia_leader').GetFullName] denouncing the avidity of the [concept_government], which has put the interests of its elites before the lives of tens of thousands people."
 fm_ind.2.a: "我们都做了些什么"
 fm_ind.3.t: "法案被否决了。"
 fm_ind.3.d: "今天早上[ROOT.GetCountry.GetName]\n的报纸上出现了好消息"
 fm_ind.3.f: "经过四年多的讨论，《印第安人迁移法案》最终被正式否决。\n一场可能引发的种族灭绝得以避免，许多人为这项不人道法案的失败而感到欣喜。"
 fm_ind.3.a: "美好的一天！"
 fm_kaa.1.t: "曾经伟大的王国"
 fm_kaa.1.d: "阿拉贡王国在其鼎盛时期统治着伊比利亚东部和法国南部"
 fm_kaa.1.f: "阿基坦家族凭借其巧妙的政治联姻以及对其土地资源的合理利用，几乎统一了整个伊比利亚半岛和法国。\n然而，时过境迁，阿拉贡如今已沦为一个地区性强国。"
 fm_kaa.1.a: "我们一定再次会崛起的"
 fm_kaa.2.t: "民族主义正兴起"
 fm_kaa.2.d: "伊比利亚土地上民族主义的兴起正给我们国家带来动荡。"
 fm_kaa.2.f: "“陛下，您的臣民请求您成为所有[GetCulture('spanish').GetName]人民的第一位国王，我们该如何回应？”\n“你说西班牙人的国王？听起来更像是个负担，我们与卡斯蒂利亚人作战了几个世纪，所以我不明白为什么我要成为这样的国王，也不明白为什么他们会接受#bold 我#!作为他们的国王。\n如果我的领土要扩张，那将由我自己决定。”"
 fm_kaa.2.a: "也许 “西班牙人的国王” 这个名号听起来也没那么糟糕。"
 fm_kaa.2.b: "我不会忘记我的传承；如果我是一个民族的国王，那么这个民族就是[GetCulture('occitan').GetName]民族。"
 fm_kaa.3.t: "西班牙王国"
 fm_kaa.3.d: "今天，一个由 [GetCulture('spanish').GetName] 人民建立并服务于他们的王国已经宣告成立。"
 fm_kaa.3.f: "After the coronation ceremony of [ROOT.GetCountry.GetRuler.GetFullName] held in Madrid, the new king made a speech to the crowd massed outside the new [concept_government] palace:\n\"My loyal subjects, this is but the start of a glorious future for our Kingdom; I, as the new king, solemny promise that I will defend and protect this Kingdom till my death!"
 fm_kaa.3.a: "西班牙万岁！"
 fm_kaa.4.t: "两个人民的王国"
 fm_kaa.4.d: "如今 [ROOT.GetCountry.GetRuler.GetFullName] 已成为 [GetCulture('spanish').GetName] 人民和 [GetCulture('occitan').GetName] 人民的国王。"
 fm_kaa.4.f: "阿拉贡的古老边界已恢复，阿拉贡如今已不仅仅是一个地区强国。\n阿拉贡国王已获得“奥克西坦尼亚国王”的称号，因此从今天起，阿拉贡将被称为[ROOT.GetCountry.GetName]。\n万岁[ROOT.GetCountry.GetRuler.GetFullName]，万岁[ROOT.GetCountry.GetName]！"
 fm_kaa.4.a: "国王万岁！"
 fm_cas.1.t: "衰落的王国"
 fm_cas.1.d: "过去几十年对卡斯蒂利亚王国来说\n并不友善"
 fm_cas.1.f: "王国失去了美洲的大部分殖民地，趁着这一不稳定时刻，曾经属于卡斯蒂利亚头衔一部分的格拉纳达王国在阿拉贡的帮助下分裂出去。\n卡斯蒂利亚的未来看起来并不乐观，只有剧烈的变革才能重振这个国家的命运。"
 fm_cas.1.a: "历经艰难…"
 fm_cas.2.t: "民族主义正兴起"
 fm_cas.2.d: "伊比利亚土地上民族主义的兴起正给我们国家带来动荡。"
 fm_cas.2.f: "建立一个统一的[GetCulture('spanish').GetName]国家的理念已开始在[ROOT.GetCountry.GetName]人民中传播。\n我们可以实现他们的梦想，但需要战争，或者非常熟练的外交手段。"
 fm_cas.2.a: "迈向西班牙"
 fm_cas.3.t: "西班牙王国"
 fm_cas.3.d: "今天，一个由 [GetCulture('spanish').GetName] 人民建立并服务于他们的王国已经宣告成立。"
 fm_cas.3.f: "After the coronation ceremony of [ROOT.GetCountry.GetRuler.GetFullName] held in Madrid, the new king made a speech to the crowd massed outside the new [concept_government] palace:\n\"My loyal subjects, this is but the start of a glorious future for our Kingdom; I, as the new king, solemny promise that I will defend and protect this Kingdom till my death!"
 fm_cas.3.a: "西班牙万岁！"
 fm_cas.4.t: "加泰罗尼亚起义"
 fm_cas.4.d: "巴塞罗那和瓦伦西亚的[GetCulture('catalan').GetName]人民已经起义"
 fm_cas.4.f: "今天，加泰罗尼亚地区和瓦伦西亚地区爆发了大规模起义，所有驻军都已被击溃，巴塞罗那已宣布成立 [GetCulture('catalan').GetName] 国家。"
 fm_cas.4.a: "不能接受，必须血债血偿！"
 fm_cas.5.t: "巴斯克起义"
 fm_cas.5.d: "纳瓦拉的[GetCulture('basque').GetName]人民已经起义"
 fm_cas.5.f: "如今，纳瓦拉爆发了大规模起义，所有驻军已被击溃，潘普洛纳宣布成立 [GetCulture('basque').GetName] 国家。"
 fm_cas.5.a: "不能接受，必须血债血偿！"
 fm_cas.6.t: "宗教裁判所的归来"
 fm_cas.6.d: "西班牙宗教裁判所已恢复"
 fm_cas.6.f: "我们的国家终于可以提升为[GetReligion('catholic').GetName]信仰的盾牌。\n现在教会拥有了捍卫我们宗教所需的一切权力，是时候处理阿维尼翁的伪教宗，以恢复罗马教宗的权威。"
 fm_cas.6.a: "为了教宗和上帝"
 fm_cas.7.t: "唯一的教宗"
 fm_cas.7.d: "三十多年后，西方教会大分裂终于得到了弥合，罗马教宗被视为唯一合法的教宗。"
 fm_cas.7.f: "在 1809 年发生大分裂之后，天主教世界陷入了混乱之中。\n多年来，教宗职位一直担心失去其权威和领地，但如今教宗以及神职人员们都松了一口气，因为真正教宗的正统地位最终得以恢复。"
 fm_cas.7.a: "感谢！"
 fm_holy.1.t: "正在弥合东西方教会大分裂"
 fm_holy.1.d: "世界上最重要的圣地现在都处于 [GetReligion('catholic').GetName] 国家的控制之下"
 fm_holy.1.f: "经过几个世纪的占领，我们宗教的至圣圣地终于获得了解放。\n我们成功地保护了我们的信仰，但我们的职责远未完成。\n我们仍需传播福音，为那些面临永恒诅咒的可怜灵魂带来救赎。"
 fm_holy.1.a: "去传播上帝的话语吧！"
 fm_por.1.t: "殖民地的动乱"
 fm_por.1.d: "我们的殖民帝国已经扩张到如此程度，\n以至于年复一年，\n变得越来越难以管理"
 fm_por.1.f: "腐败的总督和殖民地人民日益增长的不安情绪导致我们国家的主权不断受到挑战。"
 fm_por.1.a: "我们必须恢复对这些土地的统治。"
 fm_por.2.t: "秩序恢复"
 fm_por.2.d: "我们成功恢复了\n对殖民地的统治"
 fm_por.2.f: "[ROOT.GetCountry.GetName]对其殖民地的主权将永不再受质疑。\n我们成功克服了又一场危机，我们的国家比以往任何时候都要强大。\n未来如何并不重要，因为我们将面对任何困难并克服它。"
 fm_por.2.a: "[ROOT.GetCountry.GetName]万岁！"
 fm_pol.1.t: "[ROOT.GetCountry.GetName] 联邦已恢复"
 fm_pol.1.d: "虽然[GetCulture('polish').GetName]和[GetCulture('lithuanian').GetName]人民已联合，我们必须考虑是否扩展我们的统治，以解放[GetCulture('ukrainian').GetName]和[GetCulture('byelorussian').GetName]的土地。"
 fm_pol.1.f: "A grand restoration, centuries in the making.\nHussars with polished armor and silken wings stood at attention as the new [concept_government] swept into the halls of power. The first order for the knights of the new commonwealth was thus: defend the borders, no matter the cost.\nBut which borders were they to follow?"
 fm_pol.1.a: "我们会恢复旧联邦的国界。"
 fm_pol.2.t: "君主制垮台"
 fm_pol.2.d: "国王被废黜"
 fm_pol.2.f: "随着波兰-立陶宛联邦复兴的失败，波兰的上层和中产阶级决定废黜国王是确保[ROOT.GetCountry.GetName]繁荣的唯一途径。\n革命成功后，波兰人民正欢庆共和国的建立，殊不知他们的统治者只是换了面孔，而非本质。\n共和国的诞生不仅象征着政治变革，还代表着复兴的国家身份以及建设新波兰的承诺。"
 fm_pol.2.a: "[ROOT.GetCountry.GetName]万岁！"
 fm_pol.3.t: "西斯拉夫人的国家"
 fm_pol.3.d: "波兰、捷克和斯洛伐克人民\n在西斯拉夫旗帜下的统一，\n标志着西斯拉夫人民\n团结和文化亲缘的历史性时刻。"
 fm_pol.3.f: "来自不同背景的公民齐聚一堂庆祝这个新国家，街道上充满了欢乐的游行、音乐和传统舞蹈，展示他们丰富的遗产和共同历史。\n这一庆祝活动不仅彰显了他们的集体身份，还象征着合作、相互支持以及在西斯拉夫共同迈向光明未来的希望，因为他们开始了国家建设和治理的旅程。"
 fm_pol.3.a: "[ROOT.GetCountry.GetName]万岁！"
 fm_ned.1.t: "深陷债务泥潭的国家"
 fm_ned.1.d: "[ROOT.GetCountry.GetName] 成功地保持了其\n[concept_great_power] 的地位长达四个多世纪，\n但为此付出的代价是巨大的"
 fm_ned.1.f: "过去几十年来，我国多次面临破产的风险，即使将新荷兰公司出售给瑞典王国也不足以解决导致我国不断陷入巨额债务的系统性问题。"
 fm_ned.1.a: "我们必须采取行动，否则我们的国家可能一蹶不振。"
 fm_ire.1.t: "爱尔兰王国"
 fm_ire.1.d: "爱尔兰刚刚统一为一个王国"
 fm_ire.1.f: "随着工业革命蔓延到不列颠群岛，这个新建立的王国拥有无限的可能性。\n未来会怎样？"
 fm_ire.1.a: "只有时间才能够回答……"
 fm_ire.2.t: "凯尔特联盟的诞生"
 fm_ire.2.d: "爱尔兰、苏格兰、威尔士和布列塔尼\n已统一为联邦"
 fm_ire.2.f: "一个更多地出于保护需要而非意识形态相似性而成立的联邦，但终究是一个联邦。\n联邦内的人民将不再惧怕英法的暴政，因为现在他们受到了我们的保护。\n[ROOT.GetCountry.GetName]万岁！"
 fm_ire.2.a: "[ROOT.GetCountry.GetName]万岁！"
 fm_lit.1.t: "最后一次会面"
 fm_lit.1.d: "理议会已举行最后一次会议会已举行最后一次会议"
 fm_lit.1.f: "今天，立陶宛、白俄罗斯和哥萨克酋长国的王子们会面，批准了一项早已决定的决议；过去对他们构成威胁的波兰王国和芬兰王国的存在，已不再被视为威胁，因此这三个国家决定追求各自的国家利益，解散一个否则将成为阻碍的联盟。"
 fm_lit.1.a: "战争即将爆发吗？"
 fm_bye.1.t: "最后一次会面"
 fm_bye.1.d: "理议会已举行最后一次会议会已举行最后一次会议"
 fm_bye.1.f: "今天，立陶宛、白俄罗斯和哥萨克酋长国的王子们会面，批准了一项早已决定的决议；过去对他们构成威胁的波兰王国和芬兰王国的存在，已不再被视为威胁，因此这三个国家决定追求各自的国家利益，解散一个否则将成为阻碍的联盟。"
 fm_bye.1.a: "战争即将爆发吗？"
 fm_coh.1.t: "最后一次会面"
 fm_coh.1.d: "议会已举行最后一次会议"
 fm_coh.1.f: "今天，立陶宛、白俄罗斯和哥萨克酋长国的王子们会面，批准了一项早已决定的决议；过去对他们构成威胁的波兰王国和芬兰王国的存在，已不再被视为威胁，因此这三个国家决定追求各自的国家利益，解散一个否则将成为阻碍的联盟。"
 fm_coh.1.a: "战争即将爆发吗？"
 fm_coh.2.t: "乌克兰的诞生"
 fm_coh.2.d: "[GetCulture('ukrainian').GetName] 人民已经统一为一个国家，\n[ROOT.GetCountry.GetName]！"
 fm_coh.2.f: "一个由#bold 乌克兰人#!组成、为#bold 乌克兰人#!服务的#bold 乌克兰人#!国家终于建立。\n这一天将永远铭记在我们的历史中。\n荣耀属于乌克兰！"
 fm_coh.2.a: "英雄般的光荣！"
 fm_occ.1.t: "奥西塔尼亚王国"
 fm_occ.1.d: "今天，奥西塔尼亚王国已经成立了"
 fm_occ.1.f: "得益于阿维尼翁教皇的支持，我们头衔的合法性不容法兰西国王质疑，因此另一个问题浮现；作为王国，我们在法律上无需臣服于法兰西国王，因为我们的头衔对等。\n我们可以利用这一漏洞征服波旁及奥弗涅公国，但我们在法兰西王国停留越久，脱离它就越困难。"
 fm_occ.1.a: "今天就庆祝吧，明天我们会解决这些问题"
 fm_occ.2.t: "独立终至"
 fm_occ.2.d: "欧洲出现了一个新的王国"
 fm_occ.2.f: "[ROOT.GetCountry.GetName]不再是法兰西国王的臣属，而是已成为一股不可忽视的力量。\n奥克西坦尼亚已建立，但我们仍需统一所有[GetCulture('occitan').GetName]人民，因此征服罗讷和普罗旺斯应成为我们最紧迫的优先事项。"
 fm_occ.2.a: "[ROOT.GetCountry.GetName]万岁！"
 fm_fru_oc.1.t: "奥西塔尼亚宣布独立"
 fm_fru_oc.1.d: "我们最大的恐惧终于成真了"
 fm_fru_oc.1.f: "奥克西坦尼亚王国，一个本不应存在的实体，凭借阿维尼翁教宗的支持强行确立其合法性，现已宣布脱离我们独立。\n他们挑战我们权威的意图显而易见，因此我们必须决定是否值得花费时间试图平定和控制那些土地。"
 fm_fru_oc.1.a: "奥克西塔尼亚只是一个概念，那些是 [GetCulture('french').GetName] 土地！"
 fm_fru_oc.1.b: "我们没有时间或资源去争取保住这些土地，如果[GetCulture('occitan').GetName]人民想要独立，他们就应该得到独立。"
 fm_sae.1.t: "萨珊帝国"
 fm_sae.1.d: "萨珊帝国覆灭后，王朝的残余在塞尔柱统治下治理着一小块领土，但在塞尔柱衰落后，他们最终在波斯重新获得了重要立足点。"
 fm_sae.1.f: "尽管实现了复兴，伊斯兰教的广泛影响以及萨珊帝国的皇帝[ROOT.GetCountry.GetRuler.GetFullName]最近的改宗带来了重大挑战，引发了深刻危机，因为帝国努力调和其[GetReligion('zoroastrian').GetName]传统与新兴信仰的传播及其社会变革。"
 fm_sae.1.a: "我们前路多艰"
 fm_sae.2.t: "战争的结束"
 fm_sae.2.d: "随着王公的叛乱被成功挫败，皇帝现在可以专注于重建和促进公民之间的团结"
 fm_sae.2.f: "随着内部挑战的解决，皇帝可以战略性地将重心转向扩大帝国对邻近[GetReligion('sunni').GetName]国家的影响力。\n[ROOT.GetCountry.GetName]将成为伊斯兰世界新的霸权！"
 fm_sae.2.a: "[ROOT.GetCountry.GetRuler.GetFullName]万岁！"
 fm_sae.3.t: "王公叛乱"
 fm_sae.3.d: "王公反抗[GetReligion('sunni').GetName]皇帝的起义标志着帝国持续的宗教和政治紧张局势的一个重要时刻，因为他试图恢复琐罗亚斯德教的历史影响力并挑战现行的伊斯兰权威"
 fm_sae.3.f: "他的志向植根于文化遗产和身份的复杂织锦，可能在多元化民众中激起支持与反对，最终重塑帝国的未来动态，并可能导致该地区更广泛的权力和宗教认可斗争。\n随着王公军队向泰西封推进，我们必须迅速巩固力量，召集忠诚者，并确保关键战略位置，以防御叛乱。"
 fm_sae.3.a: "安拉胡阿克巴！"
 fm_sae.3.b: "祆教必须成为帝国的唯一宗教！"
 fm_sae.4.t: "新皇帝"
 fm_sae.4.d: "随着王公在内战中获胜，前皇帝流亡，帝国迎来了新篇章，标志着祆教的复兴。"
 fm_sae.4.f: "王公可利用这一胜利巩固权力，通过在共同身份下团结各派系，培养稳定感和共同目标。\n旨在振兴经济、基础设施和文化遗产的举措对于建立一个繁荣且具韧性的社会至关重要，同时也需吸取过去的教训以防未来冲突。\n这一关键时刻为重新定义帝国的遗产并确保持久稳定提供了机会。"
 fm_sae.4.a: "皇帝万岁！"
 fm_sae.5.t: "皇帝面临严峻的两难境地"
 fm_sae.5.d: "参加法尔斯地区的年度庆典，以表达对大祭司和[GetReligion('zoroastrian').GetName]信仰传统的尊重，特别要避免被认为对[GetReligion('sunni').GetName]人口有偏见；或优先与议会和委员会进行有关西部地区投资的关键会议，这对帝国的经济稳定至关重要。"
 fm_sae.5.f: "西部地区恰好居住着大部分[GetReligion('sunni').GetName]人口，因此不参加庆典很可能会被视为对[GetReligion('sunni').GetName]人口的纵容行为。\n平衡这些相互竞争的利益至关重要，因为忽视庆典可能引发[GetReligion('zoroastrian').GetName]人口的不满，而放弃投资讨论可能导致经济挫折，危及帝国的整体实力和凝聚力。"
 fm_sae.5.a: "帝国的财政状况是目前最紧迫的问题"
 fm_sae.5.b: "我将尊重[GetReligion('zoroastrian').GetName]的传统"
 fm_sae.6.t: "布尔津·密赫尔圣火庙节"
 fm_sae.6.d: "皇帝受到阿杜尔·布尔森-米尔大圣火大祭司的邀请，参加在呼罗珊举行的年度庆典"
 fm_sae.6.f: "参加呼罗珊的年度庆典对维持与阿杜尔·布爾岑-米赫爾大圣火大祭司的关系以及表达对[GetReligion('zoroastrian').GetName]信仰的支持至关重要，但这将表明忽视了有关[GetReligion('sunni').GetName]人口的紧迫问题，因为皇帝原定在该期间与泰西封的伊玛目会面，讨论伊斯兰教在帝国的未来。\n平衡这些义务对于避免被视为偏袒或不宽容至关重要，因为这两项活动在帝国的政治和社会格局中都具有重要意义。"
 fm_sae.6.a: "会见克特西丰特的伊玛目"
 fm_sae.6.b: "出席布尔津·密赫尔圣火庙节"
 fm_sae.7.t: "克特西丰特清真寺"
 fm_sae.7.d: "泰西封的伊玛目已筹集足够资金在泰西封建造一座清真寺。\n在泰西封建造清真寺的提议引发了重大争议，因为大祭司们强烈反对他们认为是对帝国首都[GetReligion('zoroastrian').GetName]主导地位挑战的行为。"
 fm_sae.7.f: "他们的愤怒凸显了宗教团体之间的深层紧张关系，因为[GetReligion('sunni').GetName]团体的努力被一些人视为对传统的冒犯和对既定社会秩序的威胁。\n皇帝必须小心应对这一政治雷区；支持清真寺的建设可能促进宗教宽容并确认[GetReligion('sunni').GetName]少数群体的权利，但同时可能引发保守[GetReligion('zoroastrian').GetName]派系的强烈反对。\n找到一条促进宗教间对话与和谐的道路，可能在日益加剧的分裂和不安中增强帝国的团结。"
 fm_sae.7.a: "批准建造清真寺"
 fm_sae.7.b: "阻止施工"
 fm_sae.8.t: "被囚禁的传教士"
 fm_sae.8.d: "在一个复杂的情况下，伊拉克-阿贾米和马赞达兰的统治者拘留了两名[GetReligion('sunni').GetName]传教士，促使当地民众主张驱逐他们。"
 fm_sae.8.f: "尽管来自地区的压力，皇帝有权干预，并可能下令释放传教士，使他们能够继续宗教活动。\n这一决定可能反映了维持当地秩序与回应传教士目标之间的平衡，凸显了治理、信仰与当地情绪之间的紧张关系。"
 fm_sae.8.a: "命令释放他们"
 fm_sae.8.b: "把他们的命运交给总督"
 fm_sae.9.t: "伊斯法罕的混乱"
 fm_sae.9.d: "在有关该地区可能发生[GetReligion('sunni').GetName]叛乱的谣言传播后，几天前伊斯法罕当局开始了一项全面调查，以寻找任何可能证实该谣言的线索。"
 fm_sae.9.f: "局势迅速升级，伊斯法罕的民众出于过去几年逐渐增长的普遍怨恨，开始迫害[GetReligion('sunni').GetName]信徒。\n[GetReligion('sunni').GetName]信徒被从家中拖出并遭到公开私刑，情况每小时都在恶化。"
 fm_sae.9.a: "呼叫军队并停止屠杀"
 fm_sae.9.b: "睁一只眼闭一只眼"
 fm_sae.10.t: "一个新宗教税"
 fm_sae.10.d: "议会中较为保守的成员一直试图推动对帝国穆斯林少数群体的不公平宗教税，由于皇帝最近的改宗以及对伊斯兰教的怨恨上升\n他们已成功聚集足够支持通过该法案"
 fm_sae.10.f: "皇帝正站在一个关键的十字路口，面临批准对穆斯林少数群体征收宗教税的重大影响。\n支持该税可能会加剧宗教紧张局势，深化帝国内部的分裂，破坏他希望维护的团结与宽容原则，特别是在他最近改宗[GetReligion('sunni').GetName]伊斯兰教之后。\n相反，拒绝该提案可能疏远议会中的保守派，威胁他的政治联盟和稳定。"
 fm_sae.10.a: "[concept_veto] 法案"
 fm_sae.10.b: "签署法案"
 fm_sae.11.t: "接纳之路"
 fm_sae.11.d: "泰西封的穆尔希德提议采取更宽松的宗教法律，旨在促进[GetReligion('sunni').GetName]穆斯林与祆教徒之间的和谐，承认在一个日益多元的帝国中共存的需要。"
 fm_sae.11.f: "然而，他的建议在[GetInterestGroupVariant('ig_devout',GetPlayer).GetNameWithCountryVariant]成员中引发了担忧，他们担心这可能是以隐晦的方式逐渐用伊斯兰教取代祆教，削弱其社区根深蒂固的文化和宗教传统。\n在追求社会团结与保持独特宗教身份之间取得平衡，是应对帝国神学景观复杂性的重大挑战。"
 fm_sae.11.a: "[GetReligion('sunni').GetName] 人民在我的统治下永远不会受到歧视！"
 fm_sae.11.b: "我不能激怒[GetInterestGroupVariant('ig_devout',GetPlayer).GetNameWithCountryVariant]和[GetReligion('zoroastrian').GetName]信徒"
 fm_sae.12.t: "伊斯兰的新时代"
 fm_sae.12.d: "随着我们的国家成为伊斯兰世界的霸主，一个变革性的时代正在到来，预示着前所未有的经济增长、文化繁荣以及穆斯林社区间更紧密的团结。"
 fm_sae.12.f: "这种新获得的稳定性和影响力可以促进在贸易、教育和技术创新方面的更大合作，从而提高许多人的生活水平，同时为艺术和智力成就营造一个丰富的环境。\n随着[ROOT.GetCountry.GetName]巩固其权力，确保繁荣公平分享至关重要，促进惠及所有人群的包容性发展。"
 fm_sae.12.a: "[ROOT.GetCountry.GetName]万岁！"
 fm_sae.13.t: "最后的圣火"
 fm_sae.13.d: "随着三大圣火中的最后一团，阿杜尔·古什纳普，现在安全地处于我们的保护之下，[GetReligion('zoroastrian').GetName] 人民欢欣鼓舞，标志着帝国重要的文化和精神里程碑"
 fm_sae.13.f: "这一事件不仅巩固了皇帝统治的合法性，还象征着宗教传统的复兴，在信徒心中引起深刻共鸣。\n可以组织庆祝仪式和公共节日来纪念阿杜尔·古什纳普，从而团结民众，激发对[ROOT.GetCountry.GetRuler.GetFullName]的支持。\n通过围绕这一神圣象征培养社区感，皇帝可以加强国家认同，促进[GetReligion('zoroastrian').GetName]价值观，为帝国更统一、更繁荣的未来铺平道路。"
 fm_sae.13.a: "皇帝万岁！"
 fm_fla.1.t: "皇家婚礼"
 fm_fla.1.d: "今天是[SCOPE.sCharacter('fla_ruler').GetFullName]与\n#V 玛丽·泰蕾兹·德·波旁-孔代#!的婚礼。"
 fm_fla.1.f: "在一场令人心动的盛大庆典中，[SCOPE.sCharacter('fla_ruler').GetFullName]与#V 玛丽·泰蕾兹·德·波旁-孔代#!的皇家婚礼在一座宏伟的中世纪大教堂中隆重举行。\n会场挂满华丽的挂毯，装饰着鲜艳的花朵，欢快的音乐回荡，贵族与平民齐聚一堂，见证两个强大家族的联姻。\n新娘身着镶有精致蕾丝的丝绸礼服，光彩照人；新郎身着华丽的纹章服饰，英姿勃发，在闪烁的彩色玻璃窗背景下交换誓言。\n随着宴会、舞蹈和衷心祝酒的继续，夜晚充满了政治联盟与永恒爱情的承诺，预示着两个王国繁荣新时代的到来。"
 fm_fla.1.a: "新郎新娘万岁！"
 fm_bud.1.t: "勃艮第王国"
 fm_bud.1.d: "当夕阳西下，笼罩在勃艮第如画的风景中时，空气中弥漫着一种热切的期待"
 fm_bud.1.f: "新勃艮第王国的宣布引发了城镇和村庄的欢呼与庆祝。\n身着鲜艳服饰的人群聚集在中央广场，一面巨大的旗帜展开，上面绣着王国的徽章——勃艮第十字。\n音乐响彻街头，活泼的民间舞蹈展现了人民的精神，桌上摆满了当地美食和美酒的丰盛宴席。\n烟花点亮夜空，照亮了满怀希望的市民面庞，他们庆祝的不仅是新的政治时代，还有共同的身份和对丰富遗产的自豪。\n空气中弥漫着繁荣未来的承诺，勃艮第人民在欢乐与决心中团结一致，共同建设他们的王国。"
 fm_bud.1.a: "[ROOT.GetCountry.GetName]万岁！"
 fm_dumn.1: "无烟火药的发明比黑火药更方便且威力更大，使我们能够在保持相同动能的情况下减小子弹口径。\n此外，枪支更加精准，制造成本更低，子弹的穿透力也大大增强。\n唯一的缺点是子弹容易过度穿透目标，这对我们文明的士兵来说不是问题，因为他们受伤后习惯躺下等待救援；但在殖民地对抗未开化的狂热部落民时却是个问题，这些部落民显然公然违反了受伤人员应遵循的适当行为的共识。\n加尔各答的一位人士开发了一种新型子弹——达姆弹，以解决这一问题，这种子弹在穿透后会膨胀。\n这种弹药能阻止任何士兵履行职责，但也几乎肯定会对士兵造成永久性伤害。\n在现代战争中使用这种子弹的后果已在讨论中，大多数知识分子已开始批评这种做法带来的不人道后果。"
 dec_stateof: "宣布紧急状态"
 dec_stateof_desc: "A state of emergency is a situation in which a [concept_government] is empowered to put through policies that it would normally not be permitted to do, for the safety and protection of its citizens."
 tooltip_stateof: "在过去10年中未做出该决定"
 fm_stateof.1.t: "紧急状态"
 fm_stateof.1.d: "[concept_government]已经宣布了紧急状态"
 fm_stateof.1.f: "宣布紧急状态加剧了政治紧张和公众不安，激化了现有不满，导致某些群体激进化。\n政治家们对政府被认为的越权或无效应对表示沮丧，而对现状不满的公民则倾向于更极端的意识形态，以表达他们的不满。\n这种动荡的环境将导致抗议、冲突增加，当局面临在恢复秩序的同时解决引发公众愤怒的根本问题的挑战。"
 fm_stateof.1.a: "祈祷一切安好"
 corn_laws.1.t: "谷物法的结束"
 corn_laws.1.d: "被称为《谷物法》的谷物进口税已被废除，这意味着政治上要逐渐偏离重商主义和地主权力。"
 corn_laws.1.f: "“有些人或许会说，我们屈服于商人的意志，将经济权力从本国的土地转移到了国际贸易的水域。他们太容易忘记了，对他们的权力来说，没有什么比一大群饥饿的农民能造成更大的威胁。”"
 corn_laws.1.a: "让谷物贸易开始吧！"
 corn_laws.2.t: "现代保守派"
 corn_laws.2.d: "一名新人于[SCOPE.gsInterestGroup('landowners_ig').GetName]中发迹，参加了废除谷物税的非正统政治活动。"
 corn_laws.2.f: "“尽管也许很多人认为我和同事得出的危险的结论是错误的，但我希望，在参考了政府的数据之后，我建议他们不要太自信，因为距离我们重新为人民开辟新的粮食供给途径还有七个月，我可是还记得近期的账目；所以我要求众议院不要过于着急认定危险已经消失，因为事实并非如此。先生，我相信我已经使那些认为我错误的某些人相信，我的建议至少是真诚的，而我建议采取必要的非常措施。”"
 corn_laws.2.a: "我们这个时代的启发者！"
 corn_laws.2.b: "[SCOPE.gsInterestGroup('landowners_ig').GetLeader.GetFullName]的议程能更好地为[SCOPE.gsInterestGroup('landowners_ig').GetName]的利益服务。"
 corn_laws.3.t: "谷粟之力"
 corn_laws.3.d: "谷物法，即我们对谷物进口的征税，为地主阶级提供了大量的经济杠杆，他们利用这些杠杆来维持对[ROOT.GetCountry.GetAdjectiveNoFormatting]政策的影响。"
 corn_laws.3.f: "“讨论经济政策是好事，但我们绝不能对理论产生的现实视而不见。谷物法承诺其可以保护[ROOT.GetCountry.GetNameNoFormatting]的利益，这一点听上去越来越空洞。恰恰相反，它保护的是一批经过精挑细选的少数[ROOT.GetCountry.GetAdjectiveNoFormatting]公民的利益。有人会忍不住想，其他的法律是不是也是这样。”"
 corn_laws.3.a: "每个国家都需要贵族阶层来统治下等阶层。"
 corn_laws.3.b: "令人不安的发展。"
 corn_laws.4.t: "没有面包，没有自由"
 corn_laws.4.d: "我们对谷物征收的高额进口税使得穷人很难买得起面包，[SCOPE.sState('bread_buying_state').GetName]的人们面临着挨饿的境地。"
 corn_laws.4.f: "“他们说征收关税是为了保护[ROOT.GetCountry.GetAdjectiveNoFormatting]农民免于工资下降和挨饿。没有关税，市场就会被我们买不起的面包淹没。对此我要说，去他妈的关税！我已经快饿死了。至少没有关税的时候，挨饿的人还能偷到面包呢！”"
 corn_laws.4.a: "穷人也必须能从我们的政策中受益。"
 corn_laws.4.b: "让他们忍着，这是为了经济。"
 rum.1.t: "罗姆苏丹国"
 rum.1.d: "[ROOT.GetCountry.GetName]现在进入了一段稳定的下降期。如果我们不去声张[ROOT.GetCountry.GetAdjectiveNoFormatting]的主权，在群雄并起的世界夺回我们的地位，我们就会陷入毁灭的风险。"
 rum.1.f: "我们衰败了，但我们可以再次崛起。在一次富有冒险精神的事变中，我们废除了禁卫军——这些人可悲地把持权力长达几个世纪，终于在最后关头同意进行改革。接下来还有更多的工作要做。首先，我们要用一支真正的现代化军队来取代禁卫军。此外，我们必须重建土耳其高门作为文明的最高点。教育，城市化以及国家主权应当被提到[ROOT.GetCountry.GetAdjectiveNoFormatting]议程的最优先项。"
 rum.1.a: "需要进行大改革。"
 rum.2.t: "改革：再组织"
 rum.2.desc: "[ROOT.GetCountry.GetName]已成功实现现代化，\n并在世界舞台上重新确立地位。\n[ROOT.GetCountry.GetAdjectiveNoFormatting]国家开启了一个新时代。"
 rum.2.f: "崇高。这是唯一合适的词。\n漫步在科尼亚街头，看到现代化的工厂和学校，看到卫兵进行军事操练。\n曾经由农民主导的景观如今点缀着闪耀的城市。想到几年前苏丹国还濒临崩溃！曾经欧洲列强以怜悯和贪婪的目光看待我们，急于瓜分我们的土地，现在他们的外交官却惊叹于我们的成就，被迫承认我们为平等的存在。真主至善！"
 rum.2.a: "我们终于可以集中精力巩固自己作为罗马真正统治者的地位了！"
 rum.2.b: "我们没有忘记东方的[GetReligion('sunni').GetName]兄弟"
 rum.3.t: "罗马的统治者"
 rum.3.d: "The [ROOT.GetCountry.GetName] has established itself as the true ruler of the Roman People"
 rum.3.f: "罗姆苏丹国对东罗马帝国的胜利标志着该地区历史上的重大转折点，象征着权力和影响力的转移。\n这一胜利不仅巩固了苏丹国对原东罗马领土的统治，还促进了[GetCulture('turkish').GetName]文化和伊斯兰教的传播，重塑了安纳托利亚的社会政治格局。"
 rum.3.a: "荣耀属于[ROOT.GetCountry.GetName]"
 rum.4.t: "伟大复兴"
 rum.4.d: "在[ROOT.GetCountry.GetRuler.GetFullName]的领导下，罗姆苏丹国转变为[ROOT.GetCountry.GetName]，标志着塞尔柱文化遗产的重大复兴"
 rum.4.f: "这一重建不仅象征着安纳托利亚权力的复兴，还旨在统一前塞尔柱领土上多样化的文化和经济景观，促进贸易并增强军事力量。\n在卡拉曼贝伊王朝的领导下，[ROOT.GetCountry.GetName]力求平衡传统与现代治理的愿景，可能重塑该地区的政治动态。"
 rum.4.a: "[ROOT.GetCountry.GetRuler.GetFullName]万岁"
 rum.5.t: "叛乱的低语"
 rum.5.d: "在一位当地伊玛目指责[SCOPE.sReligion('discriminated_religion_scope').GetName]社区与[SCOPE.sCountry('neighbor_country').GetName]勾结破坏[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的权威后，一种偏执的氛围笼罩了[SCOPE.sState('paranoia_state_scope').GetCityHubName]。"
 rum.5.f: "“真主的敌人能与伊斯兰教平等吗？[ROOT.GetCountry.GetCapital.GetCityHubName]的一些腐败帕夏可能这么认为，但我们真正的信徒知道真相。此刻，我们中间的不信者正忙于策划我们的毁灭，与他们的外国主子合谋，像糖果师切割巴克拉瓦一样瓜分我们伟大的帝国。”"
 rum.5.a: "那些只是谣言，对吧？"
 rum.5.b: "对有卖国嫌疑的人一定要出重拳，小心驶得万年船。"
 rum.5.tt1: "激进的逊尼派可能会自己动手解决问题。"
 rum.5.tt2: "你的行动会让逊尼激进派满意。"
 rum.6.t: "[SCOPE.sCulture('mob_victim_culture').GetName] 区的骚乱"
 rum.6.d: "对高门提升非穆斯林法律地位的决定感到愤怒，并受到外国支持叛乱谣言的煽动，一大群[SCOPE.sReligion('mob_religion').GetName]暴民在[SCOPE.sState('mob_state_scope').GetCityHubName]的[SCOPE.sCulture('mob_victim_culture').GetName]区肆虐。"
 rum.6.f: "“他们在中午祈祷后来了，手持棍棒——无疑是被某个激进的当地传教士煽动的。感谢真主，目前只有一些瘀伤和物质损失，但我不太喜欢西门那边那群人的样子。”"
 rum.6.a: "让当地总督去处理。"
 rum.6.b: "集结军队，立即出手介入。"
 rum.6.c: "让那群暴民自生自灭吧。"
 rum.6.tt1: "你的行动可能会使事态升级。"
 rum.6.tt2: "你的行动很可能会避免事态升级。"
 rum.6.tt3: "你的不作为很可能会使事态升级。"
 mobilizing_the_militia: "调动军队"
 deploying_the_army: "部署军队"
 rum.7.t: "[SCOPE.sState('massacre_state_scope').GetCityHubName] 大屠杀"
 rum.7.d: "天啊！一大群狂怒的[SCOPE.sReligion('sunni_religion').GetName]暴徒残忍地攻击了他们的[SCOPE.sReligion('massacre_victims').GetName]邻居。[SCOPE.sState('massacre_state_scope').GetCityHubName]的街道都被鲜血染红了，这座城市大部分地区都在燃烧。"
 rum.7.f: "“谁故意杀害一个信士，谁要受火狱的报酬，而永居其中，且受真主的谴怒和弃绝，真主已为他预备重大的刑罚。”"
 rum.7.a: "驱散人群，有必要就开火。"
 rum.7.b: "这应该可以让那些潜在的叛徒乖乖听话"
 rum.8.t: "秩序已于 [SCOPE.sState('orderrestored_state_scope').GetName] 恢复"
 rum.8.d: "[SCOPE.sState('orderrestored_state_scope').GetCityHubName]的街道恢复了正常的气息。店面正在重建和重新进货，不信任和仇恨的话语逐渐被和解的话语取代。"
 rum.8.f: "“那些混蛋毁了我的店，侮辱了我的名字！不过还好，也就这样了。我儿子看见了至少两个参与暴乱的男子被士兵拖走，显然是被他们自己社区揭发的。也许这里还是有些公道的。现在把糖递给我吧，这茶苦得和没腌制的橄榄一样。”"
 rum.8.a: "感谢安拉！"
 rum.9.t: "自给农抵制土地登记"
 rum.9.d: "随着加税和服兵役的可能性越来越大，[SCOPE.sState('peasant_state').GetName]的自给农拒绝登记他们的土地，这使得我们无法获得急需的税赋收入。"
 rum.9.f: "“两百年来，我的家族一直在这片土地上劳作；根据传统缴纳捐税。但是，现在[ROOT.GetCountry.GetCapital.GetCityHubName]的帕夏们又搞了一套阴险的制度来榨干我们，而我的儿子则会被征召到遥远的战场上送死。”"
 rum.9.a: "让当地谢赫买下他们的土地，税赋必须流动起来。"
 rum.9.b: "[SCOPE.sCharacter('peasant_smashing_general').GetFullName]和[SCOPE.sCharacter('peasant_smashing_general').GetHerHis]的兵会平息这场骚乱。"
 rum.9.c: "不用搭理他们，谁在乎[SCOPE.sState('peasant_state').GetNameNoFormatting]？"
 peasant_unrest: "自给农抵制登记"
 expanding_holdings: "扩大地产"
 rum.10.t: "征召齐米"
 rum.10.d: "随着征兵制度的建立，国家现在必须决定非穆斯林在我国军中扮演的角色，如果有的话。"
 rum.10.f: "传统上，帝国的非穆斯林臣民无需服兵役，而是以向高门支付“吉兹亚”税的方式代替他们的血。现在，军队现代化的拥护者建议将征兵范围扩大到罗姆的全体臣民，但是，这样一来，帝国就失去了一个重要的收入来源。"
 rum.10.a: "那些负担得起的人可以缴纳征召豁免税。"
 rum.10.b: "征召适用于所有臣民，不管其信仰为何。"
 draft_exemption_tax: "军事豁免税"
 fm_wareco.1.t: "产业转型开始"
 fm_wareco.1.d: "曾经专注于消费品的行业转向制造武器、车辆和物资"
 fm_wareco.1.f: "随着国家开始向战时经济过渡，各部门开始重新分配资源并调整运营，优先考虑军事生产和支持。\n虽然这些变化可能在短期内刺激经济增长，但也可能对民用产业和整体经济稳定产生长期影响，引发关于可持续性及更广泛社会影响的疑问。"
 fm_wareco.1.a: "生产更多枪支！"
 fm_wareco.2.t: "经济战结束"
 fm_wareco.2.d: "随着军事需求的下降，\n重点转向将工厂和设施转回民用生产"
 fm_wareco.2.f: "随着军事合同的减少，曾经专注于武器和国防相关制造的产业开始转向民用商品。\n这种转变不仅旨在恢复经济稳定，还再次满足平民人口的需求和喜好。"
 fm_wareco.2.a: "我们时代的和平"
 fm_wareco.3.t: "军工生产进入白热化阶段"
 fm_wareco.3.d: "随着军工生产全面加速，大批工厂仓库被改建为军需设施"
 fm_wareco.3.f: "这种工业活动的激增不仅旨在满足迫切的军事需求，还反映了动员整个经济和劳动力的全国努力，显著改变了生产和劳动格局。"
 fm_wareco.3.a: "生产更多枪支！"
 fm_wareco.4.t: "战时经济"
 fm_wareco.4.d: "军工生产已达顶峰"
 fm_wareco.4.f: "随着更多建筑物被改建以增强军事生产能力，工业战争努力急剧升级。\n废弃的仓库甚至老旧的制造场所迅速被改造成生产中心，供应链得到优化以确保原材料的稳定供应，同时物流被精细调整以应对扩大的运营规模。"
 fm_wareco.4.a: "完美战争机器"
 warecohelp: "经济将逐步转变为战时经济，带来逐渐增加的产出加成和减益。"
 concept_japthrone: "菊花王座"
 concept_japthrone_desc: "菊花王座是日本天皇的宝座。"
 concept_taikun: "大君"
 concept_taikun_desc: "这个词的字面意思是“大君”或“最高指挥官”，它是一个世袭头衔，授予织田家族的族长，因为他们没有资格获得#D 将军#的头衔#!"
 concept_daimyo: "大名"
 concept_daimyo_desc: "大名一词既可以指统治日本大部分地区的势力强大的[GetCulture('japanese').GetName]权贵和封建领主，也可以指他们的领地。"
 concept_toki: "时辰"
 concept_toki_desc: "在采用西式计时方法之前，日本曾使用时辰制，将一天分为12个时段，每个时段称为“一时”，即一个时辰。"
 concept_empjimmu: "神武天皇"
 concept_empjimmu_desc: "据《日本书纪》和《古事记》记载，神武天皇是传说中的日本第一位天皇。"
 concept_suyu: "苏尤"
 concept_suyu_desc: "帝国的四个角落，在库斯科中心交汇。\n这些苏尤大约是在1460年帕查库蒂在位期间创建的，当时印加帝国还未达到其领土的最大范围。"
 fm_jae.1.t: "日本帝国"
 fm_jae.1.d: "在1588年，由于织田信长的努力，日本在后阳成天皇的领导下实现了统一。"
 fm_jae.1.f: "虽然织田信长拒绝接受任何头衔，但他的儿子织田信忠，一个雄心勃勃的人，接受了[concept_taikun]的头衔，并成功使之世袭。\n随着[SCOPE.sStrategicRegion('japan_region').GetName]的繁荣，#N 织田家族#!的权力也随之增长，成为[SCOPE.sStrategicRegion('japan_region').GetName]中最具影响力的家族。\n[SCOPE.sStrategicRegion('japan_region').GetName]最后一位天皇的最近去世造成了一个不稳定的局面，其六岁的儿子#D 大和丰重#!健康状况不佳，可能引发继承危机。\n这一困境因缺乏其他合法的[concept_japthrone]继承人而加剧，令人担忧有影响力的家族，尤其是织田家族，可能利用这一不稳定局势扶植傀儡统治者，从而可能削弱传统的皇室血统和[SCOPE.sStrategicRegion('japan_region').GetName]的政治平衡。"
 fm_jae.1.a: "愿天皇万寿无疆"
 fm_jae.2.t: "天皇驾崩"
 fm_jae.2.d: "大和丰重，[SCOPE.sStrategicRegion('japan_region').GetName]的第121位天皇，于今日[concept_toki]时去世。"
 fm_jae.2.f: "随着天皇的去世且无合法继承人可用，[SCOPE.sStrategicRegion('japan_region').GetName]的局势变得愈发严峻，促使安土的官僚们寻找与[concept_empjimmu]有关的继任者，这一进程数月前已开始，但至今未果。\n#N 织田氏#!可能利用这一权力真空在皇宫扶植傀儡统治者的威胁日益加剧，人们担心政治格局动荡，因为国家在这场前所未有的继承危机中准备迎接可能的剧变。"
 fm_jae.2.a: "未来会是什么样？"
 fm_jae.3.t: "天皇驾崩"
 fm_jae.3.d: "大和丰重，[SCOPE.sStrategicRegion('japan_region').GetName]的第121位天皇，于今日[concept_toki]时去世。"
 fm_jae.3.f: "随着天皇的去世且无合法继承人可用，[SCOPE.sStrategicRegion('japan_region').GetName]的局势变得愈发严峻，促使安土的官僚们寻找与[concept_empjimmu]有关的继任者，这一进程数月前已开始，但至今未果。\n由于未找到合法继承人，这是我们进军安土并使[ROOT.GetCountry.GetRuler.GetFullName]成为[SCOPE.sStrategicRegion('japan_region').GetName]实际统治者的机会！"
 fm_jae.3.a: "[SCOPE.sStrategicRegion('japan_region').GetName] 应该是我们的！"
 fm_jae.4.t: "天皇驾崩"
 fm_jae.4.d: "大和丰重，[SCOPE.sStrategicRegion('japan_region').GetName]的第121位天皇，于今日[concept_toki]时去世。"
 fm_jae.4.f: "随着天皇的去世且无合法继承人可用，[SCOPE.sStrategicRegion('japan_region').GetName]的局势变得愈发严峻，促使安土的官僚们寻找与[concept_empjimmu]有关的继任者，这一进程数月前已开始，但至今未果。\n#N 织田氏#!可能利用这一权力真空在皇宫扶植傀儡统治者的威胁日益加剧，人们担心政治格局动荡，因为国家在这场前所未有的继承危机中准备迎接可能的剧变。"
 fm_jae.4.a: "未来会是什么样？"
 fm_jae.5.t: "天皇驾崩"
 fm_jae.5.d: "大和丰重，[SCOPE.sStrategicRegion('japan_region').GetName]的第121位天皇，于今日[concept_toki]时去世。"
 fm_jae.5.f: "随着天皇的去世且无合法继承人可用，[SCOPE.sStrategicRegion('japan_region').GetName]的局势变得愈发严峻，促使安土的官僚们寻找与[concept_empjimmu]有关的继任者，这一进程数月前已开始，但至今未果。\n#N 织田氏#!可能利用这一权力真空在皇宫扶植傀儡统治者的威胁日益加剧，人们担心政治格局动荡，因为国家在这场前所未有的继承危机中准备迎接可能的剧变。"
 fm_jae.5.a: "未来会是什么样？"
 fm_jae.6.t: "向安土进军"
 fm_jae.6.d: "今晨，我们的军队果断进入安土皇宫，标志着我们家族历史和日本未来的关键时刻。"
 fm_jae.6.f: "大和治仁被宣布为[SCOPE.sStrategicRegion('japan_region').GetName]的新天皇。\n在皇室血统陷入混乱之际，我们有责任恢复国家的稳定，已向[SCOPE.sStrategicRegion('japan_region').GetName]的所有[concept_daimyo]发送信函，要求他们向新天皇宣誓效忠，更重要的是向[ROOT.GetCountry.GetRuler.GetLastName]家族效忠。"
 fm_jae.6.a: "我们将统治[SCOPE.sStrategicRegion('japan_region').GetName]！"
 fm_jae.8.t: "向安土进军"
 fm_jae.8.d: "今晨，织田信和的军队攻入安土皇宫，宣布#D 大和治仁#!为[SCOPE.sStrategicRegion('japan_region').GetName]的新天皇。"
 fm_jae.8.f: "鉴于缺乏与历史皇室血统的直接联系，这一新政权的合法性已受到质疑；信和要求所有[concept_daimyo]向#D 治仁#!宣誓效忠，有效巩固其权力并引发权威平衡的重大转变。\n我们面临严峻抉择：要么向这个新建立但不合法的政权宣誓效忠，实际上成为强大的#N 织田家族#!的附庸，要么拒绝织田的权威，冒着失去我们领地自治权的风险。"
 fm_jae.8.a: "织田家族的灭亡！"
 fm_jae.8.b: "宣誓效忠"
 fm_jae.7.t: "向安土进军"
 fm_jae.7.d: "今晨，织田信和的军队攻入安土皇宫，宣布#D 大和治仁#!为[SCOPE.sStrategicRegion('japan_region').GetName]的新天皇。"
 fm_jae.7.f: "鉴于缺乏与历史皇室血统的直接联系，这一新政权的合法性已受到质疑；信和要求所有[concept_daimyo]向#D 治仁#!宣誓效忠，唯一例外是我们家族，感谢我们与西方的联系。\n我们可以利用这场危机宣称对[SCOPE.sState('kyushus').GetName]的全部控制权，巩固我们的地位，并在巩固家族权力后决定如何应对织田家族。"
 fm_jae.7.a: "[SCOPE.sState('kyushus').GetName] 将成为我们的！"
 fm_jae.9.t: "[SCOPE.sStrategicRegion('japan_region').GetName] 统一"
 fm_jae.9.d: "[SCOPE.sStrategicRegion('japan_region').GetName]再次统一，但现在我们必须确保不需要有下一次。"
 fm_jae.9.f: "为有效稳定[SCOPE.sStrategicRegion('japan_region').GetName]并防止未来分裂，废除[concept_daimyo]制度至关重要，因为这将瓦解封建忠诚并建立更集中的权威。\n这一转变必须与全面的现代化努力相结合，包括建立统一的法律框架、促进工业化、投资教育和基础设施，以及培养超越地区归属的国家认同感。"
 fm_jae.9.a: "愿[ROOT.GetCountry.GetName]能再繁荣昌盛一千年！"
 fm_jae.10.t: "[concept_daimyo]体系的终结"
 fm_jae.10.d: "[concept_daimyo]制度已被废除，取而代之的是府县制度，在[SCOPE.sStrategicRegion('japan_region').GetName]建立了更集中的治理形式。"
 fm_jae.10.f: "Under this new system, the country is divided into prefectures, each administered by a governor appointed by the central [concept_government].\nThis shift allows for uniform laws and policies across the nation, reducing regional fragmentation and fostering a sense of national identity.\nThe prefecture system facilitates modern administration, infrastructure development, and resource allocation, ensuring that all citizens are governed under a cohesive set of regulations that promote stability and progress."
 fm_jae.10.a: "[SCOPE.sStrategicRegion('japan_region').GetName]板载！"
 fm_jae.11.t: ""
 fm_jae.11.d: ""
 fm_jae.11.f: ""
 fm_jae.11.a: ""
 fm_jae.12.t: ""
 fm_jae.12.d: ""
 fm_jae.12.f: ""
 fm_jae.12.a: ""
 ig_daimyo: "大名"
 jaep.2.t: "全新的日本"
 jaep.2.d: "一支改革完毕的军队，一个开放且被认可的国家，一个新的社会。[ROOT.GetCountry.GetName]屹立于世界强国之列，可能会开始追求自己的帝国野心。"
 jaep.2.f: "“朕赖天佑保有，践万世一系之皇祚。我国之开化未浃，政律亦从而相异，非费时月能达其期望；故欲勉行于开明各国，择诸方法，采适宜妥当者，施之于我国，渐次改革政俗，使同一致。”"
 jaep.2.a: "[ROOT.GetCountry.GetName]将会崛起。"
 jaep.2.b: "我们需要强大的朋友，因为我们会树立强大的敌人。"
 jaep.2.c: "工业化是走向成功的关键。"
 japan_military_rewardfm: "日本军事改革"
 japan_diplomatic_rewardfm: "日本大使"
 japan_production_rewardfm: "现代日本铁路"
 jaep.3.t: "武士的落幕"
 jaep.3.d: "[ROOT.GetCountry.GetName]成功改革了军队，终结了落后的封建体系。[SCOPE.gsInterestGroup('samurai_ig').GetName]阶层似乎不再拥有现代社会的一席之地。"
 jaep.3.f: "将军统治[concept_daimyo]，而这些人又依靠武士来维持对被奴役农民的统治。这是[GetCulture('japanese').GetName]的根基，但现在已经成为了过去的遗迹。还有一些人仍忠于武士的理念，这些准则和美德被称为武士道，这一遗产当然会延续下去。但武士阶层已经倒下了，而且我们也不会再见到他们这类人了。"
 jaep.3.a: "让他们保留军官和贵族的身份。"
 jaep.3.b: "武士的时代结束了。"
 samurai_rename.tt: "武士利益集团将重组为军队利益集团"
 samurai_officers: "武士军官"
 jaep.4.t: "[SCOPE.sCountry('military_consultant_country').GetAdjectiveNoFormatting]军事顾问"
 jaep.4.d: "由于对[ROOT.GetCountry.GetName]的现代化进程颇有兴趣，[SCOPE.sCountry('military_consultant_country').GetName]提议向我们派遣[SCOPE.sCharacter('military_consultant_general').GetFullName]将军作为军事顾问。这一协议的条款看上去对我们非常有利，但在让外国势力给我们做人情这方面，我们应当三思。"
 jaep.4.f: "“这个，长官，是一挺加特林机枪。每分钟两百发。不管什么玩意，无论是人还是野兽还是机器，都无法承受这个器械释放的如地狱一般的子弹风暴。我们会教你的士兵操作这个机械，维持现代军事纪律，以及无条件地遵从上级的命令。”"
 jaep.4.a: "我们欢迎[SCOPE.sCountry('military_consultant_country').GetAdjectiveNoFormatting]的援助。"
 jaep.4.b: "我们不想要他们的金杯毒酒。"
 western_military_consultant: "西方军事顾问"
 jaep.5.t: "驻 [SCOPE.sCountry('japan_embassy_country').GetName] 大使馆"
 jaep.5.d: "作为使团西行旅程的一部分，我们的权贵显要同[SCOPE.sCharacter('japan_embassy_politician').GetFullName]，一位老历的[SCOPE.sCountry('japan_embassy_country').GetAdjectiveNoFormatting]的政客举行了会面。出于有兴趣同新近开国的[ROOT.GetCountry.GetAdjectiveNoFormatting]政权建立良好关系的目的，对方起草了几份我们可能希望同[SCOPE.sCountry('japan_embassy_country').GetName]签订的协议。"
 jaep.5.f: "“方今世界各国，虽皆以亲睦礼仪相交，是全为表面名义；其于阴私，强弱相凌、大小相辱之情形仍存。于当时[ROOT.GetCountry.GetName]，亲睦相交之国虽多，重国权自主如[SCOPE.sCountry('japan_embassy_country').GetAdjectiveNoFormatting]者，当谓其亲睦中之最亲睦国也。”"
 jaep.5.a: "建立牢固的外交关系。"
 jaep.5.b: "[SCOPE.sCountry('japan_embassy_country').GetName]有许多东西要教我们。"
 jaep.5.c: "我们从[SCOPE.sCountry('japan_embassy_country').GetName]那里什么也得不到。"
 jaep.6.t: "[SCOPE.sCountry('western_investor_country').GetAdjectiveNoFormatting]投资开支"
 jaep.6.d: "[SCOPE.sCharacter('western_investor_ig_leader').GetFullName]，一名来自[SCOPE.sCountry('western_investor_country').GetName]有钱又有权的实业家，将[ROOT.GetCountry.GetName]看作一个油水颇丰但尚未开发的市场。作为在未来某个时候予以政治支持的交换，[SCOPE.sCharacter('western_investor_ig_leader').GetFullName]很愿意同我们分享一些[SCOPE.sCharacter('western_investor_ig_leader').GetHerHis]母国的工业技术。"
 jaep.6.f: "“我的同僚中有一些人对[ROOT.GetCountry.GetName]的利益不屑一顾，认为此地缺乏有价值的自然资源，没有做生意的吸引力。然而，我却看到了这个国家的潜力。今日为原始森林和休耕田地的地方，明天将会成长为城市中心，吞吐着现代工业的健康烟云。”"
 jaep.6.a: "[SCOPE.sCountry('western_investor_country').GetAdjectiveNoFormatting]的心灵手巧能够让[ROOT.GetCountry.GetName]富强起来。"
 jaep.6.b: "我们不需要外国人搅局我们的经济。"
 jaep.7.t: "铁路顾问"
 jaep.7.d: "为了更快实现我们建设铁路网的雄心，有人建议从拥有铁路系统的国家邀请外国顾问来帮助我们。"
 jaep.7.f: "“我向这位先生询问了关于火车头方面的问题，算是初步结识了一下这位先生，不过没想到关于火车头会有那么多可以谈的。事实证明，关于火车，我们还有很多事情需要去了解。”"
 jaep.7.a: "[SCOPE.sC('railway_engineer_country_1').GetName]能够帮助我们。"
 jaep.7.b: "[SCOPE.sC('railway_engineer_country_2').GetName]拥有杰出的工程师！"
 jaep.7.c: "[SCOPE.sC('railway_engineer_country_3').GetName]熟悉铁路。"
 jaep.7.e: "我们不需要外国的建议。"
 jaep.8.t: "军用铁路"
 jaep.8.d: "Being privy to the [concept_government]'s ambition to expand [ROOT.GetCountry.GetName]'s railways, the [SCOPE.gsInterestGroup('armed_forces_ig').GetName] have offered to support these efforts in [SCOPE.sState('military_railway_state').GetName]."
 jaep.8.f: "“军方在任何情况下都能通过铁路获利，但是当前，这些铁路需要运用于其他的优先事项。让他们修建自己的铁路线路又是另外一回事了。在每一个时代，很大一部分权力都被把握在能够制地图的人手里。在我们的时代，铁路网络或许能够成为这些地图。”"
 jaep.8.a: "军民融合的完美范例！"
 jaep.8.b: "我们会亲自设置优先度。"
 jaep.9.t: "武刃的学生"
 jaep.9.d: "随着武士阶级特权的减少，他们持刀作为身份象征的特权受到了质疑。"
 jaep.9.f: "“也许所有国家的命运都会经历这样一个时期：战士阶级失去了他们在社会中的特殊地位，因为他们的价值必须给当代的优先事项让位。然而，剥夺一名战士的武器，不仅是剥夺他的地位，更是剥夺他的象征和他先祖的荣誉，必须被视为最大的耻辱！”"
 jaep.9.a: "是时候废除这项权利了。"
 jaep.9.b: "让其他有地位的公民也拥有这项权利。"
 jaep.9.c: "夺走武士的刀就是在撕裂他的灵魂！"
 jaep.10.t: "私学校"
 jaep.10.d: "[SCOPE.sCharacter('armed_forces_leader').GetFullName]已开始在[SCOPE.sState('kyushu_state').GetName]设立私立军校，不仅教授军事理论，还教授[SCOPE.sCharacter('armed_forces_leader').GetHerHis]自己的政治理念。"
 jaep.10.f: "“你或许会将这视作一个政治组织，然而如果我们不去教导学生需要肩负的责任，以及国家的雄心和对外扩张的重要性，我们又怎么能够将武士之魂注入他们的内心呢？如果对于侵略我们邻国的可能性闭口不谈，我们又该如何传授军事战术呢？所以说，军事力量能够被运用到哪个方面，包括将其上升到政治应用，可以并且必须成为课纲的一部分！”"
 jaep.10.a: "他们为我国的武装力量贡献了有价值的服务。"
 jaep.10.b: "在这个政治派别变得危险之前，必须关停这些学校。"
 jaep.11.t: "[SCOPE.sState('infringed_port_state').GetPortHubName]事件"
 jaep.11.d: "[SCOPE.sC('infringing_country').GetName]试图强行开放我们的一个口岸，要求进入[SCOPE.sState('infringed_port_state').GetName]港。"
 jaep.11.f: "“我先是看到[SCOPE.sC('infringing_country').GetAdjectiveNoFormatting]的水手试图接近海岸。当我召集人手想把他们赶走时，他们已经上了岸。我们大伙都是农民，不是士兵，本来也以为他们不想打斗的。结果还是发生了流血。我们其余人都逃走了。我也不知道他们后来去哪了。”"
 jaep.11.a: "反击！必须维持锁国。"
 jaep.11.b: "通过谈判来满足他们一部分要求。"
 jaep.11.c: "也许[SCOPE.sC('assistance_country').GetName]能帮我们调解这个艰难的局面。"
 jaep.12.t: "东风与西风"
 jaep.12.d: "近期发表的一篇文章讨论了锁国结束后[ROOT.GetCountry.GetName]的未来，并权衡了与亚洲其他国家结盟或者转向欧洲列强的利弊。"
 jaep.12.f: "“一个国家的阵营受到地理实际情况的限制，或许这样的思维看上去是显而易见的，但这种想法已经是过去式了。如今世界的大小已经改变。谁知道它未来会被谁掌控？而世界……也在变得越来越小。”"
 jaep.12.a: "[ROOT.GetCountry.GetName]必须脱亚入欧。"
 jaep.12.b: "我们将与邻国站在一起。"
 jaep.12.c: "前途未卜，我们需做好一切准备。"
 railway_our_way: "铁路，我们的路"
 railway_priority: "优先铁路线"
 retained_railway_control: "保留对铁路的控制"
 refused_railway_priority: "拒绝优先铁路线"
 revoked_sword_rights: "剥夺带刀权"
 retained_sword_rights: "保留带刀权"
 shi_gakko: "私学校"
 shut_down_military_academies: "关闭军校"
 suspected_insurrectionist: "有嫌疑的造反者"
 sakoku_violated: "违反锁国政策"
 diplomatic_flexibility: "外交灵活性"
 concept_veto: "否决权"
 concept_veto_desc: "否决立法机构做出的决定或提案的正式权力或权利。"
 mod_yag_1: "贿赂"
 mod_yag_2: "授予的地产"
 mod_yag_3: "自主决策权"
 mod_yag_4: "增加议员薪酬"
 mod_yag_5: "企业贪腐"
 mod_yag_6: "农业歉收救济金"
 mod_yag_7: "对粮食减产视若无睹"
