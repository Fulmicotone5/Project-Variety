l_simp_chinese:
 papal_to_rome.1.t: "永恒之城"
 papal_to_rome.1.d: "罗马国内的不满情绪日益高涨。\n在经历了数个世纪的教皇统治之后，民众变得躁动不安。像 [SCOPE.sCharacter('intelligentsia_leader').GetFullName]这样的政治人物公开疾呼，要求终结这一神圣的暴政，并由罗马人民建立一个新的共和国。\n天主教教廷则呼吁加强治安管控，以镇压这些 “暴民”，并向欧洲的天主教势力寻求援助。"
 papal_to_rome.1.f: "“陛下，他们又在抗议了。\n他们要求您退位。”\n“这简直是异端邪说！宪兵团在哪里？！\n他们怎么能任由这种情况继续下去？”\n“教皇陛下，宪兵团拒绝进行干预，我们无能为力啊。”\n“愿上帝保佑我们，我的孩子，愿上帝保佑我们所有人。” "
 papal_to_rome.1.a: "罗马你崛起吧！"
 papal_to_rome.1.b: "逐一发送瑞士卫队！"
 papal_to_rome.2.t: "元老院和罗马人民"
 papal_to_rome.2.d: "千年之后，罗马重光"
 papal_to_rome.2.f: "终于，这座永恒之城最终获得了解放，而教皇也被迫永远流亡。\n军事得以改革，贵族阶级得以恢复，教会也被剥夺了其世俗权力的地位。\n\n人们在街上欢庆，却不知道最艰难的时刻尚未到来。"
 papal_to_rome.2.a: "罗马共和国万岁"
 papal_to_rome.3.t: "罗马，自灰烬中重生"
 papal_to_rome.3.d: "随着教宗被废黜，罗马人民寄望于恢复后的元老院，期望能让他们伟大的共和国再度崛起。\n\n在奥勒良元老院议事厅内，众多派系竞相争权夺利，因为他们深知，这是获取权力的最关键时刻。只要有合适的人来领导，罗马就有机会重现辉煌。"
 papal_to_rome.3.f: "“执政官，军团需要强有力的领导！我们不能在元老院空谈的时候，眼睁睁看着城市陷入火海！”\n“所以你们想要另一个压迫者吗？一个像教皇国那样把我们的人民榨干的独裁者？我曾为这个共和国而战！我们为了它而拼搏，而你们却想把这一切挥霍在对所谓伟大的空想上？”\n“都给我安静！你们这些无知之徒，用着连自己都不理解含义的词汇，谈论着罗马，却对它的遗产一无所知！让那些了解罗马历史的人来做决定吧。”"
 papal_to_rome.3.a: "新时代，新罗马"
 papal_to_rome.3.b: "罗马注定要成为一个帝国！"
 by_gods_mercy.1.t: "共和派已镇压"
 by_gods_mercy.1.d: "历经数年的动荡之后，教宗终于成功确立了自己的权威。"
 by_gods_mercy.1.f: "既然教宗统治已重归稳定，且在我们的领土上无人敢质疑教宗的权威，那么现在是时候对付真正的敌人了，即阿维尼翁的那位伪教宗。"
 by_gods_mercy.1.a: "为了教宗，也为了上帝！"
 fall_papacy.1.t: "教廷的覆灭"
 fall_papacy.1.d: "在罗马陷落后，共和派的支持者们利用混乱局势废黜了教宗，并宣告罗马共和国得以重生。"
 fall_papacy.1.f: "我们虽已挣脱教宗的暴政，但庆祝还为时尚早；\n罗马已然沦陷，而我们必当...不，收复罗马正是吾辈之使命！"
 fall_papacy.1.a: "罗马必须是我们的！"
 revive_the_roman_empire: "重建罗马帝国"
 revive_the_roman_empire_desc: "罗马将巩固其作为地中海主宰的地位。"
 papal_to_rome.5.t: "唯一的教宗"
 papal_to_rome.5.d: "三十多年后，西方教会大分裂终于得到了弥合，罗马教宗被视为唯一合法的教宗。"
 papal_to_rome.5.f: "在 1809 年发生大分裂之后，天主教世界陷入了混乱之中。\n多年来，教宗职位一直担心失去其权威和领地，但如今教宗以及神职人员们都松了一口气，因为真正教宗的正统地位最终得以恢复。"
 papal_to_rome.5.a: "感谢！"
 papal_to_rome.6.t: "帝统得以恢复"
 papal_to_rome.6.d: "经过漫长的斗争，罗马再度由一位皇帝统治，而这才是它应有的常态。"
 papal_to_rome.6.f: "“终于，我们将能够收复我们失去的土地了！”\n“我们失去的土地？你喝醉了吧？你能从这一切中得到什么呢？我们曾经仅有的东西，我们的民主，已经不复存在了，而这里的人们却还在庆祝，好像他们就是获得了权力的那些人一样。”"
 papal_to_rome.6.a: "皇帝万岁！"
 papal_to_rome.7.t: "一个疯子的死亡"
 papal_to_rome.7.d: "争取民主的斗争终于结束了。"
 papal_to_rome.7.f: "许多人追随他，也有人憎恶他，但这一切都不再重了，因为他已经死了。\n留下来的是民主，而这才是至关重要的。"
 papal_to_rome.7.a: "共和国万岁"
 papal_to_rome.8.t: "高贵之人"
 papal_to_rome.8.d: "在本世纪初，没有人能够想象到会有一个人能够复兴罗马帝国，但有时候，现实比想象更加精彩。\n[SCOPE.sCharacter('armed_forces_leader').GetFullName]将作为罗马有史以来最伟大的皇帝之一而载入史册。"
 papal_to_rome.8.f: "“你说话的口音很奇怪，你是从哪里来的？”\n“先生，我来自阿勒颇。”\n“嗯，要是在十年前，我会说你是个外国人，但如今我们都是兄弟。跟我来吧，我请你喝点酒。”"
 papal_to_rome.8.a: "皇帝万岁！"
 papal_to_rome.9.t: "意大利帝国教会"
 papal_to_rome.9.d: "历史上第一次，一个帝国由教宗直接统治。"
 papal_to_rome.9.f: "天主教的狂热情绪从未如此高涨，几乎意大利的每一位天主教徒都觉得有必要周游世界去传播福音。\n这会是一个新的宗教狂热时代的开端吗？"
 papal_to_rome.9.a: "去吧，我的孩子们，去传播上帝的教诲。"
 papal_to_rome.10.t: "意大利再征服"
 papal_to_rome.10.d: "我们已经夺回了意大利富饶的土地。"
 papal_to_rome.10.f: "这对于罗马而言不过是一块垫脚石，因为我们往昔的许多领土仍处于其他势力的控制之下。\n纵观历史，许多人都曾试图复兴罗马，但从未有人成功过。\n作为罗马真正的继承者，踏上这条艰辛的道路是我们的责任。"
 papal_to_rome.10.a: "为了罗马的荣光！"
 papal_to_rome.11.t: "被迦太基击败"
 papal_to_rome.11.d: "终于，迦太基赢了"
 papal_to_rome.11.f: "在我们的历史上，这是第一次，我们向迦太基承认了失败。\n这一事件将作为罗马最重大的耻辱之一载入罗马的史册。"
 papal_to_rome.11.a: "愿罗马的子孙后代能从他们父辈的错误中吸取教训……"
 papal_to_rome.12.t: "罗马胜利了！"
 papal_to_rome.12.d: "我们再次击败了迦太基。"
 papal_to_rome.12.f: "时光流转，但有些事情却从未改变。\n我们已经确立了在第勒尼安海的统治地位，但我们绝不能自满，因为复兴罗马的道路仍然漫长且充满艰辛。"
 papal_to_rome.12.a: "罗马万岁！"
 fm_cth.1.t: "我们宿敌的归来"
 fm_cth.1.d: "罗马已从废墟中崛起。"
 fm_cth.1.f: "议会陷入了极度的混乱之中，因为每个人都担心几个世纪前发生过的事件会再次重演。\n只有一件事是确定无疑的：罗马回来了，而且他们想要夺回属于他们的岛屿。"
 fm_cth.1.a: "对他们来说，和平从来都不是一个可选项。"
 fm_cth.2.t: "[ROOT.GetCountry.GetName]胜利！"
 fm_cth.2.d: "在我们的历史上，我们第一次击败了罗马。"
 fm_cth.2.f: "这对我们的国家来说是一个具有历史意义的时刻，因为我们不仅击败了罗马，还战胜了我们的人民几个世纪以来一直存在的一种古老恐惧 —— 害怕失去我们的家园，害怕看到迦太基再次被摧毁。但如今，这只是对过去的一种恐惧罢了。\n[ROOT.GetCountry.GetName] 如今已成为一股不容小觑的力量。"
 fm_cth.2.a: "[ROOT.GetCountry.GetName]万岁！"
 fm_cth.3.t: "再次战败"
 fm_cth.3.d: "我们再次被罗马击败了"
 fm_cth.3.f: "我们人民的希望，追求伟大的梦想，这一切都已破碎，因为历史第四次重演了。\n也许 [ROOT.GetCountry.GetName] 从来就注定无法获得永恒的荣耀。"
 fm_cth.3.a: "愿坦尼特保佑我们"
 fm_cth.4.t: "一个关键形势"
 fm_cth.4.d: "我们国家的首都，迦太基，目前正面临着严重的人口过剩问题。"
 fm_cth.4.f: "由于我们最近在第五次迦太基‑马林王朝战争中战败，我们几乎失去了在北非的所有领土。正因如此，许多难民从我们以前的土地迁移到了我们的首都，如今首都已成为我们在非洲最后的堡垒。\n这座城市无法供养如此庞大数量的人口，所以，为了缓解这一问题，尽快夺回突尼斯就变得势在必行。"
 fm_cth.4.a: "我们将夺回突尼斯！"
 fm_cth.5.t: "突尼斯收复!"
 fm_cth.5.d: "大批成群的人已开始返回他们在乡下的家中。"
 fm_cth.5.f: "许多人已经开始离开迦太基返回家园，迦太基的情况已经有所改善。\n既然最紧迫的问题已经得到解决，我们终于能够专注于恢复 [ROOT.GetCountry.GetName] 原本的边界了。"
 fm_cth.5.a: "收复我们失地的时刻已经到来。"
 fm_cth.6.t: "一个新梦想？"
 fm_cth.6.d: "一个新的理念已开始在\n[GetCulture('phoenician').GetName]民族中传播开来。"
 fm_cth.6.f: "我们的人民开始要求[concept_government]将散落在全球各地的所有[GetCulture('phoenician').GetName]人重新统一起来。\n数个世纪的分裂极大地加剧了生活在 [ROOT.GetCountry.GetName] 的腓尼基人和生活在伊比利亚半岛或中东地区的腓尼基人之间的差异，但是我们又有什么理由去拒绝人民的意愿呢？"
 fm_cth.6.a: "是时候团结所有[GetCulture('phoenician').GetName]人了。"
 fm_cth.7.t: "腓尼基的诞生"
 fm_cth.7.d: "[GetCulture('phoenician').GetName]人民已团结成为一个统一的国家，\n那就是 [ROOT.GetCountry.GetName]！"
 fm_cth.7.f: "一个由#bold 腓尼基人#!组成、由#bold 腓尼基人#!创建并且为了#bold 腓尼基人的国家#!终于建立起来了。\n这是一个将永远被载入史册的日子。"
 fm_cth.7.a: "[ROOT.GetCountry.GetName]万岁！"
 lotharingia.1.t: "天主之国"
 lotharingia.1.d: "一个永远不会沦陷的王国"
 lotharingia.1.f: "东法兰克是欧洲最古老的王国之一；\n它曾是组成查理曼帝国的三个王国之一，并且是唯一一个延续至今的王国。\n东法兰克王国的长久存续，使得一些神职人员和统治阶层成员开始认为，东法兰克的人民是上帝的选民，命中注定要生活在一个永远不会覆灭的王国之中。"
 lotharingia.1.a: "愿东法兰克能再繁荣昌盛一千年！"
 lotharingia.2.t: "民族主义的兴起"
 lotharingia.2.d: "在东法兰克各地的知识界、咖啡馆以及文学沙龙中，都在进行着激烈的政治讨论。"
 lotharingia.2.f: "德意志所有地区民族主义的兴起，在东法兰克引发了混乱局面。\n许多人主张与其他德意志邦国实现统一；另一些人则支持 “东法兰克是上帝选民之国” 这一理念；还有些人呼吁进行自由主义变革，以摆脱腐败神权[concept_government]的枷锁；而另外一些人则怀揣着一个在东法兰克从未消逝的理想，那就是恢复加洛林帝国。"
 lotharingia.2.a: "我们是神的选民！"
 lotharingia.2.b: "打倒神权政治，向北德意志的国王致敬！"
 lotharingia.2.c: "也许我们命中注定要成就更为伟大的功绩……"
 lotharingia.3.t: "一个为上帝所垂青的国度"
 lotharingia.3.d: "[concept_government]最终决定支持建立一个专为东法兰克人民而设的国家这一理念。"
 lotharingia.3.f: "我们统治的长久延续让统治阶层深信，东法兰克的存在并非偶然，而是上帝意志的体现。因此，让我们的国家配得上上帝选民，便成了我们的使命。"
 lotharingia.3.a: "靠着上帝，与上帝同在，并且为了上帝"
 lotharingia.4.t: "北德意志人民的王国"
 lotharingia.4.d: "人们已经对当前[concept_government]失去了信任，而由 [SCOPE.sCharacter('landowners_leader').GetFullName]所领导的一个派别正越来越受欢迎。"
 lotharingia.4.f: "“现在是时候结束我们的苦难，成为一个在全欧洲都备受尊敬的王国了！\n是时候为 [GetCulture('north_german').GetName] 人民建立一个王国了，而它的名字将是日耳曼尼亚！”\n"
 lotharingia.4.a: "去日耳曼尼亚！"
 lotharingia.5.t: "查理曼的继承人"
 lotharingia.5.d: "我们国家历经数个世纪的屈辱，这使得东法兰克的民众大失所望，并且对当前[concept_government]满怀愤懑之情。"
 lotharingia.5.f: "神权政治设法让我们的国家存活了一千多年，但如果这意味着要不断地遭受邻国的羞辱，那么存活这么久又有什么意义呢？\n许多人憧憬着遥远而辉煌的往昔，而日益增长的不满情绪正使得 [SCOPE.sCharacter('armed_forces_leader').GetFullName] 越来越受欢迎，此人宣称自己是查理曼大帝的后裔。"
 lotharingia.5.a: "未来会是什么样？"
 lotharingia.6.t: "一个神圣王国"
 lotharingia.6.d: "一个神圣王国的根基已然奠定，那么现在是时候去构建它了。"
 lotharingia.6.f: "现在是时候收复我们昔日的领土了，那些在历经数个世纪的战争后失去的土地，并让我们的人民在那里繁衍生息。"
 lotharingia.6.a: "我们为了上帝和我们的土地而拔剑。"
 lotharingia.7.t: "东法兰克受膏王国"
 lotharingia.7.d: "在离开我们神圣的土地长达数个世纪之后，我们终于将它们收复回来了！"
 lotharingia.7.f: "既然我们的人民如今生活在上帝原本赐予我们的土地上，那么现在，作为上帝的选民，是时候去完成上帝赋予我们的神圣使命，以上帝之名让这些土地上繁衍更多的人口了。"
 lotharingia.7.a: "永恒荣光归于上帝！"
 lotharingia.8.t: "查理曼的接任者"
 lotharingia.8.d: "几个世纪以来，一支东法兰克士兵的队伍首次在法兰克福的街道上行进阅兵。 "
 lotharingia.8.f: "在经历了数个世纪的屈辱之后，东法兰克终于回到了它理应所处的地位。\n首都街道上的人们高呼着那个让这一切成为可能之人的名字，但在这荣耀时刻，[SCOPE.sCharacter('armed_forces_leader').GetFullName]却拒绝加冕为东法兰克皇帝，他发表了如下声明：\n“对于我们这个辉煌的国家而言，这不过是一项小小的功绩，因此目前我不能接受皇帝这一头衔；按照我的祖先查理曼的做法，我的加冕仪式将在罗马举行！”"
 lotharingia.8.a: "[SCOPE.sCharacter('armed_forces_leader').GetFullName]万岁！"
 lotharingia.9.t: "皇帝的加冕典礼"
 lotharingia.9.d: "今天是一个将会载入世界所有历史史册的日子。"
 lotharingia.9.f: "在向聚集在圣彼得大教堂外的人群发表了简短讲话之后，[SCOPE.sCharacter('armed_forces_leader').GetFullName]走进了大教堂，加冕仪式就此开始。\n“你会捍卫神圣的信仰吗？” “我会的。”\n“你会捍卫新教教会吗？” “我会的。”\n“你会捍卫帝国吗？” “我会的。”\n“你会维护帝国的法律吗？” “我会的。”\n“你会维护正义吗？” “我会的。”\n“主啊，祝福这位皇帝吧。愿这双手得以受膏，就如同往昔诸王和先知受膏，以及撒母耳膏立大卫作王一样。愿你蒙福，并在这个国度中被确立为统治这些子民的君王，这是主，你的上帝赐予你去统治和治理的。愿他恩准，他与圣父和圣灵同在，永生永王。\n我，作为罗马大主教和基督的代理人，封你为全法兰克人的皇帝。” "
 lotharingia.9.a: "皇帝万岁！"
 fall_theocracy.1.t: "神权制的覆灭"
 fall_theocracy.1.d: "长达数个世纪的神权政治[concept_government]已经垮台了。"
 fall_theocracy.1.f: "东法兰克的人民认为神权政治无法保障国家的未来，因此这个[concept_government]必须被推翻。\n改变是必要的，而且也已经做出了改变，但这对于这个国家的存续来说足够了吗？"
 fall_theocracy.1.a: "我们前路多艰"
 lotharingia.10.t: "日耳曼尼亚王国的诞生"
 lotharingia.10.d: "今天，一个由 [GetCulture('north_german').GetName]人民建立\n并且为了他们而存在的王国已宣告成立。"
 lotharingia.10.f: "在 [ROOT.GetCountry.GetRuler.GetFullName]于柏林举行的加冕仪式之后，这位新国王向聚集在新[concept_government]宫殿外的人群发表了讲话：\n“我忠诚的子民们，这仅仅是我们王国辉煌未来的开端；我，作为新国王，郑重承诺，我将誓死捍卫和守护这个王国！”"
 lotharingia.10.a: "所有人为国王欢呼！"
 lotharingia.11.t: "共和国宣言"
 lotharingia.11.d: "共和革命已然凯旋，共和国万岁"
 lotharingia.11.f: "经过五天的激烈战斗，共和派革命者最终成功完全占领了首都。随着神权政治的垮台，日耳曼尼亚共和国迎来了民主的新时代。"
 lotharingia.11.a: "共和国万岁！"
 lotharingia.12.t: "下一步"
 lotharingia.12.d: "既然神权政治已成为遥远的回忆，那么现在是时候为我们的国家选择未来的道路了。"
 lotharingia.12.f: "目前有两大主要派别垄断着政治舞台，一派推动建立一个统一的德国，而另一派则力主一个更为务实的理念，即建立一个由所有北德意志人组成的联邦。\n哪一派能够赢得更多的民众支持呢？"
 lotharingia.12.a: "与那些懒惰的南方人联合，对北德意志联邦来说，带来的负担会多于收益，我们要支持北德意志联邦！"
 lotharingia.12.b: "是时候让所有德意志人在同一面旗帜下实现统一了！"
 lotharingia.13.t: "法兰克福协定"
 lotharingia.13.d: "经过两天的谈判，德国[concept_government]最终与莱茵兰的贵族们达成了一项协议。"
 lotharingia.13.f: "“有那么一刻，我还以为他们不会签字呢。”\n“我也是，我也是这么想的。但看起来我们给他们的所有让步成功动摇了他们的坚持。这些让步在一段时间内会给我们带来些麻烦，但最终重要的是，现在我们都生活在同一个国家里了。\n[ROOT.GetCountry.GetName]万岁！”"
 lotharingia.13.a: "[ROOT.GetCountry.GetName]万岁！"
 lotharingia.14.t: "慕尼黑协定"
 lotharingia.14.d: "德国[concept_government]已成功与全德国的贵族们达成了一项协议。"
 lotharingia.14.f: "Many decribed this agreement as a visible miracle, and indeed it is.\nThe negotiations lasted 3 weeks, and as the time passed, the hope for a unified Germany dwindled, but the german [concept_government] was greatly determined to reach an agreement, and so they did.\nHuge concessions were given to the nobility of Bavaria, rhineland, Baden and Württemberg, concessions that will create many problems to the german govenment in the years to come, but at last Germany was made."
 lotharingia.14.a: "德意志邦联万岁！"
 fm_pom.1.t: "波美拉尼亚公国"
 fm_pom.1.d: "波美拉尼亚公国由瓦尔季斯拉夫一世于公元 1120 年建立，此后在格里芬家族的统治下已超过七个世纪。"
 fm_pom.1.f: "在过去的几个世纪里，这个公国的疆域大幅扩张又收缩，但最终它成功存续到了今天。\n巨大的变革正等待着[ROOT.GetCountry.GetName]，但这个国家将如何应对呢？"
 fm_pom.1.a: "未来会是什么样？"
 fm_pom.2.t: "北德意志人民的王国"
 fm_pom.2.d: "德意志土地上民族主义的兴起\n正给我们国家带来动荡。"
 fm_pom.2.f: "[ROOT.GetCountry.GetName]的人民在诉求变革，而 [ROOT.GetCountry.GetRuler.GetFullName]已决定回应他们的呼声。\n“现在是时候结束我们的苦难了，我们要成为一个在全欧洲都受尊敬的王国！\n是时候为 [GetCulture('north_german').GetName] 人民建立一个王国了，它的名字将是日耳曼尼亚！”"
 fm_pom.2.a: "去日耳曼尼亚！"
 fm_pom.3.t: "日耳曼尼亚王国的诞生"
 fm_pom.3.d: "今天，一个由 [GetCulture('north_german').GetName]人民建立\n并且为了他们而存在的王国已宣告成立。"
 fm_pom.3.f: "After the coronation ceremony of [ROOT.GetCountry.GetRuler.GetFullName] as King of the [GetCulture('north_german').GetName] people, the new king made a speech to the crowd massed outside the new [concept_government] palace:\n\"My loyal subjects, this is but the start of a glorious future for our Kingdom; I, as the new king, solemny promise that I will defend and protect this Kingdom till my death!"
 fm_pom.3.a: "所有人为国王欢呼！"
 fm_pom.4.t: "法兰克福协定"
 fm_pom.4.d: "经过两天的谈判，德国[concept_government]最终与莱茵兰的贵族们达成了一项协议。"
 fm_pom.4.f: "“有那么一刻，我还以为他们不会签字呢。”\n“我也是，我也是这么想的。但看起来我们给他们的所有让步成功动摇了他们的坚持。这些让步在一段时间内会给我们带来些麻烦，但最终重要的是，现在我们都生活在同一个国家里了。\n[ROOT.GetCountry.GetName]万岁！”"
 fm_pom.4.a: "[ROOT.GetCountry.GetName]万岁！"
 revive_the_carolingian_empire: "复兴加洛林帝国"
 revive_the_carolingian_empire_desc: "对一些人来说这是不可能完成的壮举，对另一些人而言则是一个梦想，从一开始，重建加洛林帝国对于任何人来说都绝非易事。\n究竟会不会出现一个有能力实现如此宏伟功绩的人呢？"
 fm_bavaria.1.t: "国王的孤独"
 fm_bavaria.1.d: "82年前，当巴伐利亚的柳特波德推翻了老国王米哈尔·阿尔伯特·弗拉季斯拉夫·冯·米特罗维奇时，巴伐利亚的冯·拜恩王朝成为了巴伐利亚的统治王朝。"
 fm_bavaria.1.f: "当柳特波德的儿子兼继承人路德维希一世掌权时，巴伐利亚贵族中已然出现了不满的迹象。他的父亲作为一位专制君主进行统治，极大地削弱了贵族的权力。\n被贵族孤立且在艰难环境中成长起来的路德维希国王，渐渐地变得越来越孤僻，将国家事务都交给了他的摄政王处理。\n自 1834 年 3 月他的妻子去世以来，国王就一直拒绝离开王宫，而且传言称他的精神和身体状况都岌岌可危。\n趁着这种局势，高级贵族们成为了这个王国事实上的统治者，并且国王被认为已命不久矣，这可能会点燃贵族起义的导火索。"
 fm_bavaria.1.a: "前路无光"
 fm_bavaria.2.t: "国王之死"
 fm_bavaria.2.d: "路德维希一世已死"
 fm_bavaria.2.f: "今天，路德维希国王的葬礼在慕尼黑举行。尽管他不被贵族们所喜爱，但死亡总归是一场悲剧，因此国王得到了一位国王应得的所有敬意。\n马克西米利安・冯・拜仁的加冕仪式将于 12 月 6 日在慕尼黑大教堂举行，在那之前，王子将由一位摄政王辅佐。\n摆在马克西米利安面前的道路十分艰辛，这位王子将需要展现出极强的韧性，去面对他沉重的未来。"
 fm_bavaria.2.a: "旧王已死，新王万岁！"
 fm_bavaria.3.t: "贵族起义"
 fm_bavaria.3.d: "符腾堡公爵和巴登公爵发动了叛乱，许多巴伐利亚贵族也纷纷站到了他们那边。"
 fm_bavaria.3.f: "“陛下，他们的目标是获得独立，他们的军队已经在向慕尼黑进军了！\n陛下，您有何旨意？”"
 fm_bavaria.3.a: "“我们将在战场上与他们交锋。”"
 fm_bavaria.4.t: "叛乱者的命运"
 fm_bavaria.4.d: "所有参与叛乱的贵族都已被逮捕。"
 fm_bavaria.4.f: "贵族们现在被拘留在王宫里，军方正等着您告知他们，这些人犯下叛国行为将会面临怎样的惩处。"
 fm_bavaria.4.a: "给予他们一场公正的审判。"
 fm_bavaria.4.b: "杀光他们！"
 fm_bavaria.5.t: "一个国王的两难处境"
 fm_bavaria.5.d: "德意志土地上民族主义的兴起正给我们国家带来动荡。"
 fm_bavaria.5.f: "“陛下，您的子民请求您成为全体德意志人的国王，我们该如何回应他们呢？”\n“你说全体德意志人的国王？听起来这与其说是一份荣耀，倒不如说是个沉重的负担。而且那些东法兰克人和莱茵兰人从来没有帮助过我们，所以我不明白为什么我要成为这些人的国王。\n如果说我的领土要扩张，那也得是基于我自己的选择。”"
 fm_bavaria.5.a: "如果我要成为德意志某部分人民的国王，那也得是南德意志人民的国王。"
 fm_bavaria.5.b: "也许 “全德意志人的国王” 这个名号听起来也没那么糟糕。"
 fm_bavaria.6.t: "南德意志联邦的诞生"
 fm_bavaria.6.d: "所有南德意志人都已汇聚在\n同一个国家之下"
 fm_bavaria.6.f: "有史以来第一次，一个由南德意志人创建、依靠南德意志人并为了南德意志人的国家诞生了。\n对于这些人民而言，一个繁荣的时代已然开启，愿这繁荣永不落幕。"
 fm_bavaria.6.a: "南德意志联邦万岁！"
 fm_bavaria.7.t: "不伦瑞克协定"
 fm_bavaria.7.d: "The bavarian [concept_government] has managed to reach an agreement with the nobility of all Germany."
 fm_bavaria.7.f: "Many decribed this agreement as a visible miracle, and indeed it is.\nThe negotiations lasted 3 weeks, and as the time passed, the hope for a unified germany dwindled, but the bavarian [concept_government] was greatly determined to reach an agreement, and so they did.\nHuge concessions were given to the nobility of East Frankia, Rhineland and Austria, concessions that will create many problems to the german govenment in the years to come, but at last Germany was made."
 fm_bavaria.7.a: "德意志邦联万岁"
 fm_bohem.1.t: "帝国的阴影"
 fm_bohem.1.d: "1712 年，在国王彼得二世・弗拉季斯拉夫・兹・米特罗维奇去世后，多瑙河王国被分割给了他的两个儿子。长子彼得三世继承了王国的大部分领土，而次子米夏埃尔则继承了巴伐利亚王国。"
 fm_bohem.1.f: "在历经 124 年的岁月以及无数场战争之后，多瑙河王国的疆域大幅缩小，如今已缩减成为了现在的波希米亚王国。\n对军事和科研领域的大量投入最终使我们的国家得以存续。如今国家局势趋于稳定，贵族们开始敦促国王收复那些失去的领土。"
 fm_bohem.1.a: "为了我国一个光荣的未来"
 fm_bohem.2.t: "巴伐利亚的问题"
 fm_bohem.2.d: "1754 年，巴伐利亚国王，米夏埃尔・阿尔贝特・弗拉季斯拉夫・兹・米特罗维奇，被柳特波德・冯・拜仁推翻了统治。"
 fm_bohem.2.f: "作为米夏埃尔・阿尔贝特的侄子，亚历山大国王对巴伐利亚王国拥有天然的继承权，而且波希米亚的贵族们正极力敦促国王维护他的这一权利主张。\n巴伐利亚王国正处于艰难时期，而他们国王的健康状况岌岌可危，一旦国王去世，这或许将成为亚历山大国王实现其继承权主张的绝佳时机。"
 fm_bohem.2.a: "未来会是什么样？"
 fm_bohem.3.t: "来自慕尼黑的新闻"
 fm_bohem.3.d: "路德维希一世已死"
 fm_bohem.3.f: "“我们必须现在就出击，我们不会再有比这更好的机会来夺回从法律上来说本就属于我们的东西了！”\n“布尔诺伯爵说得对，我们的王国在经济和军事上都已做好了开战的准备，我们绝不能错过这样一个绝佳的机会！”"
 fm_bohem.3.a: "我对这个国家有着更为宏伟的计划，\n我不会插手冯・拜仁家族的事务。"
 fm_bohem.3.b: "出动军队！"
 fm_bohem.4.t: "巴伐利亚的收复"
 fm_bohem.4.d: "巴伐利亚王国已被我们的军队占领，但我们必须考虑占领后的一系列问题。"
 fm_bohem.4.f: "战争带来的死亡与破坏，正使我们刚刚征服的地区陷入大规模的动荡之中。如果我们想要保住这些土地，在强行推行我们的文化或宗教之前，就必须深思熟虑。\n如果我们想要让巴伐利亚王国完全融入，就必须对我们的法律进行改革。"
 fm_bohem.4.a: "亚历山大国王是巴伐利亚真正且唯一的统治者，我们不会失去那些土地。"
 fm_bohem.5.t: "布拉格议会的混乱"
 fm_bohem.5.d: "大多数贵族都极为愤怒，他们将其统治者的恶劣行径视为对王国的叛国之举。"
 fm_bohem.5.f: "“议事厅内保持秩序！国王要讲话了！”\n“不要害怕，波希米亚的贵族们，因为我的所作所为是有意义的。\n我在这个国家投入了大量心血，如今我们正在收获这些付出带来的成果，而这些成果将让我们能够实现我最伟大的梦想……”"
 fm_bohem.5.a: "…… 恢复我们祖先的国度，大摩拉维亚王国！"
 fm_bohem.5.b: "…… 恢复我们祖先的国度，多瑙河王国！"
 fm_bohem.6.t: "恢复王国"
 fm_bohem.6.d: "多瑙河王国已然复兴"
 fm_bohem.6.f: "多亏了我们伟大统治者的英勇功绩，在一个多世纪之后，王国如今浴火重生。\n今日，在布拉格，[SCOPE.sCharacter('ruler_scope').GetFullName] 在五万名民众的见证下加冕成为多瑙河皇帝，来自欧洲各地的代表们正纷纷赶赴首都，亲自向皇帝的这一伟大功绩表示祝贺。"
 fm_bohem.6.a: "皇帝万岁！"
 fm_bohem.7.t: "巴伐利亚的整合"
 fm_bohem.7.d: "巴伐利亚王国已经完全整合"
 fm_bohem.7.f: "今天是值得铭记的一天，因为就在今天，波希米亚王国和巴伐利亚王国合并为一个统一的王权统治之下；\n[SCOPE.sCharacter('ruler_scope').GetFullName]如今成为了全体捷克人和南德意志人的国王，这两个民族将在他的统治下永远繁荣昌盛！"
 fm_bohem.7.a: "向[SCOPE.sCharacter('ruler_scope').GetFullName]致以最高的敬意！"
 fm_bohem.8.t: "大摩拉维亚王国"
 fm_bohem.8.d: "历经九个多世纪之后，大摩拉维亚得以重新建立。"
 fm_bohem.8.f: "捷克人、斯洛伐克人和索布人都已接受在同一个名称和同一面旗帜下联合起来，就这样，大摩拉维亚建立起来了。\n如今，它为所有摩拉维亚人开启了一个繁荣的新时代，愿大摩拉维亚永不覆灭。"
 fm_bohem.8.a: "大摩拉维亚万岁！"
 lombard.1.t: "一个失败的邦联"
 lombard.1.d: "1809 年 1 月，北意大利遭到了奥地利大公国的入侵，奥地利大公国的目标是征服南蒂罗尔、伊斯特拉、威尼托以及伦巴第地区。"
 lombard.1.f: "几个月后，北意大利的各城市组建了一个防御联盟 —— 伦巴第联盟，以便促进军事合作来抵御侵略者。\n这场战争持续了三年，最终以《威尼斯和约》告终，该和约将南蒂罗尔地区割让给了奥地利大公国。\n和约签订后，由于在使用威尼斯在地中海的港口为联盟军舰补充粮食的问题上存在一些利益冲突，威尼斯退出了伦巴第联盟。\n米兰、都灵和热那亚仍留在联盟内，1820 年，米兰趁着奥地利国力衰弱之际夺回了南蒂罗尔地区。\n个人利益的考量以及普遍存在的腐败现象极大地削弱了这个联盟，它几乎已到了分崩离析的边缘。\n必须做出改变了，否则这个联盟将难以为继。"
 lombard.1.a: "我们前路多艰"
 lombard.2.t: "去成为一个国家"
 lombard.2.d: "一股民族主义浪潮正在整个邦联内引发混乱。"
 lombard.2.f: "民众先前对当前政治局势的不满情绪，如今正与在意大利人心中新近蔓延开来的民族主义情绪交织在一起，其结果就如同一个定时炸弹，只等着爆炸。\n像[SCOPE.sCharacter('intelligentsia_leader').GetFullName]这样的政治家们宣称，这个联盟想要存续下去的唯一办法，就是摒弃任何狭隘的地方主义思想，接受一个由意大利人民建立且为意大利人民服务的国家理念。"
 lombard.2.a: "迈向意大利！"
 lombard.3.t: "意大利宣言"
 lombard.3.d: "今日，米兰共和国、皮埃蒙特共和国以及热那亚商业共和国已正式解体。"
 lombard.3.f: "在强大的民众压力下，米兰、都灵和热那亚先前统治阶层的所有成员都被迫辞去了他们的职务；议会迁至帕尔马，民众正等待着新的选举。\n今天，对全体意大利人民来说，标志着一个新时代的开始，一个民主与繁荣的时代。"
 lombard.3.a: "意大利万岁"
 lombard.4.t: "罗马陷落"
 lombard.4.d: "五个世纪之后，罗马再度沦陷。"
 lombard.4.f: "今天上午，意大利军队趁着在皮亚门附近打开的缺口进入了罗马。\n教宗被迫流亡，这座城市如今处于意大利的统治之下。\n尽管城市遭受了破坏，但罗马的民众仍在欢庆，因为这座城市如今已从罗马教廷腐朽的暴政中解放了出来。"
 lombard.4.a: "为了我国一个繁荣的未来"
 fm_venice.1.t: "地中海的女王"
 fm_venice.1.d: "The Republic of Venice, once renowned for its prosperity through maritime trade, has now evolved into a state predominantly serving the interests of corporate entities and affluent individuals."
 fm_venice.1.f: "This shift raises questions about its future:\ncould this development precipitate its decline, or might [ROOT.GetCountry.GetName] ultimately emerge as the preeminent trading power the world has ever seen?"
 fm_venice.1.a: "循此苦旅，以抵群星"
 fm_venice.2.t: "千帆尽汇威尼斯"
 fm_venice.2.d: "威尼斯已崛起成为世界有史以来最强大的贸易强国。"
 fm_venice.2.f: "看似不可能完成的成就，确实达成了；威尼斯不仅恢复到了往昔的巅峰状态，而且大大超越了过去。\n一个盛大繁荣的时代已然开启，而威尼斯正是这个时代的主角。"
 fm_venice.2.a: "愿威尼斯能再繁荣昌盛一千年！"
 fm_rhi.1.t: "一个早已覆灭帝国的残余势力"
 fm_rhi.1.d: "莱茵河协定是曾经的\n神圣罗马帝国的最后遗产"
 fm_rhi.1.f: "这项《莱茵河条约》是莱茵邦联成立的直接后果。莱茵邦联是法国国王试图在其王国东部建立一个友好缓冲国的尝试，但这个邦联并没有维持多久。\n留下来的是一些微型国家，它们迅速重组为一个名为《莱茵河条约》的防御联盟，由 [ROOT.GetCountry.GetName]领导。\n然而，世界变化迅速，[ROOT.GetCountry.GetName] 的统治阶层明白，这种局面不可能永远持续下去。"
 fm_rhi.1.a: "未来会是什么样？"
 fm_rhi.2.t: "莱茵第二邦联"
 fm_rhi.2.d: "我们的国家如今已登上了国际舞台。"
 fm_rhi.2.f: "在经历了多年的屈辱之后，如今我们不仅被视作一个国家，而且还是一个令人敬畏的国家。\n受奴役的日子早已一去不复返，我们的国家现在正迈入一个繁荣的时代。"
 fm_rhi.2.a: "[ROOT.GetCountry.GetName]万岁！"
 fm_rusf.1.t: "落后的国家"
 fm_rusf.1.d: "距离俄罗斯人民上次在同一面旗帜下团结起来，已经过去了几个世纪。"
 fm_rusf.1.f: "俄罗斯的土地被分割成了众多小公国和微不足道的领主领地。\n数十年的分裂局面以及无能的领主统治，已将俄罗斯变成了一片落后之地，仿佛只等着被他人征服。然而，喀山的人民已经厌倦了这种状况，他们迫切要求做出改变。"
 fm_rusf.1.a: "未来会是什么样？"
 fm_rusf.2.t: "俄罗斯共和国联盟的诞生"
 fm_rusf.2.d: "这是一个将永远铭刻在历史上的日子！"
 fm_rusf.2.f: "今天，喀山、彼尔姆和萨马拉这几个俄罗斯共和国统一成为了一个联邦。俄罗斯的政治家们落泪了，因为在经历了数个世纪的屈辱之后，俄罗斯人民终于能够独立自主，更重要的是，他们终于对未来有了希望。"
 fm_rusf.2.a: "俄罗斯联邦万岁！"
 fm_rusf.3.t: "共和派叛乱"
 fm_rusf.3.d: "喀山俄罗斯共和国已经成立了！"
 fm_rusf.3.f: "今天上午，喀山这座城市爆发了起义。\n城市的守备部队没能阻挡住起义者，被迫撤往王宫。经过 10 个小时的战斗，王室军队投降，王子被捕。\n人们在街上欢庆，因为一个民主的新时代即将开启。"
 fm_rusf.3.a: "共和国万岁！"
 fm_rusf.4.t: "王公的命运"
 fm_rusf.4.d: "今天，对王公的审判正在进行。"
 fm_rusf.4.f: "“绞死他！绞死他！”\n“我们干嘛还犹豫呢？他罪有应得，就该死！”\n“让王公去死！”\n“保持秩序！保持秩序！让我们的新总统[SCOPE.sCharacter('ruler_scope').GetFullName]讲话！”\n“我的俄罗斯同胞们，我们不能冲动行事；诚然，王公剥削了我们，所作所为都只为一己私利，但他仍旧和我们大家一样是俄罗斯人。\n正因为如此，我，作为喀山俄罗斯共和国新上任的总统，对王公宣判……”"
 fm_rusf.4.a: "流放他"
 fm_rusf.4.b: "杀死他"
 fm_rusf.5.t: "顿河的哥萨克人发动进攻！"
 fm_rusf.5.d: "大批哥萨克已经越过了边境。"
 fm_rusf.5.f: "After seeing the lands of the cossacks of the Volga being inveded by us, the cossacks of the Don have decided to preventively attack us to disband the Federation as soon as possible.\nOur troops stationed at the border have been forced to retreat, but if we mobilize all of our army we should be able not only to stop them, but also to invade their lands and establish a republican [concept_government] there."
 fm_rusf.5.a: "去罗斯托夫!"
 fm_rusf.6.t: "革命蔓延到了乌拉尔地区！"
 fm_rusf.6.d: "乌拉尔俄罗斯共和国诞生"
 fm_rusf.6.f: "今天，来自联邦以及俄罗斯乌拉尔共和国的代表们在车里雅宾斯克会面，商讨这个新生的共和国加入联邦的事宜；\n这不过是一个形式上的程序罢了，民众们已然在为这一重大事件而欢庆了。"
 fm_rusf.6.a: "欢迎，兄弟们！"
 fm_rusf.7.t: "革命蔓延到了托博尔斯克！"
 fm_rusf.7.d: "俄罗斯的托博尔斯克和鄂毕共和国诞生了。"
 fm_rusf.7.f: "今天，来自联邦以及俄罗斯托博尔斯克和鄂毕共和国的代表们在新尼古拉耶夫斯克（现称新西伯利亚）会面，商讨这个新生共和国加入联邦的事宜。\n这不过是个形式上的程序，人们已经在为这一伟大事件而庆祝了。"
 fm_rusf.7.a: "欢迎，兄弟们！"
 fm_rusf.8.t: "革命蔓延到了托木斯克！"
 fm_rusf.8.d: "俄罗斯的托木斯克和苏尔古特共和国诞生了。"
 fm_rusf.8.f: "今天，来自联邦和俄罗斯托木斯克与苏尔古特共和国的代表们在巴尔瑙尔会面，商讨这个新诞生的共和国加入联邦的事宜。\n这不过是一个形式上的程序，人们已经在为这一伟大事件而庆祝了。"
 fm_rusf.8.a: "欢迎，兄弟们！"
 fm_rusf.9.t: "革命蔓延到了克拉斯诺亚尔斯克！"
 fm_rusf.9.d: "克拉斯诺亚尔斯克诞生"
 fm_rusf.9.f: "今天，来自联邦和俄罗斯克拉斯诺亚尔斯克共和国的代表们在米努辛斯克会面，商讨这个新成立的共和国加入联邦的事宜。\n这只不过是一个形式上的程序，民众们已然在为这一重大事件而欢庆了。"
 fm_rusf.9.a: "欢迎，兄弟们！"
 fm_rusf.10.t: "间谍归来"
 fm_rusf.10.d: "我们的间谍已经从西欧回来了。"
 fm_rusf.10.f: "“这次任务并不轻松，但我们最终还是成功完成了。\n西欧国家有着令人惊叹的技术。最让我印象深刻的是一种步枪，它每分钟能够射击多达 16 发子弹。\n有了这项新技术，我们将势不可挡！\n俄罗斯万岁！”"
 fm_rusf.10.a: "干得好。"
 fm_rusf.11.t: "间谍已经归来了"
 fm_rusf.11.d: "我们的间谍已经从意大利北部回来了。"
 fm_rusf.11.f: "“你不会相信威尼斯有什么！\n巨大的蒸汽机能在几小时内将无数货物从维罗纳运到威尼斯，还有即使没有风也能航行的船；如果不是亲眼所见，我绝不会相信！”"
 fm_rusf.11.a: "干得好。"
 fm_rusf.12.t: "跻身列强"
 fm_rusf.12.d: "一个新的强权已经崛起"
 fm_rusf.12.f: "在经历了数个世纪的屈辱后，我们伟大的国家终于站在了她应有的位置——世界最强国之一。\n一个新的繁荣时代已经开始，俄罗斯万岁！"
 fm_rusf.12.a: "俄罗斯万岁！"
 depeffo: "萨利什仍存于此"
 je_ye_button_one: "派遣一支外交团队"
 je_ye_button_one_desc: "要派遣一小队外交官前往拉科塔送贿赂，我们首先需要与他们保持良好关系，否则我们甚至无法进入他们的领土。"
 je_ye_button_two: "派遣一支外交团队"
 je_ye_button_two_desc: "要派遣一小队外交官前往拉科塔送贿赂，我们首先需要与他们保持良好关系，否则我们甚至无法进入他们的领土。"
 yua_tooltip: "威权主义者已掌权。"
 RUI_three_decision: "派遣一支前往意大利北部的工业间谍任务"
 RUI_three_decision_desc: "为了实现国家现代化，可以采用一些替代方式；任务的预计费用为30万兹罗提，完成大约需要12个月。\n任务的成功并非完全保证。"
 RUI_two_decision: "派遣间谍前往西欧窃取军事项目"
 RUI_two_decision_desc: "我们可以派遣间谍前往西欧窃取机密项目，但这将是一项耗时且花费巨大的任务。\n该任务将持续 14 至 18 个月，预计费用为 375000 兹罗提。\n而且这项任务并不能保证成功。"
 RUI_one_decision: "在乌拉尔地区煽动共和主义运动"
 RUI_one_decision_desc: "乌拉尔的独立领主长久以来奴役着我们的俄罗斯同胞。\n我们必须发起东方解放运动，解救他们，并争取其加入我们的事业。"
 RUI_four_decision: "在托博尔斯克煽动共和主义运动"
 RUI_four_decision_desc: "托博尔斯克的独立领主长久压迫着我们的俄罗斯同胞。\n我们必须发动东方解放运动，解救他们并争取其加入我们的事业。"
 RUI_five_decision: "在托木斯克煽动共和主义运动"
 RUI_five_decision_desc: "托木斯克的独立领主长久以来奴役着我们的俄罗斯同胞。\n我们必须发起东方解放运动，解救他们，并争取其加入我们的事业。"
 RUI_six_decision: "在伊尔库茨克 煽动共和主义运动"
 RUI_six_decision_desc: "伊尔库茨克的独立领主长久以来奴役着我们的俄罗斯同胞。\n我们必须发起东方解放运动，解救他们，并争取其加入我们的事业。"
 fm_yua.2.t: "梦想的土地"
 fm_yua.2.d: "在最新报纸的头版，[ROOT.GetCountry.GetName]被描绘成一个梦想之地，那里春天永不结束，河流由黄金构成。"
 fm_yua.2.f: "“黄金之河，哈？你真是全力以赴了，对吧？当大学里的人发现我们在这儿干了什么，他们会气疯的。”\n“唉，我们能说什么呢？这是议会的命令，如果他们想找人发火，就去找议会吧。\n我们只是做好自己的工作。”"
 fm_yua.2.a: "是吗？我们真的是这样吗？"
 yua_col_disc_text: "该动议已讨论"
 yua_exp_text: "我们正向西方出口报纸"
 YUA_decision: "向朝鲜和中国出口报纸"
 YUA_decision_desc: "向西方出口报纸确实成本很高，但也会让很多人知道我们国家的存在，从而有利于移民。"
 YUA_decision_two: "停止报纸出口"
 YUA_decision_two_desc: "如果报纸出口带来的负担大于收益，我们随时可以阻止它。"
 YUA_decision_three: "废止兼并法案"
 YUA_decision_three_desc: "如果宗教骚乱过于严重，废止《兼并法案》将是一个明智的想法。"
 fm_yua.1.t: "元培避风港的未来"
 fm_yua.1.d: "[ROOT.GetCountry.GetName]是由郝宇・元培在 1712 年建立的，旨在为所有因各种原因不得不逃离中国的中国知识界人士提供一个安全的栖身之所。\n在历经一百多年后，这个小镇如今已发展成为一座繁荣的城市，但它也正面临着其整个历史中最大的危机。"
 fm_yua.1.f: "看啊，欧洲殖民者一直在推进，再不行动他们转眼就要打到我们地盘了！\"\n\"行动啥？别忘了元培的遗训，咱们绝不能伤害周边部落。就算他们无缘无故打过来，还有朝鲜可以帮咱们。\"\n\"所以你就干等着被包围？疯了吧！世道变了，咱们不能坐以待毙！\"\n\"都消停点！我也觉得要变通才能保住这座城，但元培的信念不能丢。这几天我准备提交几个议案，只要大家达成一致，咱们和这座城就都能活下去。"
 fm_yua.1.b: "\"下次议会见分晓！\""
 fm_yua.3.t: "预算原则法"
 fm_yua.3.d: "我们国家坚决反对战争，然而，鉴于欧洲殖民者在北美的殖民步伐加快，我们不得不寻求妥协，以避免被欧洲殖民者包围。"
 fm_yua.3.f: "The proposed act poses a serious ethical and legal dilemma, as it would grant the [concept_government] greater latitude to manipulate budgetary resources for covert actions that infringe upon the rights of Native American people, undermining their sovereignty and potentially leading to further injustices.\nHopefully, passing this law won't cause a war against those aforementioned tribes."
 fm_yua.3.a: "妥协必须达成"
 fm_yua.4.t: "兼并法案"
 fm_yua.4.d: "元培建立这个避风港是为了让它摆脱宗教的枷锁，但移民的到来——尽管对我们的国家来说是必要的——也带来了他们的宗教信仰。"
 fm_yua.4.f: "作为一个无神论国家，宗教是非法的，但仍有许多人秘密信教，这已不是秘密。\n新移民将带来劳动力，但也会加剧这一问题；如果我们想忠于元培的信仰，必须采取措施尽快整合新移民。"
 fm_yua.4.a: "希望这不会引起反抗"
 fm_yua.5.t: "恶名昭彰法"
 fm_yua.5.d: "“恶名昭彰法”是五十多年前我国第一次遭遇人口危机时提出的一项议案的名称。"
 fm_yua.5.f: "这项提案过去曾遭到严厉批评，因此从未被实施，但现在我们的国家急需人力，一些政治家正考虑再次讨论。\n如果这项法律通过，将对25岁以上未婚的男性以及30岁以上没有至少两个孩子的男性处以罚款。"
 fm_yua.5.a: "如果我们通过这项法律，就没有回头路"
 fm_yua.6.t: "保护条约"
 fm_yua.6.d: "当元培创建这个避风港时，朝鲜国王为他和这座城市提供保护了 130 年。"
 fm_yua.6.f: "今天是伟大的一天，因为朝鲜终于摆脱了外国势力的枷锁，决定自立，成为东亚的下一个霸主。\n通往霸权的道路漫长且充满艰辛，但第一块基石已经奠定。"
 fm_yua.6.a: "我们有能力独立吗？"
 fm_yua.7.t: "威权主义者弃权"
 fm_yua.7.d: "议会中的威权主义成员已意识到他们无法实现自己的目标。"
 fm_yua.7.f: "“尽管我仍认为我们走的不是正确道路，但在国家如此脆弱的时候，搞破坏是没有意义的。\n你们决定妥协以确保国家的生存，现在我们也该做出妥协；我们不会再试图破坏这个国家的根基了。”"
 fm_yua.7.a: "共同迈向繁荣！"
 fm_yua.8.t: "新国家"
 fm_yua.8.d: "今天宣布了土著很共和国的诞生。"
 fm_yua.8.f: "一个多世纪后，元培庇护所不复存在；它是一个无法应对本世纪逆境的国家，因此它的陨落是注定的。\n今天标志着从元培的灰烬中诞生了一个新国家，一个能够采取必要措施确保自身生存的国家。"
 fm_yua.8.a: "土著佷万岁！"
 fm_yua.9.t: "元培避风港"
 fm_yua.9.d: "梦仍在继续……"
 fm_yua.9.f: "元培避风港本无意立国，如今它自豪地屹立于世界民族之林，这一切成就皆未背离其创立者郝宇・元培的初衷。\n一个繁荣的新时代正在开启，而元培避风港正是这个时代的主角之一。"
 fm_yua.9.a: "元培会感到骄傲！"
 yua_subj_text: "朝鲜与元培避风港达成协议"
 YUA_decision_four: "派出代表团去朝鲜"
 YUA_decision_four_desc: "如果没有问题，旅程将持续四个月，费用为8000 mun。"
 YUA_decision_five: "给努米克联盟酋长的“礼物”"
 YUA_decision_five_desc: "为了从努米克联盟获取土地，我们可以实施一项战略计划，通过向当地酋长提供“礼物”来说服他们。\n尽管成本高昂且需耗时三年，这种外交手段可能带来显著的长期利益。"
 yue_inde: "选择此选项将会使元培避风港更加独立"
 fm_yua.10.t: "元培避风港的代表团"
 fm_yua.10.d: "今晨一支代表团抵达，似乎他们想讨论近130年前签署、即将到期的《保护法案》。"
 fm_yua.10.f: "“先生，您试过鸦片吗？”\n“不，我没有，我来这里也不是为了尝试它，而是为了处理更紧急的事情。”\n“别担心，先生，讨论总有时间，国王此刻正忙；跟我来，在我们等待的时候，我会向您展示那些奇妙植物中蕴藏的美。”"
 fm_yua.10.a: "如果我的祖先签署了这份协议，就没有理由改变现状；我将立即续签。"
 fm_yua.10.b: "我从未听说过你们提到的这个元培，而且我对此不感兴趣；告诉他们我不关心那份协议。"
 fm_yua.11.t: "朝鲜回复"
 fm_yua.11.d: "代表团已经归来"
 fm_yua.11.f: "“我非常高兴地宣布，朝鲜国王已决定续签协议！\n现在有了朝鲜未来百年的保护，我们无需担心来自任何国家的侵略！”"
 fm_yua.11.a: "来庆祝吧"
 fm_yua.12.t: "朝鲜回复"
 fm_yua.12.d: "代表团已经归来"
 fm_yua.12.f: "朝鲜国王认为我们太过微不足道，不值得他关注，因此他无意保护我们。\n我们现在独立了，这未必是坏事，但现在我们必须在经济和军事上自立。"
 fm_yua.12.a: "祈祷一切安好"
 fm_yua.13.t: "尤曼代表团"
 fm_yua.13.d: "今晨一支来自尤曼的代表团抵达小北京。"
 fm_yua.13.f: "随着#D 尤曼#!与#N 新西班牙#!之间15年休战协议即将到期，[GetCulture('na_yuman').GetName]酋长担忧其族人在紧张局势下的生存，提议成为[ROOT.GetCountry.GetName]的[concept_tributary]。\n这一战略举措旨在确保保护并促进友好关系，利用与[ROOT.GetCountry.GetName]的牢固联系和良好关系，确保[GetCulture('na_yuman').GetName]社区在潜在冲突面前的安全与稳定。"
 fm_yua.13.a: "我们非常乐意接受他们的提议"
 fm_yua.13.b: "It's better if we don't antagonize the [GetCulture('mexican').GetName] [concept_government]"
 yue_auth: "威权主义者未能掌权"
 yue_auth2: "威权主义者已成功掌权"
 noauth: "威权主义者未成功掌权"
 auth_for_one: "威权主义者放弃"
 auth_for_two: "威权主义者放弃"
 kor_navy: "条约已取消，皇家海军已重建"
 KOR_decision_one: "取消釜山条约"
 KOR_decision_one_desc: "如果我们取消这项条约，我们可以立即开始重建皇家海军，但荷兰不会喜欢这样做，我们可能会面临后果。"
 fm_kor.1.t: "分裂的国家"
 fm_kor.1.d: "前君主的去世使朝鲜陷入混乱，因为他的继承人太年轻，无法统治国家。"
 fm_kor.1.f: "八岁的继承人李焕也拒绝设立摄政，这一行为在统治阶级中引发了极大混乱；\n军方拒绝服从来自继承人的任何命令，他的权威正受到议会的严重质疑。\n继承人必须重新确立其权威，否则君主制可能会崩溃。"
 fm_kor.1.a: "未来一片灰暗。"
 fm_kor.2.t: "满洲代表团"
 fm_kor.2.d: "今晨一支来自满洲的代表团进入我国，带来了最后通牒。"
 fm_kor.2.f: "满洲国王要求[SCOPE.sCharacter('korea_ruler').GetFullName]与他的女儿及继承人[SCOPE.sCharacter('royal_marriage_character').GetFullName]联姻，这是他承认未来朝鲜国王为其合法宗主的唯一方式。\n若拒绝，满洲王国将被视为从朝鲜独立。"
 fm_kor.2.a: "如果这是满洲的价钱，我愿意支付。"
 fm_kor.2.b: "这一提议是对继承人和国家的侮辱，如果他们想要战争，他们会得到战争！"
 fm_kor.3.t: "船队准备就绪"
 fm_kor.3.d: "皇家海军已经重建！"
 fm_kor.3.f: "今天是伟大的一天，因为朝鲜终于摆脱了外国势力的枷锁，决定自立，成为东亚的下一个霸主。\n通往霸权的道路漫长且充满艰辛，但第一块基石已经奠定。"
 fm_kor.3.a: "朝鲜万岁！"
 fm_kor.4.t: "朝鲜代表团"
 fm_kor.4.d: "来自朝鲜的代表团通知我们，朝鲜已决定取消《釜山条约》。"
 fm_kor.4.f: "《釜山条约》是在十年前我们于第三次朝鲜战争中击败朝鲜后签署的，旨在确保我们对东亚的主导地位。\n现在他们决定取消条约，他们可能挑战我们在东亚的霸权，并威胁我们在中国的领地。\n我们必须谨慎考虑我们的回应。"
 fm_kor.4.a: "没有必要与他们对抗，我们将送代表团回去并附上一些礼物，以表明我们不再是他们的敌人。"
 fm_kor.4.b: "看来他们还没有吸取教训，动员军队！"
 fm_kor.5.t: "代表团已经归来"
 fm_kor.5.d: "荷兰已经宣战"
 fm_kor.5.f: "“我们会重演十年前的事件吗？\n如果他们这次决定把我们变成殖民地怎么办？”\n“不会发生的，时代变了，我们现在有技术取胜，更重要的是，他们无法承受在世界另一端长时间作战，所以时间也站在我们这边。\n朝鲜将证明东亚霸主角色有了一个新的竞争者。”"
 fm_kor.5.a: "循此苦旅，以抵群星"
 fm_kor.6.t: "国王的加冕"
 fm_kor.6.d: "今天 [SCOPE.sCharacter('korea_ruler').GetFullName] 被加冕为朝鲜国王"
 fm_kor.6.f: "经过一年的筹备，加冕日终于到来。\n继承人乘坐一辆装饰着黄金的马车抵达皇宫，在进入皇宫前，举行了游行以向新国王致敬。\n仪式持续了三个小时，其间[SCOPE.sCharacter('korea_ruler').GetFullName]多次承诺保护和服务于国家和朝鲜人民。仪式结束后，新国王走上阳台，向聚集在皇宫外的群众致意。\n今天标志着朝鲜国家新时代的开始。"
 fm_kor.6.a: "国王万岁！"
 fm_kor.7.t: "朝鲜的正统统治者"
 fm_kor.7.d: "李滉是朝鲜的正统统治者"
 fm_kor.7.f: "危机终于结束，军方已接受李焕为合法统治者，朝鲜准备在其新国王的领导下正式进入国际舞台。"
 fm_kor.7.a: "李滉万岁，朝鲜万岁！"
 KOR_decision_two: "开始准备加冕礼"
 KOR_decision_two_desc: "如果一切顺利，加冕礼会在一年内准备好\n预计费用为182000 mun。"
 fm_kor.8.t: "军事政变"
 fm_kor.8.d: "The Armed Forces have taken control of the [concept_government]"
 fm_kor.8.f: "Military forces have entered the Royal Palace and the parliament building this morning, taking the Heir into custody and seizing the [concept_government].\nA military junta has been proclaimed, and the Heir was moved to house arrest in a villa on the outskirts of Chungju; thanks to the fact that [SCOPE.sCharacter('korea_ruler').GetFullName] was not harmed, the majority of the population has already accepted the new [concept_government], while the old ruling class is still angered by those events."
 fm_kor.8.a: "这是否标志着韩国新时代的开始？"
 fm_kor_mil: "继承人未能恢复他的权威"
 fm_kor.9.t: "大半岛铁路"
 fm_kor.9.d: "国家铁路系统已建立"
 fm_kor.9.f: "我们的国家是亚洲第一个拥抱工业革命的国家，现在也是世界上首批拥有全国铁路系统的国家之一。\n这一新的铁路系统将使我们进一步提升工业部门，保持我们作为世界上最发达国家之一的地位。"
 fm_kor.9.a: "愿大韩能再繁荣昌盛一千年！"
 fm_chi_cl.1.t: "宣称准备好了!"
 fm_chi_cl.1.d: "今天早上，我国一位重要的政治家在宜昌被一名狂热分子杀害。\n"
 fm_chi_cl.1.f: "这一重大损失使我们有理由要求赔偿，如果我们送出一份毫无谈判余地的不可能要求清单，就能轻易为战争制造一个开战理由。"
 fm_chi_cl.1.a: "这些土地是我们的！"
 fm_chi_cl.2.t: "宣称准备好了!"
 fm_chi_cl.2.d: "我们现在可以恢复\n旧吴国的边界"
 fm_chi_cl.2.f: "获得这些领土主张相当容易，因为无需伪造，耗时的部分是让外国承认我们的主张。\n这是一个非常漫长的过程，但最终我们成功说服了世界上大多数大国认可我们的主张。"
 fm_chi_cl.2.a: "这些土地是我们的！"
 fm_chi_cl.3.t: "宣称准备好了!"
 fm_chi_cl.3.d: "我们现在可以恢复\n旧魏国的边界"
 fm_chi_cl.3.f: "获得这些领土主张相当容易，因为无需伪造，耗时的部分是让外国承认我们的主张。\n这是一个非常漫长的过程，但最终我们成功说服了世界上大多数大国认可我们的主张。"
 fm_chi_cl.3.a: "这些土地是我们的！"
 fm_chi_cl.4.t: "宣称准备好了!"
 fm_chi_cl.4.d: "今天固阳的一位外国政客公开羞辱我们的国家"
 fm_chi_cl.4.f: "这一不幸事件使我们有理由要求赔偿，如果我们送出一份毫无谈判余地的不可能要求清单，就能轻易为战争制造一个开战理由。"
 fm_chi_cl.4.a: "这些土地是我们的！"
 fm_chi_cl.5.t: "宣称准备好了!"
 fm_chi_cl.5.d: "我们的档案工作者\n“发现”了一些旧文件，\n显示我们国家的实际边界深入重庆地区数里。"
 fm_chi_cl.5.f: "显然，我们不指望这些土地会不战而让，但现在我们有了法律依据，可以发起一场可能升级为战争的争端，从而合法地宣战。"
 fm_chi_cl.5.a: "这些土地是我们的！"
 fm_chi_cl.6.t: "宣称准备好了!"
 fm_chi_cl.6.d: "北京即使不是唯一\n也是全中国最重要的城市之一"
 fm_chi_cl.6.f: "要宣称对北京的主权，我们只需对本国人民和外国列强进行宣传；毕竟，北京如此重要，其自身存在就为所有中国国家提供了天然的主权依据，因此向人们推销北京的故事非常容易。"
 fm_chi_cl.6.a: "这些土地是我们的！"
 fm_chi_cl.7.t: "宣称准备好了!"
 fm_chi_cl.7.d: "我们的档案工作者\n“发现”了一些旧文件，\n证明我们对广西、东京和广东地区拥有合法主权。"
 fm_chi_cl.7.f: "显然，我们不指望这些地区会不战而让，但现在我们有了法律依据，可以发起一场可能升级为战争的争端，从而合法地宣战。"
 fm_chi_cl.7.a: "这些土地是我们的！"
 fm_chi_cl.8.t: "宣称准备好了!"
 fm_chi_cl.8.d: "我们的档案工作者\n“发现”了一些旧文件，\n证明我们对江苏、山东、河北地区拥有合法主权。"
 fm_chi_cl.8.f: "显然，我们不指望这些地区会不战而让，但现在我们有了法律依据，可以发起一场可能升级为战争的争端，从而合法地宣战。"
 fm_chi_cl.8.a: "这些土地是我们的！"
 fm_chi_cl.9.t: "宣称准备好了!"
 fm_chi_cl.9.d: "今天早上敌军袭击了我们边境附近的一支友军车队"
 fm_chi_cl.9.f: "我们完全不知道这次袭击的原因，但这显然是战争行为。\n我们现在必须保卫我们的国家，如果我们能获得一些土地作为对这一卑鄙行为的补偿，没有人会反对。"
 fm_chi_cl.9.a: "这些土地是我们的！"
 fm_chi_cl.10.t: "宣称准备好了!"
 fm_chi_cl.10.d: "过去几个月，我们在边境\n遭受了多次外国武装团伙的袭击"
 fm_chi_cl.10.f: "显然，我们不指望这些地区会不战而让，但现在我们有了法律依据，可以发起一场可能升级为战争的争端，从而合法地宣战。"
 fm_chi_cl.10.a: "这些土地是我们的！"
 fm_chi_cl.11.t: "宣称准备好了!"
 fm_chi_cl.11.d: "过去几个月，我们在边境\n遭受了多次外国武装团伙的袭击"
 fm_chi_cl.11.f: "显然，我们不指望这些地区会不战而让，但现在我们有了法律依据，可以发起一场可能升级为战争的争端，从而合法地宣战。"
 fm_chi_cl.11.a: "这些土地是我们的！"
 fm_chi_cl.12.t: "宣称准备好了!"
 fm_chi_cl.12.d: "在我们的档案中\n我们“发现”了文件\n显示我们国家的实际边界深入江西地区数里。"
 fm_chi_cl.12.f: "显然，我们不指望这些土地会不战而让，但现在我们有了法律依据，可以发起一场可能升级为战争的争端，从而合法地宣战。"
 fm_chi_cl.12.a: "这些土地是我们的！"
 fm_east_rome.1.t: "坚不可摧的帝国？"
 fm_east_rome.1.d: "罗马帝国虽然失去了大部分领土，但仍然存活至今"
 fm_east_rome.1.f: "The Empire is divided into two social classes, an elite class concentrated in the capital, Constantinople, that still clings to its roman heritage, and the rest of the population, culturally greek for the most part, that is de facto treated as second class citizen, discriminated in many sectors and unable to reach high positions in the [concept_government].\nThe dissatisfaction of the greek people is growing every year, and if the Emperor won't act, the Empire might meet its demise."
 fm_east_rome.1.a: "罗马必须不惜一切代价生存下去"
 fm_east_rome.2.t: "帝国将亘古不灭。"
 fm_east_rome.2.d: "我们成功镇压了希腊地区的叛乱"
 fm_east_rome.2.f: "罗马帝国再次展现了其强大的韧性；如今内部问题已得到解决，我们终于可以专注于收复过去几个世纪失去的土地。\n罗马你崛起吧！"
 fm_east_rome.2.a: "罗马万岁！"
 fm_east_rome.3.t: "新时代"
 fm_east_rome.3.d: "从今天起，东罗马帝国将正式被称为#D 巴西琉斯 罗马#!"
 fm_east_rome.3.f: "许多人认为这只是形式上的，但必须正式承认希腊公民作为完全罗马公民的地位，并避免任何形式的歧视。\n罗马帝国现在是为罗马人和希腊人建立并服务的帝国。"
 fm_east_rome.3.a: "帝国万岁！"
 fm_east_rome.4.t: "不流血革命"
 fm_east_rome.4.d: "今天，希腊共和国宣告诞生"
 fm_east_rome.4.f: "今晨，帝国除首都外的每一座城市都发生叛乱。\n各城市的卫戍部队很快被压倒，大多数贵族因恐惧生命安全而倒向暴动者。\n皇帝明白已无回天之力，决定退位，让希腊民族主义者进入首都，以换取他及其家人的安全。\n不久后，希腊共和国在原为皇宫、现为议会的建筑内宣布成立。"
 fm_east_rome.4.a: "希腊共和国万岁！"
 fm_east_rome.5.t: "再征服安纳托利亚"
 fm_east_rome.5.d: "我们终于收回了我们在安纳托利亚的土地"
 fm_east_rome.5.f: "我们已收复那些土地，但不幸的是，几个世纪的鲁米占领已深刻改变了该地区的人口结构。\n有许多方法可以使该地区恢复基督教，但其中许多方法在道德上存疑。"
 fm_east_rome.5.a: "该做选择了"
 fm_england.1.t: "落后的国家"
 fm_england.1.d: "英格兰是一个落后的国家，其国王因先是强大的贵族阶级，后是强大的中产阶级，而未能成功集中权力。"
 fm_england.1.f: "这种权力的极大分散使英格兰成为第一个拥有宪法的国家，因为国王被迫由中产阶级签署宪法，但这也在过去几个世纪里造成了严重的内部不稳定，这也成为英格兰从未成功统一岛屿的原因。"
 fm_england.1.a: "未来会是什么样？"
 fm_england.2.t: "民族主义正兴起"
 fm_england.2.d: "在英格兰各地的知识界、咖啡馆以及文学沙龙中，都在进行着激烈的政治讨论。"
 fm_england.2.f: "许多[GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetNameWithCountryVariant]和[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetNameWithCountryVariant]的成员开始支持统一大不列颠的理念。\n有了他们的同意，如果我们决定对爱尔兰和威尔士宣战，将无人反对。"
 fm_england.2.a: "那就开战吧"
 fm_england.2.b: "我连擦屁股都需要[GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetNameWithCountryVariant]的批准吗？！\n是时候一劳永逸地对付那些寄生虫了！"
 fm_england.3.t: "英法君主国"
 fm_england.3.d: "英格兰和法兰西的王国\n在历史上第一次联合在了一起"
 fm_england.3.f: "这一天将载入史册，因为我们伟大的国王[ROOT.GetCountry.GetRuler.GetFullName]已成为英格兰及尊贵的法兰西土地的统治者，\n今天一个新的超级大国诞生了，其他大国将学会畏惧我们。"
 fm_england.3.a: "英格兰和法兰西的国王，[ROOT.GetCountry.GetRuler.GetFullName]万岁。"
 fm_england.4.t: "征服大不列颠"
 fm_england.4.d: "我们已经联合起了大不列颠的所有领土"
 fm_england.4.f: "政治家们正在讨论是采取较温和的方式试图整合新征服的土地，还是直接对这些土地施加我们的统治。\n议会意见分裂，因此决定权在国王手中。"
 fm_england.4.a: "整合这些土地将给我们\n带来长远的巨大利益"
 fm_england.4.b: "大不列颠是 [GetCulture('british').GetName]！\n现在，让我们完成任务，征服不列颠群岛的所有土地。"
 fm_england.4.c: "终于,大不列颠！"
 fm_england.5.t: "联合法案"
 fm_england.5.d: "今天宣布了一个新国家的诞生。"
 fm_england.5.f: "今天上午，英格兰和爱尔兰政府举行会晤，签署《联合法案》，宣告大不列颠及爱尔兰联合王国的诞生。\n愿[GetCulture('british').GetName]、[GetCulture('scottish').GetName]、[GetCulture('welsh').GetName] 和 [GetCulture('irish').GetName] 永远传承下去！"
 fm_england.5.a: "[ROOT.GetCountry.GetName]万岁"
 fm_france.1.t: "来袭西印度的一封信"
 fm_france.1.d: "路易斯安那总督致信"
 fm_france.1.f: "他声称，边境以北的一个部落愿意在五年内每周支付 5000 法郎，以换取路易斯安那州的所有权。"
 fm_france.1.a: "啊，真是个笑话；印第安人现在使用钱吗？"
 fm_france.1.b: "那些空地本来就没有什么价值，给总督发一封信，说国王接受这笔交易。"
 fm_fru.1.t: "一个停留在中世纪的国家"
 fm_fru.1.d: "法兰西王国只是名义上的王国"
 fm_fru.1.f: "国王只直接统治巴黎及其周边地区，其他所有公国都由几乎独立的公爵统治，因此国王的实际权力几乎不存在。\n法国需要进行重大变革才能成为一个真正的国家，否则王国可能很快就会崩溃。"
 fm_fru.1.a: "我们信任国王"
 fm_fru.2.t: "法兰西已经成立"
 fm_fru.2.d: "现在是时候让法国人民认识到自己是法国人了"
 fm_fru.2.f: "几个世纪的分裂使法国分裂成许多不同的文化。\n既然我们终于成为一个国家，我们必须决定这个国家将由哪些民族组成。"
 fm_fru.2.a: "这是 [GetCulture('french').GetName] 人民的 [GetCulture('french').GetName] 王国！"
 fm_fru.2.b: "这不仅仅是 [GetCulture('french').GetName] 人民的王国，这是法国#bold 所有人l#! 的王国！"
 fm_amc.1.t: "瑞典回复"
 fm_amc.1.d: "代表团今天早上返回，带来了瑞典国王的答复"
 fm_amc.1.f: "国王拒绝增加我们的自治权。\n这一行为让部分议会成员感到困惑，因为他们大多相信国王会理解局势的严重性并采取相应行动，但严厉的回应使一些人开始重新考虑[ROOT.GetCountry.GetName]的未来立场。"
 fm_amc.1.a: "国王犯了巨大的错误"
 fm_amc.2.t: "巴黎回复"
 fm_amc.2.d: "法国国王拒绝出售路易斯安那州"
 fm_amc.2.f: "法国统治者通知我们，他目前对那些土地有其他计划，因此不会出售。\n不幸的是，我们的尝试并未无人察觉，一些大国的外交官已经开始嘲笑我们的国家。"
 fm_amc.2.a: "该死的法国人，他们毁了法国！"
 fm_amc.3.t: "巴黎回复"
 fm_amc.3.d: "法国国王接受了这笔交易"
 fm_amc.3.f: "路易斯安那的土地现已归我们管辖。\n这些荒野目前没有价值，但如果我们投入足够资金，它们很快就会变得繁荣。"
 fm_amc.3.a: "迈向更光明的未来"
 fm_amc.4.t: "瑞典回复"
 fm_amc.4.d: "代表团今天早上返回，带来了瑞典国王的答复"
 fm_amc.4.f: "国王已同意增加我们的自治权。\n从今天起，[ROOT.GetCountry.GetName]成为瑞典王国的[concept_protectorate]。\n忠诚派已将这一事件称为巨大成功，因为国王对我们国家表现出极大关怀，并根据我们的需求采取了行动。"
 fm_amc.4.a: "瑞典国王陛下万岁！"
 fm_amc.5.t: "奥兰治白兰地党"
 fm_amc.5.d: "昨晚，一群独立人士闯入位于奥兰治的瑞典仓库，毁掉了 342 桶白兰地"
 fm_amc.5.f: "Some eyewitnesses saw a number of white men, disguised as Cherokee indians, entering the warehouse after breaking the lock of the main door; soon after, a great commotion started, and at that point some of them decided to call the local authorities, but it was too late.\nAlmost 350 barrels of Brännvin, a popular swedish liquor, were destroyed, for a total loss of 390000 riksdaler.\nThe [concept_government] of [ROOT.GetCountry.GetName] must decide if it wants to take the responsibility for this event, or give all the blame to the group of independentists."
 fm_amc.5.a: "This accident is the result of our negligence, we will compensate the swedish [concept_government]."
 fm_amc.5.b: "这个仓库是一家瑞典公司的财产，如果他们不能妥善监管，那不是我们的错。"
 fm_amc.6.t: "一家瑞典公司已迁走工厂"
 fm_amc.6.d: "一家瑞典食品公司决定将其生产迁至瑞典"
 fm_amc.6.f: "After the Oranje Brännvin Party, many swedish companies have begun fearing for their warehouses, and after seeing the response of the [concept_government] of New Holland to the events of the last month, one swedish food company has decided to close its factories here and restart the production in a safer place."
 fm_amc.6.a: "他们可以走，我们只会建造新工厂"
 fm_amc.7.t: "暗杀未遂"
 fm_amc.7.d: "昨晚，效忠派领导人 [SCOPE.sCharacter('landowners_leader').GetFullName] 在离开埃因霍温特威德公共剧院时胸部遭枪击。"
 fm_amc.7.f: "[GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant]的领导人立即被送往最近的医务室，目前正在接受手术。\n不幸的是，他的妻子当场死亡，而她的女儿暂时由镇长监护。"
 fm_amc.7.a: "这是一个沉重的打击，但他会挺过来。"
 fm_amc.7.b: "坏消息刚刚传来，他没能挺过来。\n愿上帝保佑他的女儿。"
 fm_amc.8.t: "首都暴动"
 fm_amc.8.d: "新阿姆斯特丹、瓦尔森和南霍恩\n爆发了一系列骚乱"
 fm_amc.8.f: "起初在新阿姆斯特丹看似和平的抗议活动，迅速升级为席卷瓦尔森和聚德霍恩镇的骚乱。\n抗议者被命令解散并离开首都的主广场，在第三次拒绝移动后，一些士兵开始强行抓捕抗议者。\n当一声枪响杀死一名抗议者时，局势升级；恐慌蔓延，迅速演变为暴力。\n整个城市现已被封锁，骚乱扩散到全国的风险相当高。"
 fm_amc.8.a: "我们不能再让抗议活动进一步蔓延，\n赶紧叫军队来！"
 fm_amc.8.b: "这是[GetCulture('swedish_colonial').GetName]人民的意愿。"
 fm_amc.9.t: "德国秘密社团"
 fm_amc.9.d: "昨天，当地政府发现了一个危险的秘密组织的存在"
 fm_amc.9.f: "德意志秘密社团有超过30名成员，其中大多数是独立派人士。\n这些成员通常在一位当地企业家宅邸的地下室会面，他们的存在在试图招募一名政府职员潜入市政厅时暴露，但不幸的是，他们的计划适得其反，大多数成员已被逮捕。"
 fm_amc.9.a: "这些秘密社团是无法控制的，我们必须尽一切努力阻止他们！"
 fm_amc.9.b: "也许它们是必要之恶……"
 fm_amc.10.t: "自由的民族，自由的国度"
 fm_amc.10.d: "我们现在是一个自由独立的国家！"
 fm_amc.10.f: "这一天将作为本世纪最重要的事件之一载入史册。\n这一天将成为国定假日，所有[GetCulture('swedish_colonial').GetName]人民将庆祝我们为之奋斗的自由，庆祝我们摆脱外国君主加于我们的枷锁的日子。"
 fm_amc.10.a: "[ROOT.GetCountry.GetName]万岁"
 fm_amc.11.t: "梦的终结"
 fm_amc.11.d: "效忠派政府成功镇压了我国的独立运动"
 fm_amc.11.f: "After years of protests, riots and political instability, the [concept_government] has finally managed to restore the order.\n[ROOT.GetCountry.GetName] has once again proved its loyalty to the Crown of Sweden, long live the King!"
 fm_amc.11.a: "国王万岁"
 fm_amc.12.t: ""
 fm_amc.12.d: ""
 fm_amc.12.f: ""
 fm_amc.12.a: ""
 fm_swu.1.t: "新荷兰代表团"
 fm_swu.1.d: "新荷兰代表团前来讨论其殖民地地位的可能变化"
 fm_swu.1.f: "The current [concept_government] of the colony, which is loyal to the Crown of Sweden, is worried because of the rise of a strong independentist movement, and it's asking for an improvement of their status from a Dominion of the Crown to a simple [concept_protectorate].\nSuch a change will remove their obligation to pay a tribute to our nation, but will also appease part of the independentist faction, lowering the chance of a future rebellion."
 fm_swu.1.a: "他们应该感激陛下，送他们回原处。"
 fm_swu.1.b: "如果我们想保住殖民地，就必须做出一些牺牲。\n新荷兰将暂时成为保护国。"
 fm_swu.2.t: "奥兰治白兰地党"
 fm_swu.2.d: "昨晚，一群新荷兰独立人士闯入位于奥兰治的瑞典仓库，毁掉了 342 桶白兰地"
 fm_swu.2.f: "Some eyewitnesses saw a number of white men, disguised as Cherokee indians, entering the warehouse after breaking the lock of the main door; soon after, a great commotion started, and at that point some of them decided to call the local authorities, but it was too late.\nAlmost 350 barrels of Brännvin, a popular swedish liquor, were destroyed, for a total loss of 390000 riksdaler.\nThe [concept_government] of New Amsterdam has decided to take the responsibility for this event, and has offered to compensate us for this loss."
 fm_swu.2.a: "My compliments to the [concept_government] of New Amsterdam"
 fm_swu.3.t: "奥兰治白兰地党"
 fm_swu.3.d: "昨晚，一群新荷兰独立人士闯入位于奥兰治的瑞典仓库，毁掉了 342 桶白兰地"
 fm_swu.3.f: "Some eyewitnesses saw a number of white men, disguised as Cherokee indians, entering the warehouse after breaking the lock of the main door; soon after, a great commotion started, and at that point some of them decided to call the local authorities, but it was too late.\nAlmost 350 barrels of Brännvin, a popular swedish liquor, were destroyed, for a total loss of 390000 riksdaler.\nThe [concept_government] of New Amsterdam claims that this is not their fault, but it's the result of the negligence of the swedish company that owns the warehouse, and thus they refuse to compensate us for this loss."
 fm_swu.3.a: "这不可接受，我们会让他们为此付出代价！"
 fm_swu.4.t: "一家瑞典公司已迁走工厂"
 fm_swu.4.d: "一家瑞典食品公司决定将其生产迁至瑞典"
 fm_swu.4.f: "After the Oranje Brännvin Party, many swedish companies have begun fearing for their warehouses, and after seeing the response of the [concept_government] of New Holland to the events of the last month, one swedish food company has decided to close its factories here and restart the production in a safer place."
 fm_swu.4.a: "欢迎他们来这儿"
 fm_swu.5.t: "新荷兰新闻"
 fm_swu.5.d: "效忠派政府成功镇压了新荷兰的独立运动"
 fm_swu.5.f: "After years of protests, riots and political instability, the [concept_government] of New Holland has finally managed to restore the order in the colony.\nNew Holland has once again proved its loyalty to the Crown of Sweden."
 fm_swu.5.a: "很高兴知道这件事"
 fm_swu.6.t: ""
 fm_swu.6.d: ""
 fm_swu.6.f: ""
 fm_swu.6.a: ""
 fm_mex.2.t: "巴黎回复"
 fm_mex.2.d: "法国国王拒绝出售路易斯安那州"
 fm_mex.2.f: "法国统治者通知我们，他目前对那些土地有其他计划，因此不会出售。\n不幸的是，我们的尝试并未无人察觉，一些大国的外交官已经开始嘲笑我们的国家。"
 fm_mex.2.a: "该死的法国人，他们毁了法国！"
 fm_mex.3.t: "巴黎回复"
 fm_mex.3.d: "法国国王接受了这笔交易"
 fm_mex.3.f: "路易斯安那的土地现已归我们管辖。\n这些荒野目前没有价值，但如果我们投入足够资金，它们很快就会变得繁荣。"
 fm_mex.3.a: "迈向更光明的未来"
