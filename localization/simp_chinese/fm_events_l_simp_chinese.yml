 fm_war.6.t: "Heroic Dispatch Inspires the Nation"
 fm_war.6.desc: "A front-line correspondent's vivid account of an outnumbered regiment holding firm has raced through newspapers, coffee-houses, and parish halls. The tale of steadfast courage reignites pride and confidence in eventual victory."
 fm_war.6.f: "\"If one company can stand against the storm, so can we all\" an old dock-worker tells the evening crowd."
 fm_war.6.a: "Let the story travel on its own"
 fm_war.6.b: "Print and distribute the dispatch nationwide"
