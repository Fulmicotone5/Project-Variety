 ve_age_of_victoria_title: "民族的诞生"
 ve_age_of_victoria_desc: "在这动荡的转型时期，各国日益认识到，工业化和现代化的速度将决定它们的生存和世界地位。\n随着新兴政治实体努力利用技术创新在世界舞台上展开竞争，传统的封建结构正面临挑战。\n这场现代化竞赛不仅助长了民族自豪感和认同感，还加剧了老牌强国和新兴国家之间的紧张关系，因为对资源、影响力和土地的争夺愈演愈烈。"
 ve_imperialism_age_title: "帝国主义时代"
 ve_imperialism_age_desc: "帝国主义时代已经到来。\n新老国家为了推动其工业经济发展，迫切需要新市场和原材料，因此大肆扩张领土和影响力。\n这一时期以争夺帝国为标志，特点是既有公开的剥削也有复杂的政治手腕，从根本上重塑了全球格局，并给殖民者和被殖民者都带来了重大的社会、经济和文化变革。"
 ve_great_wars_age_title: "大战时代"
 ve_great_wars_age_desc: "随着地缘政治对手巩固其势力范围，资源争夺战愈演愈烈，冲突风险不断升级，威胁着颠覆既定的世界秩序。\n各国感受到领土有限和扩张机会减少的压力，可能会在争夺主导地位的过程中采取咄咄逼人的姿态、结盟和加强军备建设。\n民族主义狂热和经济竞争是潜在因素，可能加剧紧张局势，导致权力平衡变得岌岌可危，易于引发冲突。\n当外交努力受挫且出现误判时，世界将处于战争的边缘，可能会重塑国界、联盟以及国际关系的根本结构。"
