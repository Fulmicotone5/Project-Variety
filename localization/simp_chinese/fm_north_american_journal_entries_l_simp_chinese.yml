l_simp_chinese:
 je_na_swn_secure_to_michigan: "确保我们对$STATE_INDIANA$的领土主张。 "
 je_na_swn_secure_to_michigan_reason: "如果我们能够有力地限制来自$STATE_MICHIGAN$南部的土地流转活动，那么我们就可以对$STATE_MICHIGAN$提出权益主张。 "
 je_na_swn_secure_the_south: "保护南方"
 je_na_swn_secure_the_south_reason: "我们需要将南部边境正式确定下来，以保障首都的安全。"
 je_na_one_secure_to_michigan: "确保我们对$STATE_MICHIGAN$的领土主张。 "
 je_na_one_secure_to_michigan_reason: "如果没有这条连接我们与密歇根州$STATE_MICHIGAN$南部的陆桥，我们对$STATE_MICHIGAN$的权益主张就会变弱。我们必须保护好这条通道。"
 je_na_one_secure_the_north: "确保$STATE_WISCONSIN$"
 je_na_one_secure_the_north_reason: "虽然我们控制了五大湖以南的大部分海岸线，但我们缺少使其繁荣所需的空间。通过获取整个$STATE_WISCONSIN$，我们能够更迅速地扩张。"
 je_na_one_secure_the_south: "保护首都"
 je_na_one_secure_the_south_reason: "我们的首都对于这个刚刚兴起的国家而言至关重要。我们必须努力保护它不受邻国的威胁，否则我们的人民就会陷入危险之中。"
 je_na_mcg_secure_georgia: "保护我们的大西洋海岸"
 je_na_mcg_secure_georgia_reason: "我们最近遭到了$VNA$和$FOU$的入侵，必须夺回我们东部的领土。"
 je_buy_luoisiana: "购买$LOI$"
 je_buy_luoisiana_reason: "$LOI$是对法国国王所占领土地的称谓，这些土地位于密西西比河沿岸，并延伸至阿塔卡潘人的土地上。\n我们并不承认这些权益主张，但目前我们太过弱小，无力与法国抗衡。\n对我们来说幸运的是，这些领土对法国王室而言眼下几乎没有什么直接价值，而且如果价格合适的话，我们或许能够将它们购买下来。"
 je_buy_louisiana: "写封信给法兰西国王"
 no_loi: "$LOI$并不存在，或者它是独立的，又或者它并不为法国所拥有。"
 je_buy_louisiana_desc: "我们可以派遣一个代表团前往巴吞鲁日，请求$LOI$ 的总督给法国国王写一封信。\n虽然无法保证国王会接受，但如果我们在法国经济不稳定的时候发出这封信，他实际上有可能会接受这笔交易。"
 luoi_text: "法国最近没有拒绝这笔交易。\n#bold 警告！#!\n如果你在路易斯安那州并非法国的属地时按下此按钮，那么对于法国而言不会触发任何事件，并且在游戏的剩余时间里你将失去再次按下此按钮的机会。"
 je_buy_cuba: "购买$CUB_ADJ$"
 je_buy_cuba_reason: "$CUB$是加勒比地区最大的岛屿，目前由$CAS$控制。该势力的力量一直在衰退，因此他们或许愿意放弃古巴，因为古巴离他们非常遥远。\n\n不过，这一做法可能并不明智，因为$CAS$是天主教会的最后堡垒，而建立更紧密的关系可能会让他们在我们的政府中获得更大的权力。"
 je_buy_cuba_button: "派遣一个代表团前往$CAS$的国王那里。 "
 je_buy_cuba_button_desc: "我们将派出我们最优秀的外交官，去说服那位国王，让他相信我们之间的友谊比$CUB$更有价值。"
 cuba_purchase_text: "我们会给出我们认为古巴$CUB$所值的价钱，并且希望他们也能有同样的看法。"
 no_cub: "$CUB$并不存在，或者它是独立的，又或者它并不归$CAS$所有。"