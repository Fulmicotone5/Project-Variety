l_simp_chinese:
 austrian_aristocracy: "奥地利贵族"
 austrian_aristocracy_desc: "奥地利贵族代表着奥地利已确立的贵族阶层，从历史上看，他们被哈布斯堡王朝的神圣罗马帝国皇帝以及奥地利大公授予贵族头衔，并在帝国宫廷内拥有巨大影响力。"
 ig_red_army: "红军"
 ig_red_army_desc: "红军是一个致力于捍卫和传播革命的机构，通过传统武装力量与无产阶级及共产主义意识形态的融合而诞生。"
 ig_fellahin: "费拉辛"
 ig_fellahin_desc: "费拉辛之名源于其耕作的犁与田地，他们是埃及的农民和小农。"
 ig_venind: "商人贵族"
 ig_venbur: "新贵族"
 ig_venlan: "旧贵族"