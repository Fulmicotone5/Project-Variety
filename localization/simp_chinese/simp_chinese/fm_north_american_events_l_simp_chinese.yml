l_simp_chinese:
 fm_na_swn.1.t: "边境安全的混乱局面"
 fm_na_swn.1.d: "我们未能妥善地防范来自邻国的威胁以保障我们边境的安全。这种屈辱绝不能坐视不理。"
 fm_na_swn.1.f: "[SCOPE.sCharacter('armed_forces_leader').GetFullName]因政府的自满态度而受到其所在政党的抨击，他已决定需要进行全面的变革来改善这种状况。他从殖民者那里汲取灵感，一直倡导建立一个无人能够公开质疑的强大政府。"
 fm_na_swn.1.a: "[SCOPE.sCharacter('armed_forces_leader').GetFullName] 变得具有独裁主义倾向 。"
 fm_na_swn.2.t: "$STATE_INDIANA$已得到保障。"
 fm_na_swn.2.d: "随着最近对$STATE_INDIANA$的掌控，我们现在能够确保通往密歇根湖的陆上通道了。"
 fm_na_swn.2.f: "这也将$STATE_MICHIGAN$与$ONE$隔离开来，使我们在征服更多土地方面占据了上风。"
 fm_na_swn.2.a: "卡-忒特"
 fm_na_swn.3.t: "南部边境已正式划定。"
 fm_na_swn.3.d: "既然我们已经与邻国正式划定了南部边界，那我们就有绝佳的机会来利用（边境地区的）资源并增加人口数量。"
 fm_na_swn.3.f: ""
 fm_na_swn.3.a: "贝宗・尼卡纳基"
 fm_na_one.1.t: "边境安全的混乱局面"
 fm_na_one.1.d: "我们未能妥善地防范来自邻国的威胁以保障我们边境的安全。这种屈辱绝不能坐视不理。"
 fm_na_one.1.f: "[SCOPE.sCharacter('armed_forces_leader').GetFullName]因政府的自满态度而受到其所在政党的抨击，他已决定需要进行全面的变革来改善这种状况。他从殖民者那里汲取灵感，一直倡导建立一个无人能够公开质疑的强大政府。"
 fm_na_one.1.a: "[SCOPE.sCharacter('armed_forces_leader').GetFullName] 变得具有独裁主义倾向 。"
 fm_cas.8.t: "一个$VEN_ADJ$提议 。"
 fm_cas.8.d: "$VNA$，一家威尼斯的半独立公司，已提出要购买$CUB$。"
 fm_cas.8.f: "$VNA$才刚刚站稳脚跟，并且希望与我们建立更紧密的联系。\n\n他们已提出以一个合理的价格从我们这里购买$CUB$。"
 fm_cas.8.a: "拒绝这个荒谬的提议！"
 fm_cas.8.b: "更紧密的联系会让我们双方都变得更强大。"
 fm_cas.8.holy: "在一段时间内，$VNA$将会拥有一个更为强大的天主教会。"
 fm_na_flu.3.t: "反对！"
 fm_na_flu.3.d: "我们已经收到了来自$CAS$的回复。"
 fm_na_flu.3.f: "$CAS$的国王拒绝了我们就$CUB$所提出的优厚提议。"
 fm_na_flu.3.a: "我们必须等待另一个机会。"
 fm_na_flu.4.t: "$CAS_ADJ$回应"
 fm_na_flu.4.d: "我们已经收到了来自$CAS$的回复。"
 fm_na_flu.4.f: "$CAS$国王接受了了我们就$CUB$所提出的优厚提议。"
 fm_na_flu.4.a: "太棒了"