 je_colonial_administration_button_india: "在[concept_india]建立殖民领"
 je_colonial_administration_button_india_desc: "印度，一幅从冰雪皑皑的山巅延伸至阳光普照的滨海平原的广阔画卷，交织着喜马拉雅山脉冰封的冠冕与塔尔沙漠闪耀的流沙。\n恒河、布拉马普特拉河与印度河——这些滋养生命的血脉在肥沃的河谷间蜿蜒穿行，沿着它们蛇形的轨迹哺育着两岸的文明与生机。\n这片极其富饶的土地将为[ROOT.GetCountry.GetName]带来巨大的财富。"
 je_colonial_administration_button_indonesia: "在[SCOPE.sStateRegion('indonesia_region_scope').GetStrategicRegion.GetName]建立殖民地"
 je_colonial_administration_button_indonesia_desc: "印度尼西亚，这片从蔚蓝深海崛起的翡翠群岛，拥有茂密的热带雨林、高耸的火山以及数千座被热带阳光眷顾的岛屿，蕴藏着无尽的资源与战略价值。\n掌控这片宝石之国，将使一个国家加冕于财富与权势之巅，更将开启通往自然美景与经济实力并存、多元而坚韧世界的大门。"
 je_colonial_administration_button_indochina: "在[SCOPE.sStateRegion('indochina_region_scope').GetStrategicRegion.GetName]建立殖民地"
 je_colonial_administration_button_indochina_desc: "印度支那，一片葱茏的画卷：翡翠般的丛林在湛蓝天幕下吐纳生机，奔涌的大河怀抱丰饶平原，催发五谷丰登。\n掌控这片沃土便意味着主宰重要贸易通道、坐拥无尽资源，更将打开通往东南亚繁荣文明的战略门户——对谋求扩张势力与财富的殖民国家而言，这颗璀璨明珠蕴藏着无与伦比的权力与繁荣。"
 je_colonial_administration_button_expand_indonesia: "扩张我们在[SCOPE.sStateRegion('indonesia_region_scope').GetStrategicRegion.GetName]的殖民地"
 je_colonial_administration_button_expand_indonesia_desc: "我们目前在[SCOPE.sStateRegion('indonesia_region_scope').GetStrategicRegion.GetName]的土地，让我们的殖民附属国来管理会更好。如果我们在该[concept_strategic_region]有不止一个殖民地[concept_subject]，它们会合并。"
 je_colonial_administration_button_expand_indochina: "扩张我们在[SCOPE.sStateRegion('indochina_region_scope').GetStrategicRegion.GetName]的殖民地"
 je_colonial_administration_button_expand_indochina_desc: "我们目前在[SCOPE.sStateRegion('indochina_region_scope').GetStrategicRegion.GetName]的土地，让我们的殖民附属国来管理会更好。如果我们在该[concept_strategic_region]有不止一个殖民地[concept_subject]，它们会合并。"
 je_colonial_administration_button_expand_india: "扩张我们在[concept_india]的殖民地"
 je_colonial_administration_button_expand_india_desc: "我们目前在印度的土地，让我们的殖民附属国来管理会更好。如果我们在该[concept_strategic_region]有不止一个殖民地[concept_subject]，它们会合并。"
 je_spanish_flu2: "第三次鼠疫大流行"
 je_spanish_flu2_reason: "第三次鼠疫大流行是一场始于1855年中国云南的重大淋巴腺鼠疫疫情。\n疫情本身并未广泛传播，仍相对有限；但在卫生条件显著落后的平行现实中，后果难以预料。\n\n#bold 更高等级的[GetInstitutionType('institution_health_system').GetName]投入将提升鼠疫防控能力"
 black_plague_bar_desc: "瘟疫防控"
 tooltip_stateof2: "必须已宣布紧急状态"
 je_stateof: "宣布紧急状态"
 je_stateof_desc: "紧急状态是一种情况，在此情况下，[concept_government]被授权实施其通常不被允许的政策，以保障其公民的安全与保护。\n#bold 该行动将#V 轻微#!改善瘟疫防控"
 je_curfew: "实行宵禁"
 je_curfew_desc: "实施宵禁可能会引起民众不满；但这是有效控制瘟疫传播的必要措施。\n#bold 该行动将#V 轻微#!改善瘟疫防控"
 je_closed: "关闭边境"
 je_closed_desc: "关闭边境可能会产生重大的经济影响；然而，它被认为是遏制疫情最有效的措施之一。\n#bold 该行动将#P 显著#!改善瘟疫防控"
 je_isola: "隔离国家"
 je_isola_desc: "虽然隔离可能严重影响我们国家的经济，但它仍然是控制疾病传播最有效的策略之一。\n#bold 该行动将#P 极大#!改善瘟疫防控"
 je_isocapi: "隔离首都"
 je_isocapi_desc: "隔离首都城市可能会给国家及周边地区带来重大影响；然而，此措施有可能至少保护国家的一部分，并有助于更迅速地控制瘟疫。\n#bold 该行动将#V 轻微#!改善瘟疫防控"
 je_isocities: "隔离城市"
 je_isocities_desc: "隔离国内所有城市可能会使经济停滞并给国家造成重大损害；然而，它是遏制瘟疫的有效策略。\n#bold 该行动将#P 显著#!改善瘟疫防控"
 je_blocports: "封锁港口"
 je_blocports_desc: "停止港口运营可能会扰乱商业活动并对国家造成实质性损害；尽管如此，它是控制疾病传播的可行措施。\n#bold 该行动将#P 适度#!改善瘟疫防控"
 je_new_hospitals: "建造新医院"
 je_new_hospitals_desc: "建造新医院需要大量的初始支出；然而，它将大大加强遏制瘟疫的努力。\n#bold 该行动将#P 适度#!改善瘟疫防控"
 je_quarantinezones: "设立隔离区"
 je_quarantinezones_desc: "建立隔离区可能会对当地经济产生不利影响；然而，这些措施对于实现更高水平的瘟疫防控至关重要。\n#bold 该行动将#V 轻微#!改善瘟疫防控"
 je_burncadavers: "焚烧感染尸体"
 je_burncadavers_desc: "焚烧感染尸体的做法有效地降低了瘟疫进一步传播的风险；然而，它很可能会遭到[GetInterestGroupVariant('ig_devout',GetPlayer).GetNameWithCountryVariant]和相当一部分民众的强烈反对。\n#bold 该行动将#V 轻微#!改善瘟疫防控"
 je_potato_blight: "马铃薯晚疫病"
 je_potato_blight_reason: "#V 马铃薯疫病是一种病原性疾病，同时侵染马铃薯和番茄的叶子与块茎，导致其腐烂。\n我们被迫等待疫情消退，因为尽管努力控制，病害依然持续。\n许多人将会死去，但我们无能为力。#!"
 revege: "苏丹国已经陷落"
 coptocompletetool: "科普特问题已得到解决"
 je_coptic_issue: "处理科普特正教徒"
 je_coptic_issue_reason: "#V 过去几个世纪里，维持苏丹国统一的唯一真实因素一直是伊斯兰教；然而不幸的是，南部地区正遭受科普特教派的祸患。为维护苏丹国内部的宗教凝聚力与稳定，必须有效应对和管理这些教派的存在。#!"
 je_m01_main: "包容之路"
 je_m01_main_reason: "#V 尽管腐败体制造成的停滞威胁着苏丹国的未来，但通过实质性改革仍存在扭转这一颓势的契机。\n优先扩大埃及民众的政治参与度并拥抱现代化，对于重振国家、恢复稳定以及确保帝国在不断演变的世界中存续至关重要。#!"
 deffope: "更多内容即将发布！"
 je_m01_theo: "重建哈里发国"
 je_m01_theo_reason: "#V 数个世纪以来，苏丹国始终作为阿拔斯王朝的守护者，承认其国家礼仪上的元首地位（该王朝的合法性源自其世系血脉）。\n若我们能成功取得麦加的监护权，便将有机会使苏丹国晋升为哈里发国，从而巩固其宗教与政治权威。#!"
 abbaca: "[ROOT.GetCountry.GetName]将成为#V 阿拔斯哈里发国#!"
 nomoreabba: "[ROOT.GetCountry.GetRuler.GetFullName]将被废黜"
 mamlukconv: "#V 完成该[concept_journal_entry]将大大提高相对被征服国家的[concept_conversion]"
 je_m01_iraq: "向东方转播伊斯兰教"
 je_m01_iraq_reason: "#V 过去数十年来，我们传教士的不懈努力已使波斯西部部分人口改宗；然而现有成效仍显不足。\n征服这些领土将使我们完成这一进程，确保这些区域实现全面皈依。#!"
 je_m01_eth: "向南方转播伊斯兰教"
 je_m01_eth_reason: "#V 长期困扰我们国家的科普特教派问题，除非从根源上解决，否则将持续存在。\n我们必须征服埃塞俄比亚，并一劳永逸地铲除科普特教会。#!"
 je_m01_abbasids: "复兴阿拔斯哈里发国"
 je_m01_abbasids_reason: "#V 阿拔斯哈里发国，尽管已经重建，但如果无所作为，必将依旧毫无实权且不被承认，除非我们采取措施助其重拾昔日荣光与崇高地位。#!"