 je_zoro_reason: "阿杜尔·古什纳普是三大圣火之一，它的价值对我们来说无可估量。\n这座火神庙已经太久没有受到我们的保护，因此帝国必须不惜一切代价将其夺回。"
 yessamu: "天皇选择保留武士阶层"
 je_jaep_main: "日本现代化"
 je_jaep_main_reason: "#V 随着日本统一的实现，现在的重点转向至关重要的现代化进程，其中必须包括废除[concept_daimyo]大名制度，以防止地区分裂。\n废除封建制度将促进国家统一，并有利于建立中央集权治理。\n为了推进这一议程，新政府需要在教育、基础设施和工业等各个领域实施改革，确保公民对现代[GetCulture('japanese').GetName]身份而非单个藩属产生归属感和忠诚感。这种全面的举措将为建立一个繁荣昌盛、凝聚力十足的国家奠定基础。#!"
 je_jaep_main_goal: "完成所有日本 [Concept('concept_journal_entry', '$concept_journal_entries$')]"
 je_jaep_economy: "日本：工业化"
 je_jaep_economy_reason: "#V 日本必须将产业现代化，以便与那些想要控制和剥削我们的国家竞争。"
 je_jaep_army: "日本：废除武士制度"
 je_jaep_army_reason: "#V 武士是我们古老的封建世袭战士阶层。\n几个世纪以来，他们为我们作战，指挥我们的军队。\n但在享受了几百年的相对和平后，他们已经忘记了战争之道，成了国家的负担。"
 je_jaep_diplomacy: "日本：结束锁国"
 je_jaep_diplomacy_reason: "#V 日本几个世纪以来一直闭关锁国，以抵御外来影响，但现在是时候向世界开放了。\n然而，我们的目标不仅是开放日本，更是要让我们的国家成为世界舞台上的一个[concept_great_power]。"
 je_jaep_daimyo: "日本：废除大名制度"
 je_jaep_daimyo_reason: "#V 日本的[concept_daimyo]大名制度是一种封建制度，地方领主（称为[concept_daimyo]）掌握着巨大的权力，控制着广阔的土地，并在其领土上拥有相当大的自治权。\n每个[concept_daimyo]都拥有自己的武士军队，征收税款并执行法律，这导致了政治格局的分裂，充满了竞争和不断变化的效忠对象。\n这种制度造成了民众之间的分裂，削弱了中央集权，并使统一的国家政府难以建立。\n废除[concept_daimyo]大名制度对于建立一个有凝聚力的民族国家至关重要，因为它将消除可能导致地方主义和冲突的封建忠诚，促进统一的民族认同，并促进发展能够有效满足所有公民需求的中央集权的现代治理结构。"
