l_simp_chinese:
 rome_je_main: "罗马之梦"
 rome_je_main_reason: "共和党人已到了圣彼得大教堂的门口！ 随着共和党人的势力不断壮大，教宗政权仍在死死抓住权力不放。等待着罗马的究竟是救赎还是被遗忘，这座城市正处于千钧一发的危急关头。"
 je_one_church: "真正的教宗"
 je_one_church_reason: "那个冒名顶替者玷污教宗的正统地位已经太久了。\n是时候除掉他了。"
 je_one_church_see_not_real: "阿维尼翁教廷不应该存在"
 je_restore_emperor: "尊皇攘夷"
 je_restore_emperor_reason: "在一位强有力统治者的引领下，罗马达到了鼎盛。因此，如果我们真想成为地中海地区的霸主，就必须由一位皇帝来统治我们的国家。"
 je_mare_nostrum: "我们的海"
 je_mare_nostrum_reason: "在这位皇帝之前，统治阶层的普遍想法是收复意大利，但对于这位皇帝而言，这样一个微不足道的功绩简直是对罗马之名的一种侮辱。是时候夺回我们的海洋（地中海）了。"
 je_church_ita: "意大利帝国教会"
 je_church_ita_reason: "近代历史告诉我们，即便教宗是天主教世界的最高宗教权威，我们也远未处于安全境地。\n是时候拓展我们的疆界了，以确保教宗的权威永不再受到质疑。"
 je_sax_main: "我们王国的未来"
 je_sax_main_reason: "在加洛林帝国覆灭之后，我们的王国已大幅衰落。\n如今，它不过是往昔传奇荣耀的一抹残影，长期安于现状的政府已然跟不上工业世界不断变化的潮流。\n历经了一千多年风雨洗礼的神权统治，能否抵挡住这股时代浪潮呢？又或者，我们这个拥有千年历史的王国，会像其他众多王国一样，在汹涌的浪潮中走向覆灭？"
 je_gods_chosen_people: "神的选民"
 je_gods_chosen_people_reason: "既然政府和神职人员已经明白了我们使命的真正意义，那么现在是时候迈出第一步了。"
 je_our_land: "东法兰克受膏王国"
 je_our_land_reason: "如果我们不先收回上帝最初赐予我们人民的土地，我们就无法成为一个神圣的王国。"
 je_a_divine_mission: "神圣使命"
 je_a_divine_mission_reason: "既然我们已经收复了我们的神圣土地，我们就必须让宗教在上帝选民的生活中继续发挥关键作用，这样我们才能确保我们的神圣使命得以践行。"
 je_a_kingdom_for_ngp: "北德意志人的王国"
 je_a_kingdom_for_ngp_reason: "为了成为日耳曼尼亚王国，我们首先必须收复其所有法理上的领土。\n首都的不满情绪正在日益增长，所以如果我们不想让共和党人先于我们掌权，我们就必须尽可能地降低德累斯顿的动荡程度。"
 je_charlemagne_legacy: "查理曼的遗产"
 je_charlemagne_legacy_reason: "恢复加洛林帝国一直是许多人的梦想，而如果我们想要实现这个梦想，就必须摆脱神权统治，并迅速拓展我们的疆界，以此向我们的人民表明，这并非是一项不可能完成的任务。\n要警惕共和派，如果我们无法成功将德累斯顿的动荡局势维持在较低水平，他们或许会引发一场叛乱。"
 je_restore_the_ce: "重建加洛林帝国"
 je_restore_the_ce_reason: "随着图林根重新登上国际舞台，而且军事力量比以往任何时候都更为强大，倘若政权始终掌握在合适的人手中，那么重建加洛林帝国就有可能成为现实。"
 je_ngf: "北德意志联邦"
 je_ngf_reason: "是时候团结所有北德意志人民了。"
 je_german_conf: "全德意志人的国家"
 je_german_conf_reason: "#V 在一个新时代的曙光中，对于所有如繁星般散落在广袤大地上的德意志灵魂而言，此刻正是他们在同一面辉煌灿烂的旗帜下齐声崛起的时候。#!"
 je_a_kingdom_for_ngp_pum: "北德意志人的王国"
 je_a_kingdom_for_ngp_pum_reason: "为了成为日耳曼尼亚王国，我们首先必须收复其所有在法律意义上应属的土地。"
 je_ngf_pum: "北德意志联邦"
 je_ngf_pum_reason: "是时候团结所有北德意志人民了。"
 je_bav_pro: "巴伐利亚的问题"
 je_bav_pro_reason: "收复巴伐利亚王国会为我们带来更多的资源和财富，但捷克人和南德意志人之间深刻的文化与宗教差异，可能会给统治的稳定带来诸多问题，这使得巴伐利亚带来的负担可能要多于收获。"
 je_lom_main: "变革之风"
 je_lom_main_reason: "伦巴第联盟实际上是由三个共和国组成的联邦，即米兰共和国、皮埃蒙特共和国以及热那亚商业共和国。\n这种权力的高度分散有利于大多数政客谋取个人利益，却损害了联邦民众的利益。\n统治阶层深知，这种局面不能再持续下去了。\n民众要求变革。"
 je_lom_ita: "一个属于意大利人民的国家"
 je_lom_ita_reason: "几个世纪的分裂极大地割裂了意大利半岛上的各种文化，然而身为意大利人的认同感却已深深扎根于意大利人民的心中。\n狭隘的地方主义和个人利益曾阻碍了任何形式的国家统一进程，但如今情况已然不同。\n现在，是时候让所有意大利人民在同一面旗帜下团结起来了。"
 je_lom_rome: "罗马城问题"
 je_lom_rome_reason: "尽管数个世纪的分裂在文化层面上使意大利人和罗马人产生了隔阂，但罗马依然是最能代表意大利半岛的城市。正因如此，意大利的政治家们极力推动对罗马的征服。"
 je_venice_main: "各行各业的中心"
 je_venice_main_reason: "#V 随着工业化在整个欧洲的扩散，以及对原材料日益增长的需求，我们曾经辉煌的商人共和国迎来了成为欧洲最重要港口的历史机遇，但为此我们必须垄断通往欧洲的大部分贸易航线。#!"
 je_venice_main_goal: "6项日志条目已经完成"
 je_venice_main_r: "贸易霸主"
 je_venice_main_r_reason: "既然我们已经获得了贸易霸主的地位，我们就必须竭尽全力捍卫这一地位，否则我们将失去为之奋斗的一切。"
 je_venice_adriatic: "亚得里亚海的女王"
 je_venice_adriatic_reason: "#V 收复我们在达尔马提亚和阿尔巴尼亚曾经拥有的土地，将有助于我们保障所有往返于[ROOT.GetCountry.GetName]的贸易路线的安全。#!"
 je_venice_resources: "原材料资源危机"
 je_venice_resources_reason: "#V 我国提升工业化水平的迫切需求，加剧了我国最大的问题之一：天然原材料资源的匮乏。\n尽管征服富饶的伦巴第地区是一项艰巨的任务，但这在目前来说能让我们获得一些喘息的空间。#!"
 je_venice_black: "黑海的守门人"
 je_venice_black_reason: "#V 控制博斯普鲁斯海峡将使我们完全垄断从黑海出发的海上贸易。#!"
 je_venice_black_r: "保护博斯普鲁斯海峡"
 je_venice_black_r_reason: "#V 如果我们失去博斯普鲁斯海峡，我们将失去权力、财富和权威，因此必须誓死捍卫它，直至最后一人。#!"
 je_venice_cape: "全球补给之港"
 je_venice_cape_reason: "#V 在找到另一条通往东方的航线前，所有往返东西方的欧洲船只都必须在开普殖民地补给；\n掌控该地，我们将获得财富、政权与影响力。#!"
 je_venice_cape_r: "保护开普敦"
 je_venice_cape_r_reason: "#V 拥有开普地区是国际声望和财富的来源，因此失去这一地区将是一大损失。#!"
 je_venice_east: "东方贸易"
 je_venice_east_reason: "#V 工业革命导致社会某些阶层迅速致富，因此对东方独有的奢侈材料和商品的需求增加。\n因此，必须在该地区获取贸易港口。#!"
 je_venice_mediterranean: "地中海门户"
 je_venice_mediterranean_reason: "#V 获得直布罗陀将使我们在地中海的海军贸易上拥有完全垄断权，如果我们还能找到另一条更快到达东方的路线并同样实现垄断，将获得巨大的财富和政治影响力。#!"
 je_venice_mediterranean_r: "保护直布罗陀和苏伊士运河"
 je_venice_mediterranean_reason_r: "#V 直布罗陀和苏伊士运河是我们最重要的资产，因此绝不能考虑失去其中任何一个。#!"
 je_venice_panama: "一个不可能的项目"
 je_venice_panama_reason: "#V 威尼斯建筑师们开始幻想一种连接太平洋和大西洋的方法，似乎理论上可以在中美洲建造一条运河，但我们首先需要派遣一个考察团，而且项目本身将耗资巨大；\n另一方面，建造这样的运河将使我们在两大洋之间的所有海军贸易路线上拥有垄断权。#!"
 je_venice_advance: "完成此日志条目将使“贸易中心”日志条目取得进展。"
 je_venice_panama_r: "保护巴拿马"
 je_venice_panama_reason_r: "#V 巴拿马运河是威尼斯的杰作，考虑到我们为此投入的巨额资金和时间，失去它的想法是不可想象的。\n运河绝不能落入其他国家之手。#!"
 je_rhineland_main: "一个由日耳曼人民组成、为日耳曼人民服务的联邦"
 je_rhineland_main_reason: "我们的邻国仍认为我们国家无力自卫，但时间已逝，情况已变。\n如果我们征服旁边的德意志领土，不仅能获得我们应得的认可，还能影响德意志贵族，建立一个更大的联邦，使我们成为一股不可忽视的力量。"
 je_boh_mor: "大摩拉维亚王国"
 je_boh_mor_reason: "大摩拉维亚王国是首次成功将大部分西斯拉夫人团结在一面旗帜下的尝试。\n不幸的是，自其覆灭以来已过去近千年，世事变迁；要说服斯洛伐克人和索布人联合成为一个民族，唯一的方法是利用我们共同的祖先血脉，并给予宗教自由。"
 je_boh_dan: "多瑙王国"
 je_boh_dan_reason: "多年的战争失败和叛乱导致了王国的覆灭，但我们的伟大统治者不会重蹈前任的覆辙；\n如果我们能保证宗教自由和民族宽容，王国的长久稳定将得到保障。"
 je_moravian_culture: "捷克、斯洛伐克和索布人将成为摩拉维亚人。"
 je_ethno_boh: "一个为[GetCulture('moravian').GetName]人民的王国"
 je_ethno_boh_reason: "为了让我们的土地重新充满我们的人民，我们必须让其他文化的人明白，他们在我们伟大的国家不受欢迎。"
 je_disf_king: "紊乱的王国"
 je_disf_king_reason: "如果我们想完全整合这些土地，必须通过文化和宗教改革，以保障南德意志人民的自由。\n此外，奥地利和施蒂里亚地区在法律上属于巴伐利亚王国的一部分，但仍未受我们统治；无需多言，这是不可容忍的。"
 je_carp: "进军喀尔巴阡山脉"
 je_carp_reason: "我国地理上南有阿尔卑斯山脉拱卫，北面和西面有多条河流作为屏障；\n我们唯一的薄弱点是东部边境，不幸的是，那里主要是广阔的平原。\n进军喀尔巴阡山脉不仅将成为国际威望的来源，更将在东部为我们提供一个绝佳的天然防御边界，从而使我国更易于防守。"
 je_ari_rev: "贵族起义"
 je_ari_rev_reason: "高等贵族正利用前巴伐利亚国王路德维希一世的去世，试图脱离王国，但幸运的是，大部分军队已表明对国王的忠诚。\n是时候让他们为叛国行为付出代价了。"
 je_bav_nat: "变革之风"
 je_bav_nat_reason: "民族主义在所有德意志土地上正在兴起；\n这些运动目前规模还很小，但可能很快会扩散并爆发。"
 je_sgf: "南德意志联邦"
 je_sgf_reason: "南德意志人分布在波希米亚、匈牙利、斯洛文尼亚和意大利北部；南德意志人从未成为一个统一民族，因此将他们全部聚集在一个国家之下是一项艰巨的任务。\n需要进行多次战争，因此我们必须首先准备好我们的国家。"
 je_ger_conf: "德意志邦联"
 je_ger_conf_reason: "#V 在一个新时代的曙光中，对于所有如繁星般散落在广袤大地上的德意志灵魂而言，此刻正是他们在同一面辉煌灿烂的旗帜下齐声崛起的时候。#!"
 je_rusf_main: "政治混乱"
 je_rusf_main_reason: "[ROOT.GetCountry.GetName]的人民渴望变革，国家已成为一触即发的火药桶。"
 rusftext: "#V $POC$不存在#!"
 je_rusf_two: "向俄罗斯前进"
 je_rusf_two_reason: "这只是俄罗斯全境伟大革命的开端；\n为了团结俄罗斯人民，我们必须首先废除依然困扰俄罗斯土地的旧封建制度，并以新的共和制度取而代之。"
 je_backward_c: "落后的国家"
 je_backward_c_reason: "需要大量投资和改革，才能使我们的国家与其他欧洲强国并驾齐驱。"
 je_mis_ind: "工业间谍任务"
 je_mis_ind_reason: "间谍已派出，他们需要大约12个月才能完成任务并返回。"
 je_mis_ind_goal: "间谍已完成任务。"
 je_mis_mil: "军事间谍任务"
 je_mis_mil_reason: "间谍已派出，任务预计耗时13个月，外加他们返回我国所需的时间。"
 je_mis_mil_goal: "间谍已找到军事项目并成功带回。"
 je_ural_rep: "支持乌拉尔的共和运动"
 je_ural_rep_reason: "如果我们直接攻击东部的领主，可能会导致他们联合起来对抗我们；但如果我们在每个地区点燃革命，这些领主将无力应对。"
 je_ural_rep_goal: "革命准备好了"
 je_tobolsk_rep: "支持托博尔斯克的共和运动"
 je_tobolsk_rep_reason: "如果我们直接攻击东部的领主，可能会导致他们联合起来对抗我们；但如果我们在每个地区点燃革命，这些领主将无力应对。"
 je_tobolsk_rep_goal: "革命准备好了"
 je_tomsk_rep: "支持托木斯克的共和运动"
 je_tomsk_rep_reason: "如果我们直接攻击东部的领主，可能会导致他们联合起来对抗我们；但如果我们在每个地区点燃革命，这些领主将无力应对。"
 je_tomsk_rep_goal: "革命准备好了"
 je_irk_rep: "支持克拉斯诺亚尔斯克 的共和运动"
 je_irk_rep_reason: "如果我们直接攻击东部的领主，可能会导致他们联合起来对抗我们；但如果我们在每个地区点燃革命，这些领主将无力应对。"
 je_irk_rep_goal: "革命准备好了"
 je_buy_salas: "尼米普、伊达赫和潘纳克瓦蒂的收购"
 je_buy_salas_reason: "如果我们想扩张国家，但不想通过战争征服土地，还有另一种方法；\n如果我们支付足够的钱，或许可以贿赂尼米普、伊达赫和潘纳克瓦蒂的印第安酋长，将他们的土地置于我们的“管辖”之下。"
 je_buy_laho: "锡克锡凯茨塔皮的收购"
 je_buy_laho_reason: "如果我们想扩张国家，但不想通过战争征服土地，还有另一种方法；\n如果我们支付足够的钱，或许可以贿赂锡克锡凯茨塔皮的印第安酋长，将他们的土地置于我们的“管辖”之下。"
 text_je_buy_sal: "萨哈普-萨利什联盟已被吞并"
 text_je_buy_bla: "黑脚已被吞并"
 text_noexssh: "努米克联盟不再存在"
 je_sshyua: "贿赂纽米克联盟酋长"
 je_sshyua_reason: "为了便于从努米克联盟获取土地，我们可以实施一项战略计划，通过向当地酋长分发“礼物”作为贿赂和说服的手段。\n虽然这项行动预计成本高昂且将持续三年，但通过外交手段确保土地的预期成果可能带来显著的长期利益。"
 je_sshyua_goal: "#bold 进度条#! 已达到 #bold  36#!"
 je_ye_button_col: "通过预算原则法"
 je_ye_button_col_desc: "我们的国家极其厌恶战争，但由于欧洲殖民者不断向我们的土地扩张边界，我们被迫妥协，以免被他们包围。"
 jeyebutcol: "通过这项法案将解锁未来的一些决策。"
 je_ye_button_migr: "撰写虚假宣传文章"
 je_ye_button_migr_desc: "我们可以在出口到西方的报纸上撰写欺骗性文章，为我们的土地塑造一个梦幻般的形象。\n这会使我们作为国家的信誉受损，但也将大大促进移民。"
 je_ye_button_int: "通过兼并法案"
 je_ye_button_int_desc: "作为一个无神论国家，宗教是非法的，但仍有许多人秘密信教，这已不是秘密。\n新移民将带来劳动力，但也会加剧这一问题；如果我们想忠于元培的信仰，必须采取措施尽快整合新移民。"
 je_ye_button_mos: "通过“恶名昭彰法”"
 je_ye_button_mos_desc: "这项提案过去曾遭到严厉批评，因此从未被实施，但现在我们的国家急需人力，一些政治家正考虑再次讨论。\n如果这项法律通过，将对25岁以上未婚的男性以及30岁以上没有至少两个孩子的男性处以罚款。"
 je_yue_laws: "变革的需要"
 je_yue_laws_reason: "元培避风港作为一个非好战的避风港而诞生，如果我们想忠于创始人的意愿，必须找到替代方式来确保国家的独立与繁荣。"
 je_yue_dict: "去保家卫国"
 je_yue_dict_reason: "元培避风港正面临其历史上最大的危机，部分议会成员不愿承认必须进行变革的态度，将导致我们城市的灭亡。\n确保元培庇护所生存的唯一方法，是让合适的人掌权。"
 je_yue_ass: "兼并法案"
 je_yue_ass_reason: "此前对宗教行为的处罚并不严厉，但随着《整合法案》的实施，国家可以搜查民宅以查找任何宗教图标，并禁止宗教人士进入某些建筑。\n这将导致一些人为了方便而成为无神论者，但也会在宗教群体中引发大规模不安。"
 je_yua_kor: "保护条约"
 je_yua_kor_reason: "如果我们想讨论续签协议以维持现状，必须派遣代表团前往朝鲜，否则如果我们只是等待，我们将获得独立；\n注意第二种选择，因为独立也意味着经济独立，我们必须确保我们的经济准备好脱离朝鲜市场，否则可能引发危机。"
 je_ymnyua: "尤曼人民的守护者"
 je_ymnyua_reason: "通过提供安全与稳定，我们可能赢得[GetCulture('na_yuman').GetName]人民的信任与忠诚。\n如果我们成功展示保护他们的能力，就能为和平吞并他们的土地铺平道路。"
 je_auth_for: "威权主义者弃权"
 je_auth_for_reason: ""
 je_cape_fm: "保护开普"
 je_cape_fm_reason: "拥有开普地区是国际声望和财富的来源，因此我们必须竭尽全力保留它。"
 je_cape_fm_two: "全球补给之港"
 je_cape_fm_two_reason: "在找到另一条通往东方的航线前，所有往返东西方的欧洲船只都必须在开普殖民地补给；\n掌控该地，我们将获得财富、政权与影响力。"
 je_suez_fm: "苏伊士运河"
 je_suez_fm_reason: "建造一条连接地中海与红海的运河看似疯狂，但得益于本世纪的技术发展，已确认确实可以建造这样的运河。\n建造它将彻底改变国际贸易，因此我们必须确保由我们来建造并拥有它。"
 je_suez_fm_two: "保护苏伊士"
 je_suez_fm_two_reason: "The Suez is by far our greatest asset, hence the idea of losing it is not to be contemplated."
 je_korea_advance: "完成此日志条目将使“质疑权威”日志条目取得进展。"
 je_kor_main: "质疑权威"
 je_kor_main_reason: "继承人的权威正受到议会的质疑，国家目前陷入军事僵局，武装部队拒绝服从来自继承人的任何命令。\n这种情况不能继续，因此继承人必须找到方法恢复其权威，确立自己作为国家合法统治者的地位。"
 je_kor_main_goal: "继承人已重新确立其权威。"
 je_kor_navy: "釜山条约"
 je_kor_navy_reason: "十年前，韩国在与荷兰的一场屈辱战争中落败，不得不签署了《釜山条约》。在该条约中，荷兰承诺保障韩国在经济和军事上独立于任何外国势力，作为交换，韩国不得对任何东亚国家施加影响力，并且不得不放弃其海军力量。\n这项条约是对我们国家的一种侮辱，而如今荷兰正面临一场危机，现在正是废除该条约并重建皇家海军的绝佳时机。"
 je_kor_autoc: "集中权力"
 je_kor_autoc_reason: "自议会成立以来，国王和贵族的权力已大幅削减。\n如果继承人决定解散议会，部分贵族会支持他。而且倘若他以民主的方式行事，便无人能够对此表示异议。\n没有了议会，继承人的权威将更难以受到挑战。"
 je_kor_manc: "满洲问题"
 je_kor_manc_reason: "满洲王国是朝鲜的藩属国，但自从前任统治者去世后，他们的政府对我们国家没有任何官方声明，这种外交沉默可能有更深的含义。\n我们的国家目前无法承受另一场危机，因此我们只能等待满洲王国澄清他们对朝鲜的立场。"
 kor_manc: "满洲国王已承认朝鲜为其宗主国。"
 je_kor_rac: "皇家警察部队"
 je_kor_rac_reason: "建立一支由他直接指挥的警察部队将赋予他巨大的权力。\n即便这不能算是一支真正的军队，这支新部队也能镇压任何叛乱，同时也是他对所有主要城镇影响力与权力的明显展示。"
 je_kor_age: "加冕礼"
 je_kor_age_reason: "虽然通常要等到继承人年满十六岁才举行加冕仪式，但我们所处的特殊情况允许我们突破法律，在继承人14岁生日后立即举行提前仪式。"
 kor_cor: "继承人已加冕（安排该加冕仪式的决定将在继承人 14 岁生日前一年做出）"
 je_kor_rail: "解决基础设施问题"
 je_kor_rail_reason: "国家的快速工业化带来了巨大财富，但也带来了许多基础设施问题。\n我们的道路已无法满足工业部门对更好、更快运输系统日益增长的需求，因此我们必须投资建设全国铁路系统。"
 je_pb_maint: "影响花费"
 je_pb_maint_reason: "施加影响力从来都不是廉价的事情，管理一个国家集团的成本尤其高昂。\n管理权力集团将对我们国家的官僚系统构成沉重负担，因此我们必须考虑是否真的要维持如此昂贵的运作。\n\n#bold  此日志条目仅为象征性，游戏每月会检查您是否建立了[concept_power_bloc]，并据此给予相应修正。#!"
 je_pb_member: "官僚过载"
 je_pb_member_reason: "作为权力集团的成员带来诸多优势，但也对我们的官僚系统造成了相当大的负担。\n我们必须仔细考虑是否真的要加入国家集团。\n\n#bold  此日志条目仅为象征性，游戏每月会检查您是否为[concept_power_bloc]的成员，并据此给予相应修正。#!"
 je_chi_wu: "扩张之路"
 je_chi_wu_reason: "时代已经变了。如果我们只是盲目地扩张疆界，我们的国际声誉将会受损，而且我们还可能面临内乱。\n为了维护王国内部的稳定以及我们的声誉，我们必须为我们的好战政策正名。\n只要有足够的时间，我们可以在边境策划一起意外事件，贿赂一名外国政客来制造一场外交争端，甚至伪造一些在外交上于对方不利的文件，以便为我们提供一个发动战争的正当理由。"
