 je_fla: "一个不可能的婚姻"
 je_fla_reason: "得益于前弗兰德斯公爵的外交能力，[ROOT.GetCountry.GetName]大公国得以存续至今，但这在未来可能不足以应对挑战。\n法兰西王国正开始权力集中化的进程，如果我们不采取行动，我们国家的安全将永远受到威胁。\n勃艮第公爵一直试图挑战法兰西国王，若给予些许帮助，我们不仅能助其独立，还能统一两地的头衔；勃艮第公爵只有一位女儿，且短期内似乎不会生出男性继承人，因此如果我们与她联姻，就能不战而继承那些土地。"
 je_bud_main: "勃艮第王国"
 je_bud_main_reason: "[ROOT.GetCountry.GetName]大公国几个世纪以来一直是法兰西王国的附庸，但现在[ROOT.GetCountry.GetName]的实力已大大超过法兰西国王，我们没有理由继续做法兰西王冠的臣属。\n如果我们独立，我们就能将头衔从大公国提升为王国。"
 je_corn_laws: "谷物法"
 je_corn_laws_reason: "我们对谷物征收的抑制性进口税是一种强有力的保护政策，维护了地主阶级的利益，如果取消将会引发一场剧变。"
 je_rum_main: "罗姆苏丹国：改革"
 je_rum_main_reason: "我们必须改革和现代化罗姆苏丹国"
 je_rum_main_goal: "完成4项改革[Concept('concept_journal_entry', '$concept_journal_entries$')]"
 je_rum_economy_reason: "我们的经济不发达，城镇化也不行。我们必须走上工业化的道路。"
 je_rum_economy: "经济改善"
 je_rum_education: "教育改革"
 je_rum_education_reason: "我国只有极少数人有基本的读写能力。我们应当建立学校教育人民，还要成立属于我们自己的高等院校。"
 je_rum_education_goal: "将你的人民的识字率提升20%。"
 je_rum_separatism: "镇压分离主义"
 je_rum_separatism_reason: "[GetCulture('kurdish').GetName] 地区的动乱非常严重。\n我们必须确保他们不会叛乱。"
 je_rum_separatism_goal: "我们已经成功镇压[GetCulture('kurdish').GetName]分离主义长达50个月"
 je_rum_army: "军队现代化"
 je_rum_army_reason: "虽然耶尼切里已经解散，但要让我们的军队现代化还有太多工作要做。"
 finished_rum_tt: "已完成或未完成改革 [concept_journal_entry]"
 je_rum_bureaucracy: "官僚改革"
 je_rum_bureaucracy_reason: "我们的官僚体系充斥着各种陈旧的法律和制度，腐败、自治的贝伊几乎无法控制苏丹国的各省。如果我们要克服统治面临的诸多挑战，就必须实现行政体系的现代化。"
 rum.2.e: "我们的帝国依靠文书运转。"
 je_rum_advance: "推进日志条目：罗姆苏丹国：改革"
 kurdrevolt: "库尔德已经起义"
 je_rum_rome: "罗马的继承人"
 je_rum_rome_reason: "[ROOT.GetCountry.GetName] 的政治和军事实力不断增强，试图利用东罗马帝国的弱点和内乱，巩固其统治地位。\n苏丹国旨在通过确立自己作为该地区领导权的合法继承人的地位，瓦解东罗马政权的残余势力，挑战罗马人的文化和宗教遗产，同时可能将分散的派系团结在其统治之下。\n随着苏丹国开始实现这一野心，它面临着冲突升级的风险，这可能会重塑政治格局，并重新定义安纳托利亚及其他地区人民的身份认同。"
 je_rum_kor: "恢复塞尔柱边疆"
 je_rum_kor_reason: "[ROOT.GetCountry.GetName] 的复兴，成为一支强大的力量，收复了塞尔柱帝国失去的领土，标志着该地区历史上的一个重要转折点。\n随着苏丹国动员其军事力量，它面临着与敌对派系、当地部落以及争夺这些土地控制权的外部势力发动无数战争的艰巨挑战。\n这些冲突的结果不仅将决定苏丹国的领土野心，还将塑造该地区的政治和文化格局，并可能带来贸易的复苏、文化交流，以及中东地区权力格局的重新定义。"
 je_sae_main: "政治动荡"
 je_sae_main_reason: "[ROOT.GetCountry.GetRuler.GetFullName]皈依伊斯兰教引发了[GetReligion('zoroastrian').GetName]支持者的担忧，他们担心自身文化和宗教在帝国的影响力正在减弱。\n这导致对皇帝兄弟的支持率上升，他可能成为新[GetReligion('sunni').GetName]领导层的制衡力量。\n随着各派系因响应皇帝的政策（尤其是在宗教宽容方面）而形成并壮大，除非采取谨慎的外交和文化策略来整合多元信仰，否则存在着切实的内乱风险，这可能会破坏帝国的稳定。"
