 je_council_lit: "三王会议"
 je_council_lit_reason: "三王会议是在波兰立陶宛联邦解体后成立的一个三国联盟，旨在确保立陶宛、白俄罗斯和哥萨克酋长国免受任何外部威胁。然而，在波兰王国分裂以及芬兰王国近期被瑞典击败之后，三位亲王决定终止这个联盟。\n三王会议的最后一次会议将在几个月后举行，此后这个联盟将被彻底解散。 "
