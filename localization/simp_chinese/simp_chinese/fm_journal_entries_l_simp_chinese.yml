 je_east_rome: "“罗马”帝国?"
 je_east_rome_reason: "几个世纪以来，文化差异逐渐改变了许多罗马公民的风俗习惯和传统。尽管他们保留了帝国的语言，但他们的文化身份已经发展到与祖先的文化身份有显著差异的程度。因此，在这些公民中，相对于统治精英而言，出现了一种被边缘化的感觉以及认为自己处于 “二等公民” 地位的认知。\n如果我们想要确保帝国的存续，就需要进行改革。"
 je_east_rome_ott: "最后一舞"
 je_east_rome_ott_reason: "在过去的几个世纪里，我们的帝国与罗姆苏丹国一直处于交战状态，双方都曾一度濒临崩溃。但如今我们的帝国已经解决了内部问题，是时候利用对手实力削弱的机会，收复我们失去的领土了。"
 je_anatolia_int: "整合安纳托利亚"
 je_anatolia_int_reason: "内阁已经提交了一些方案，这些方案能让我们迅速整合新获得的土地，但批准这些方案将意味着对土耳其人民实施一场种族灭绝。\n在内阁没有得到你的批准之前，无法推进任何决定，所以，和往常一样，最终的选择权在你手中。 "
