 je_danelaw: "重建丹法区"
 je_danelaw_reason: "通过选择拥抱其祖先血脉并恢复丹法区，国王大胆踏入一个充满历史意义和文化遗产的领域，标志着其统治的重大转变。\n这一决定不仅使他与其祖先保持一致，还可能缓解他的内心困扰，在噩梦的混乱中为他提供明确的目标。\n他知道自己无法回头，任何失败都将导致他因被视为疯病而被废黜。"
 je_north_empire: "恢复北海至高王国"
 je_north_empire_reason: "#V 随着丹法区的恢复稳固，国王现已站在实现其宏伟目标的边缘，即恢复北海至高王国，将丹麦、挪威及其周边领土统一在一个共同旗帜之下。#!"
