 je_amc_inde_reason: "终于，在看到我们人民的意愿后，九个殖民地的代表决定会面签署《独立宣言》。\n一些代表仍有疑虑，但现在回头为时已晚。"
 je_amc_dec_nd: "签署独立宣言"
 je_amc_dec_nd_desc: ""
 je_amc_main: "自由国家"
 je_amc_main_reason: "在过去一个世纪里，[ROOT.GetCountry.GetName]这个小殖民地已发展成为一个繁荣的国家，但不幸的是，尽管我们的经济和人口随时间发展而变化，我们作为附属国的地位从未改变。\n先是荷兰国王，后是瑞典国王，这些君主始终将我们的国家视为遥远的殖民地，但情况正在改变。\n一个新的独立派正在崛起并获得支持，如果他们能成功掌权并推翻忠诚派政府，我们将能够为独立而战。\n#bold 进度条#!的状态将根据特定条件#tooltippable;tooltip:[Country.GetTooltipTag],je_amc_main_advance 推进#!。"
 je_amc_main_goal: "独立派掌权了"
 je_amc_swu: "派出代表团去瑞典"
 je_amc_swu_desc: "每周我们都被迫向瑞典王国支付一大笔钱，却得不到任何回报； \n为了安抚独立派并稳定我们的国家，我们可以派一个代表团要求瑞典国王增加我们作为王室臣民的独立性。"
 text_amc: "我还尚未排除代表团"
 je_amc_main_advance: "•拥有40个营或更多的军队规模 \n•选举我们自己的官僚 \n•在当地生产大炮 \n•转向保护主义贸易政策 \n•关闭我们的边境 \n•建立国家警察部队 \n•我们10%以上的人口是激进分子"
 amcinde_one: "这个事件会授权给独立派"
 amcinde_two: "这个事件会授权给效忠派"
 text_amc_two: "我们尚未签署那份宣言。"
 je_ita_pro: "再征服意大利"
 je_ita_pro_reason: "对意大利半岛的征服是罗马历史上的一个关键转折点，因为它标志着罗马共和国从一个单纯的地区性势力转变为地中海霸权的争夺者。\n时代已经不同了，我们远不再是那种霸权势力，但收复那些土地现在应该而且必须成为我们的当务之急。"
 je_punic_ro: "第四次布匿战争"
 je_punic_ro_reason: "我们的死敌迦太基傲然挺立，而它正占据着那些曾让我们往昔繁荣昌盛的土地。\n随着工业革命的到来，西西里岛、撒丁岛和科西嘉岛的价值已大幅降低，但这并不意味着我们就不该将它们收复。\n那些土地是我们的，我们必须为夺回它们而战。"
 je_punic_ro_pho: "第四次布匿战争"
 je_punic_ro_pho_reason: "我们的宿敌迦太基傲然屹立，占据着过去曾让我们繁荣昌盛的土地。随着工业革命的到来，西西里岛、撒丁岛和科西嘉岛的价值大幅下降，但这并不意味着我们不能夺回它们。\n这些土地是我们的，我们必须为之而战。"
 je_punic_cth: "第四次布匿战争"
 je_punic_cth_reason: "第三次布匿战争几乎毁灭了我们的国家。\n迦太基重建，罗马覆灭后，我们自力更生，至今仍屹立不倒。\n我们不能再输给罗马，否则迦太基可能会彻底覆灭。"
