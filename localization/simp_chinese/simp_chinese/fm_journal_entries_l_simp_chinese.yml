 je_north_empire_vin: "恢复北海至高王国"
 je_north_empire_vin_reason: "#V 北海至高王国，以其历史辉煌和战略重要性而闻名，如今已在我们触手可及的范围内，为重振北欧团结与力量提供了前所未有的机会。#!"
 je_fou_main: "变革之风"
 je_fou_main_reason: "#V [ROOT.GetCountry.GetName]在十多年前从英格兰独立后，凭借肥沃的东部土地和繁荣的贸易网络，享受了显著的繁荣。\n尽管自解放以来一直保持低调，但民族主义的兴起正在萌芽，可能在民众中培养出共同的身份认同。#!"
 fou_usa: "新联盟？"
 fou_usa_reason: "#V 泛民族主义运动的胜利标志着东海岸殖民地政治格局的重大转变，巩固了他们对统一国家身份的承诺，庆祝其独特遗产。\n在适当的条件下，一个新的联邦将诞生，这个联邦将主导新世界。#!"
 je_nousa: "新荷兰（美利坚联邦）不存在"
 fou_eng: "收复英格兰"
 fou_eng_reason: "#V 随着英格兰运动的胜利，议会已将重点转向加强与英格兰的历史联系，优先考虑对其祖先领土主张的法律认可。\n现在讨论已结束，是时候夺回我们的土地了。#!"
 je_maxico: "一个为[GetCulture('mexican').GetName]人民的王国"
 je_maxico_reason: "#V 在从卡斯蒂利亚获得独立后，[GetCulture('mexican').GetName]人民充满热情，希望建立一个体现其文化身份和愿望的新国家。\n这一恢复期为形成统一的民族愿景提供了机会，汲取了丰富的土著传统和殖民历史的多样影响。#!"
 je_atz_advance: "完成此日志条目将使“恢复塔万廷苏尤”日志条目取得进展。"
 je_atz_main: "重建[concept_tawantinsuyu]"
 je_atz_main_reason: "[concept_tawantinsuyu]历经岁月沧桑，但现在正面临严重危机；在失去了钦查伊和库利亚[concept_suyu]的部分地区后，[concept_sapainca]的影响力显著下降，随着欧洲殖民地向南北扩张，帝国面临只有奇迹才能确保其未来的严峻前景。"
 je_atz_main_goal: "所有6个“恢复塔万廷苏尤”日志条目已完成。"
 je_atz_auto: "集中权力"
 je_atz_auto_reason: "为了恢复[concept_tawantinsuyu]，帝国的所有土地必须由[concept_sapainca]直接控制，国家的所有权力也必须归于他。"
 je_chinchasuyu: "重建钦察[concept_suyu]"
 je_chinchasuyu_reason: "钦查[concept_suyu]曾是帝国人口最多的[concept_suyu]。\n在过去几个世纪里，我们将其中很大一部分割让给了卡斯蒂利亚；然而，随着这些领土不再受卡斯蒂利亚保护，现在是收回它们的机会。"
 je_qullasuyu: "重建库尧[concept_suyu]"
 je_qullasuyu_reason: "钦查[concept_suyu]构成了帝国曾经的东南部省级区域。\n在一场旷日持久的冲突后，我们失去了对#D 威尼斯#!的大量领土，以及该地区黄金资源的随之丧失。\n新成立的#P URA#!看似实力强大，但我们仍有义务努力收复我们昔日的领土。"
 je_atz_army: "陆军改革"
 je_atz_army_reason: "历史表明，我们的军队已显著过时，无法有效保卫帝国的边境。\n必须进行重大改革以确保帝国的安全。"
 je_atz_tribes: "征服西部部落"
 je_atz_tribes_reason: "要收回我们昔日的领土，首先必须解决西部的部落。\n一旦我们成功征服他们，就能将全部精力集中在外国侵略者身上。"
 je_atz_gold: "夺取南部金矿"
 je_atz_gold_reason: "在当今世界，黄金至关重要；因此，为了实现我们的目标，必须通过获取帝国南部的金矿来提升我们的黄金产量。"
 je_aga_main: "脆弱的稳定"
 je_aga_main_reason: "#P $AGA$#!是由阿根廷、巴西和乌拉圭共和国组成的联盟，它们为争取独立而结盟；虽然它们已成功获得自由，但这些国家现在面临因文化差异人口复杂共存而带来的重大挑战，这对这一新生联盟的稳定构成威胁。\n必须进行紧急改革以应对这些复杂问题；否则，崩溃的可能性将日益不可避免。\n\n#V 稳定性将根据国内的#tooltippable;tooltip:[Country.GetTooltipTag],je_aga_main_advance 动荡#!程度而下降。#!"
 je_aga_main_advance: "一旦任何[concept_incorporated_state]的动荡超过30%的阈值，国家稳定性将开始下降。稳定性损失的程度将取决于超过此动荡阈值的合并州的总数。"
 aga_progress_bar: "稳定度"
 aga_progress_bar_desc: "国家的稳定度"
 je_aga_reforms: "国家改革"
 textaga: "危机已经得到避免。"
 aga_tool1: "国家的稳定性已降至危急水平。"
 je_aga_reforms_reason: "[ROOT.GetCountry.GetName]面临的最紧迫问题有两个：持续存在的[concept_slavery]问题以及根深蒂固、拒绝放弃特权的寡头阶级。\n必须立即解决这两个关键问题，否则可能导致民众不满情绪升级，对国家稳定造成重大且不利的后果。"
 je_aga_centr: "国内骚乱"
 je_aga_centr_reason: "旧的无用政府已被推翻，但这并未解决困扰国家的根本问题。\n内乱依然猖獗，我们的新政权面临通过果断行动缓解异议和不稳定的紧急任务，明白若不能有效解决这些问题，可能削弱我们的权威并导致国家崩溃。"
 je_scu_main: "到达艾雷河"
 je_scu_main_reason: "#V 征服约克和赫尔将显著增强我们对[GetCulture('british').GetName]军队的防御能力，因为艾尔河和乌斯河将为来自西方的任何潜在敌军进攻提供重要的天然屏障，从而整体上巩固我们的战略地位。#!"
