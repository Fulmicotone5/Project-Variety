 je_sop: "新的霸王"
 je_sop_reason: "将所有[GetReligion('sunni').GetName]人民团结在我们的旗帜下，将加强资源共享、经济合作和文化交流，为伊斯兰世界的新繁荣时代铺平道路。\n这种团结将培养强烈的认同感和使命感，促进教育、技术和贸易领域的共同进步。"
 je_sop_levant: "夺取黎凡特"
 je_sop_levant_reason: "征服黎凡特将在战略上促进我国进一步向其他[GetReligion('sunni').GetName]领土扩张，因为它是贸易和文化交流的重要十字路口。"
 je_sop_arabia: "保卫麦加和麦地那"
 je_sop_arabia_reason: "保卫麦加和麦地那对于任何旨在统一伊斯兰世界的运动都至关重要，因为这些城市是伊斯兰教最神圣的圣地，对全球穆斯林具有深远的意义。\n保护和管理这些城市将增强我们在伊斯兰社会中的合法性和权威性，促进团结，增强宗教虔诚。"
 je_sop_egypt: "征服埃及"
 je_sop_egypt_reason: "控制埃及不仅可以增强领土优势，还可以让我们获得尼罗河的宝贵资源、战略贸易路线和丰富的文化遗产，从而提升我们的声誉。"
 je_sop_north_africa: "团结北非"
 je_sop_north_africa_reason: "该地区历史悠久，文化多元，是马格里布、中东和撒哈拉以南非洲的重要枢纽。\n实现这一统一将增强政治、经济和军事实力，在伊斯兰社会中形成一个更具凝聚力和影响力的整体。"
