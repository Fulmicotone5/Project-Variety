 je_actuni: "联合法案"
 je_actuni_reason: "《联合法案》是一项立法协议，旨在将大不列颠和爱尔兰王国合并为一个国家。\n为了推动这项法案，我们首先需要将爱尔兰纳入我们的势力范围，如果我们能够证明[GetCulture('irish').GetName]人民将从此次合并中受益，他们的议会可能会签署这项法案。"
