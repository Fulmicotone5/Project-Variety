 je_inqui: "重建德孔波斯特拉神圣法庭"
 je_inqui_reason: "过去几十年对[GetReligion('catholic').GetName]教会来说可谓是艰难的几十年；\n1809年教会分裂后，天主教世界陷入混乱。\n耶路撒冷、安条克、亚历山大、君士坦丁堡均被异教徒国家控制。\n罗马教皇的权威日益衰落，如果不加以干预，情况只会愈演愈烈。\n卡斯蒂利亚天主教会要求[ROOT.GetCountry.GetName]成为天主教的最后堡垒。"
 noesp: "玩家正沿着#bold 西班牙路线#!前进"
 je_remove_av: "真正的教宗"
 je_remove_av_reason: "那个骗子玷污教皇的合法性太久了。\n现在是时候除掉他了。"
 je_reclaim_holy: "夺回圣城"
 je_reclaim_holy_reason: "耶路撒冷、安条克、亚历山大和君士坦丁堡被异教徒控制已久。\n我们必须夺回它们。"
 je_por_main: "摇摇欲坠的殖民帝国"
 je_por_main_reason: "我们的殖民帝国扩张至如此规模，以至于管理难度逐年递增。\n腐败的总督和殖民地民众日益增长的不安情绪，导致我们国家的主权不断受到挑战。\n我们必须恢复在这些土地上的权威。\n#bold 进度条#!的状态每周将根据特定条件#tooltippable;tooltip:[Country.GetTooltipTag],je_por_main_advance 推进#!。"
 je_por_main_goal: "#bold 进度条#! 已达到 #bold 400#!，这意味着我们无法维持秩序"
 je_por_main_advance: "•我们每个臣民的[concept_liberty_desire]值均等于或高于50\n•非洲殖民地的[concept_turmoil]值高于30%\n•葡萄牙本土的[concept_turmoil]值高于20%\n•我们的[concept_control]低于50"
 je_pol: "重建波兰立陶宛联邦"
 je_pol_reason: "波兰立陶宛联邦在继承危机和随之而来的波兰王国分裂之后不复存在。如今波兰王国已经恢复，我们必须努力重建联邦。\n征服他们的土地并非选项，因此我们必须设法将立陶宛纳入我们的势力范围，否则在最坏的情况下，我们将不得不征服他们。"
 no_lit: "立陶宛不存在"
 je_zapa: "西斯拉夫国家"
 je_zapa_reason: "为西斯拉夫人建立一个国家的想法并不新鲜，但迄今为止，还没有哪个国家尝试过实现这一壮举。\n如今，[ROOT.GetCountry.GetName] 可以自由地构建自己的未来，许多人开始拥抱将所有西斯拉夫人重新统一在同一面旗帜下的想法。"
 je_ned_main: "一个债务缠身的国家"
 je_ned_main_reason: "过去几十年来，[ROOT.GetCountry.GetName] 多次面临破产的风险，即使将新荷兰公司出售给瑞典王国，也未能解决导致我国持续深陷巨额债务的系统性问题。\n形势严峻，如果我们无法在十年内偿还债务，国家将面临严重后果。"
 je_ned_butt: "实现紧缩政策"
 je_ned_butt_desc: "前任国王为了安抚民众而制定的福利措施，正在耗尽本已空虚的国库。\n我们可以实施一些紧缩措施来减少公共开支，但民众不会喜欢。"
 je_ned_butt_two: "私有化荷属东印度公司"
 je_ned_butt_two_desc: "联合东印度公司是我们最重要的资产之一，因此有很多富人有兴趣收购它。\n如果我们真的急需资金，可以考虑将其私有化。"
 text_je_ned_butt: "我们还没有做出决定"
 text_je_ned_butt_two: "我们还没有做出决定"
 je_ire_main: "凯尔特联邦"
 je_ire_main_reason: "将所有#bold 凯尔特人#!联合成一个联邦的想法正在[ROOT.GetCountry.GetName]人民中传播开来。\n由于英格兰和法国的积极扩张，苏格兰、威尔士和布列塔尼政府可能赞成加入我们领导的联邦，因此凯尔特联盟的建立可能不需要战争。"
 je_england_main: "迈向大不列颠"
 je_england_main_reason: ""
 je_eng_cen: "集中权力"
 je_eng_cen_reason: "几个世纪以来，[GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetNameWithCountryVariant] 一直是国王的眼中钉，严重限制了他的权力，并损害了王朝的内部稳定。\n必须采取措施，否则 [ROOT.GetCountry.GetName] 将继续落后于其他欧洲强国。\n此外，如果我们要削弱#bold Bourgeoisie#! 的权力，我们还必须确保 [GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant] 不会变得过于强大。"
 je_eng_reclaim: "夺取法兰西王冠"
 je_eng_reclaim_reason: "几个世纪前，[ROOT.GetCountry.GetName] 曾统治着法兰西王国的大部分地区。\n时光流逝，但我们的主权依然存在；如果我们征服足够多的土地，我们就能篡夺法兰西王国的头衔，成为#bold 的英法王国#!。"
