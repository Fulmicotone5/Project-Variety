 greeevintext: "我们已经放弃了宣称"
 je_vin_main: "收复格陵兰"
 je_vin_main_reason: "格陵兰，历史上是我们人民的家园，几十年前被瑞典王室入侵；因此，我们有义务追求其收复。"
 king_vin: "看着西方"
 king_vin_reason: "#V 最终，我们已放弃对格陵兰的主权主张，转而向西关注建立一个新的王国，命名为文兰。#!"
 je_nat_main: "前途未卜"
 je_nat_main_reason: "#V 意识到技术差距构成的迫在眉睫的威胁，美洲原住民国家正动员努力缩小与殖民列强的差距。\n我们必须弥合这一技术差距，否则毁灭将等待着我们。#!"
