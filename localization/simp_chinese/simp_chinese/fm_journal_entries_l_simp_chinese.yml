 je_yag_sec_reason: "#V 萨摩藩曾因对[ROOT.GetCountry.GetName]发展的贡献而备受赞誉，但现在随着参议院内极端派别点燃反萨摩情绪，称他们为非法侵略者，萨摩藩面临日益增长的怨恨。\n决定已定，皇帝已决心将萨摩藩驱逐出大陆。#!"
 je_dke_main: "联合挪威丹麦王冠"
 je_dke_main_reason: "[ROOT.GetCountry.GetRuler.GetFullName]与挪威公主继承人的婚姻将最终联合卡斯家族和库赫隆-阿莫特家族，统一丹麦与挪威的王冠，但国王最近感到有些事情似乎出了差错；\n在国王应对祖先的噩梦和即将到来的婚姻重压时，日益增加的压力可能蒙蔽他的判断，使他开始质疑自己的道路。\n在职责与某种不祥预感的撕扯中，他必须在面对恐惧并寻求清晰答案的同时，应对复杂的皇室期望。\n他能否超越自己螺旋的思想，坚定致力于统一丹麦与挪威的王冠，将最终决定两个家族的命运以及他自身的理智。"
