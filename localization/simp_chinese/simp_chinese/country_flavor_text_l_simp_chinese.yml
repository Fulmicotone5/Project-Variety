 IQU_FLAVOR_TEXT: "伊基查自治国陷入了秘鲁内战的漩涡，并站在圣克鲁斯一边。它能在这个新的邦联中保持独立吗？"
 BOL_FLAVOR_TEXT: "玻利维亚在秘鲁内战中控制了秘鲁，现在正寻求在两国之间建立邦联。这样的联合能经得起考验吗？"
 ARG_FLAVOR_TEXT: "阿根廷从西班牙赢得了独立，但现在面临着内部纷争。阿根廷能形成稳定政府吗？"
 CHL_FLAVOR_TEXT: "智利开始了政治集权之路，将权力集中在政府和教会手中。智利的未来将会如何？"
 PNI_FLAVOR_TEXT: "新生的皮拉蒂尼国大胆宣布从巴西独立，但这稚嫩的国家能存续多久？"
 GENERIC_FLAVOR_TEXT: "全球被划分为众多主权国家，每个国家都注定要攀升至拥有强大实力和影响力的境界。"
 REV_GENERIC_FLAVOR_TEXT: "这些革命者对于所谓建制政府所指定的方向不满，决定拿起武器推翻它。他们是会成功夺权，还是会如同过去无数被遗忘的革命一般被粉碎？"
 DECENTRALIZED_FLAVOR_TEXT: "该国被更有组织的势力蚕食，努力维持自治。它们会看到新世纪的黎明，抑或名字只存在于历史书上？"
 GLI_FLAVOR_TEXT: "加利西亚是一个不起眼而普通的国家，上面居住着一群大教堂狂热爱好者。加利西亚会重获过去的荣光吗？"
