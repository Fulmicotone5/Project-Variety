 MAX_FLAVOR_TEXT: "墨西哥在经历了与卡斯蒂利亚的长期战争后，最近刚刚从卡斯蒂利亚获得独立。\n这个国家仍在从战争的创伤中恢复，但至少它现在已经独立了。\n墨西哥人民的未来会是怎样的呢？"
