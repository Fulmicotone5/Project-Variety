 control_tt: "[concept_control] gets updated on a monthly basis.\nThe current [concept_control] gives us the following effects:\n[GetScriptedGui('progress_bar_tooltip_control').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]\n[concept_control] Modifiers:\n#P +10 Base\n#N -15#!/#P +15 from [GetLawGroup('lawgroup_distribution_of_power').GetName] lawgroup\n#N -10#!/#P +15 from [GetLawGroup('lawgroup_economic_system').GetName] lawgroup\n#P +5#!/#P +10 from [GetLawGroup('lawgroup_free_speech').GetName] lawgroup\n#P +10#!/#P +20 from [GetLawGroup('lawgroup_migration').GetName] lawgroup\n#N -20#!/#P +5 from [GetLawGroup('lawgroup_citizenship').GetName] lawgroup\n#P +5 from [GetLawType('law_corporate_state').GetName]\n#P +25 from [GetLawType('law_isolationism').GetName]\n#P +3/+25 from [GetInstitutionType('institution_police').GetName]\n#P +3/+20 from [GetInstitutionType('institution_home_affairs').GetName]\n#N -100 from [concept_default]\n#N -20 from empty [concept_gold_reserves]\n#N -50 from [Concept('concept_credit','$concept_credit_debt$')] being higher than 30% of the [Concept('concept_credit','$concept_credit_limit$')]\n#N -10 from $legitimacy_level_illegitimate$ or $legitimacy_level_unacceptable$\n#P +5 from $legitimacy_level_righteous$\n#N -5 from growing [concept_secession]\n#N -35 from ongoing [concept_secession]\n#N -15 from growing [concept_revolution]\n#N -50 from ongoing [concept_revolution]\n#N -15 from ongoing [concept_famine]\n#N -10 from widespread (3 or more states) [concept_shortage]\n#N -10 from having recently lost a [concept_war]\n#P +5 from Turmoil Suppression Policy\n#P +10 from Crisis Management Policy\n#P +5 per level from $principle_group_police_coordination$\n#N -3 from [concept_devastation] (>10%) per [concept_state]\n#N -4 from [concept_turmoil] (>25%) per [concept_incorporated_state]\n#N -2 from [concept_turmoil] (>25%) per [concept_unincorporated_state]\n#N -10/20/50 from [concept_infamy]\n#N -10 per [concept_subject] after the first one ([concept_protectorate], [concept_chartered_company], [concept_vassal] and [concept_tributary] do not count towards the limit)"
 